name: ci
on:
  push:
    branches: [main]
  pull_request:

# Least privilege: CI only reads the repo.
permissions:
  contents: read

jobs:
  changes:
    # On a PR, which parts its files touch; a push to main runs everything. Lint and types always run.
    runs-on: ubuntu-latest
    outputs:
      core: ${{ steps.f.outputs.core }}
      harness: ${{ steps.f.outputs.harness }}
      audio_browser: ${{ steps.f.outputs.audio_browser }}
      app_browser: ${{ steps.f.outputs.app_browser }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - id: f
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          if [ "$EVENT" != pull_request ]; then
            printf 'core=true\nharness=true\naudio_browser=true\napp_browser=true\n' >> "$GITHUB_OUTPUT"; exit 0
          fi
          files=$(git diff --name-only "$BASE"...HEAD)
          has() { printf '%s\n' "$files" | grep -qE "$1" && echo true || echo false; }
          # The core: anything that is not docs, the harness or a prototype (the workflow itself counts).
          core=$(printf '%s\n' "$files" | grep -vE '^(docs/|contrib/docs/|contrib/harness/|prototypes/)|\.md$' | grep -q . && echo true || echo false)
          echo "core=$core" >> "$GITHUB_OUTPUT"
          echo "harness=$(has '^(contrib/harness/|\.github/)')" >> "$GITHUB_OUTPUT"
          echo "app_browser=$(has '^(src/zpkt/app/|tests/app/|tests/conftest\.py|pyproject\.toml|\.github/)')" >> "$GITHUB_OUTPUT"
          echo "audio_browser=$(has '^(prototypes/audio-browser/|\.github/)')" >> "$GITHUB_OUTPUT"
          printf '%s\n' "$files" | sed 's/^/  /'; cat "$GITHUB_OUTPUT"

  test:
    name: ${{ matrix.part }}
    needs: changes
    if: needs.changes.outputs.core == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # "." is the core (zpkt.live and zpkt.audio, one uv project). Contract tests fail if output drifts from
        # lib/contracts/. The booth left for becker929/music-bot (24 Nov 2026); the check keeps its name ".".
        part: ["."]
    steps:
      # Actions are pinned to commit SHAs (tags can be moved).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
      - name: Test ${{ matrix.part }}
        working-directory: ${{ matrix.part }}
        # In parallel, then the tests that time threads and sockets alone (the Makefile's TIMED).
        run: |
          T="tests/app/test_midi_adapter.py tests/app/test_ask_service.py tests/app/test_ask_http.py"
          uv run --all-extras pytest -q -p no:cacheprovider -n auto $(printf -- '--ignore=%s ' $T)
          uv run --all-extras pytest -q -p no:cacheprovider $T

  app-browser:
    # The Playwright (WebKit) tests of the app's pages. Own job, parallel to the others; a missing browser fails.
    needs: changes
    if: needs.changes.outputs.app_browser == 'true'
    runs-on: ubuntu-latest
    env:
      ZPKT_REQUIRE_BROWSER: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
      - name: Install WebKit
        run: uv run --all-extras playwright install --with-deps webkit
      - name: Browser tests
        run: >
          uv run --all-extras pytest -q -p no:cacheprovider -n auto --reruns 2
          tests/app/test_flows.py tests/app/test_compare_page.py tests/app/test_desk_touch.py
          tests/app/test_desk_second_walk.py tests/app/test_zero_scroll.py tests/app/test_transport_page.py
          tests/app/test_layout.py tests/app/test_shell_fits.py tests/app/test_page_shell.py
          tests/app/test_shell_nav.py tests/app/test_listen_page.py
          tests/app/test_ask_flow.py tests/app/test_ask_tab.py tests/app/test_song_shell.py tests/app/test_flow_lock_banner.py

  lint-and-types:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
      - name: Lint and format
        run: uvx ruff@0.14.6 check . && uvx ruff@0.14.6 format --check .
      - name: Types
        run: uv run --all-extras mypy && uv run --all-extras mypy --config-file contrib/mixdesk/mypy.ini

  contrib:
    # The mix desk and the arranger run on the core's environment; the harness is its own uv project.
    needs: changes
    if: needs.changes.outputs.core == 'true' || needs.changes.outputs.harness == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
      - name: Mix desk
        if: needs.changes.outputs.core == 'true'
        run: uv run --all-extras pytest -q -p no:cacheprovider contrib/mixdesk/tests
      - name: Arranger
        if: needs.changes.outputs.core == 'true'
        run: uv run --all-extras pytest -q -p no:cacheprovider contrib/arranger/tests
      - name: Harness (without the browser tests)
        if: needs.changes.outputs.harness == 'true'
        working-directory: contrib/harness
        run: uv run --extra dev pytest -q -p no:cacheprovider --ignore tests/ui

  audio-browser:
    needs: changes
    if: needs.changes.outputs.audio_browser == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
      - name: Test (without the 3 GB segment extra)
        working-directory: prototypes/audio-browser
        run: uv run pytest -q -p no:cacheprovider --ignore tests/test_segment.py
