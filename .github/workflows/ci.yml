name: ci
on:
  push:
    branches: [main]
  pull_request:

# Least privilege: CI only reads the repo.
permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.part }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # "." is the core (zpkt.live and zpkt.audio, one uv project); booth is its own. Contract tests
        # fail if output drifts from lib/contracts/.
        part: [".", contrib/booth]
    steps:
      # Actions are pinned to commit SHAs (tags can be moved).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - name: Test ${{ matrix.part }}
        working-directory: ${{ matrix.part }}
        run: uv run --all-extras pytest -q -p no:cacheprovider

  audio-browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - name: Test (without the 3 GB segment extra)
        working-directory: prototypes/audio-browser
        run: uv run pytest -q -p no:cacheprovider --ignore tests/test_segment.py
