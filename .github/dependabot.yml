# Security and version updates. Grouped weekly so PRs stay few.
# The music bot and booth (becker929/music-bot) and the demo tools (becker929/zpkt-demo) left on 24 November 2026
# and have their own.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly }
  - package-ecosystem: npm
    directories: [/prototypes/audio-browser/frontend]
    schedule: { interval: weekly }
    groups: { npm: { patterns: ["*"] } }
  - package-ecosystem: uv
    directories: [/, /contrib/harness, /prototypes/audio-browser, /prototypes/checklist]
    schedule: { interval: weekly }
    groups: { python: { patterns: ["*"] } }
    ignore:
      # tensorflow_hub still imports pkg_resources, which setuptools 81 removed (prototypes/audio-browser).
      - { dependency-name: setuptools, versions: [">=81"] }
      # A local path package (prototypes/checklist -> contrib/harness). PyPI has an unrelated project with the same
      # name, and an "update" to it cannot resolve.
      - { dependency-name: harness }
