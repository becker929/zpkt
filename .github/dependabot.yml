# Security and version updates. Grouped weekly, one PR per ecosystem (security fixes included), so PRs stay few.
# The music bot and booth (becker929/music-bot) and the demo tools (becker929/zpkt-demo) left on 24 November 2026
# and have their own.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly }
    groups: { actions: { patterns: ["*"] } }
  - package-ecosystem: npm
    directories: [/prototypes/audio-browser/frontend]
    schedule: { interval: weekly }
    groups:
      npm: { patterns: ["*"] }
      npm-security: { applies-to: security-updates, patterns: ["*"] }
  - package-ecosystem: uv
    directories: [/, /contrib/harness, /prototypes/audio-browser]
    schedule: { interval: weekly }
    groups:
      python: { patterns: ["*"] }
      python-security: { applies-to: security-updates, patterns: ["*"] }
    ignore:
      # tensorflow_hub still imports pkg_resources, which setuptools 81 removed (prototypes/audio-browser).
      - { dependency-name: setuptools, versions: [">=81"] }
