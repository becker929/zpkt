# Security and version updates. Grouped weekly so PRs stay few.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly }
  - package-ecosystem: npm
    directories: [/hands/frontend, /prototypes/audio-browser/frontend]
    schedule: { interval: weekly }
    groups: { npm: { patterns: ["*"] } }
  - package-ecosystem: uv
    directories: [/hands, /ears, /ears/mlab, /taste, /engineer, /prototypes/audio-browser]
    schedule: { interval: weekly }
    groups: { python: { patterns: ["*"] } }
    ignore:
      # mcp 2 renamed FastMCP (hands/src/hands/mcp_server.py); move to it on purpose.
      - { dependency-name: mcp, update-types: ["version-update:semver-major"] }
      # tensorflow_hub still imports pkg_resources, which setuptools 81 removed (prototypes/audio-browser).
      - { dependency-name: setuptools, versions: [">=81"] }
