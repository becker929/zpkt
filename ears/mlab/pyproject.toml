[project]
name = "mlab"
version = "0.1.0"
description = "Calibrated mastering meters: loudness, true peak, dynamics, spectrum, delivery checks"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "soundfile>=0.12",
    "pyloudnorm>=0.1.1",
    "pyyaml>=6.0",
]

[project.scripts]
mlab = "mlab.cli:main"

[dependency-groups]
dev = ["pytest>=7.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["mlab"]

[tool.pytest.ini_options]
testpaths = ["calibration"]
