[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ears"
version = "0.1.0"
description = "Audio perception — AudioProfile extraction from bounced files"
requires-python = ">=3.12"
dependencies = [
    "librosa>=0.11.0",
    "numpy>=1.26.0",
    "onnxruntime>=1.20.0",
    "pyloudnorm>=0.1.1",
    "scipy>=1.11.0",
    "soundfile>=0.12.0",
    "typer>=0.12.0",
    "rich>=13.0.0",
]

[project.optional-dependencies]
# Heavy extractors — install manually after initial setup
# rhythm:   uv pip install madmom  (needs Cython at build time)
# pitch:    uv pip install basic-pitch
# stems:    uv pip install demucs
# essentia: conda install essentia (not on PyPI for all platforms)
gemini   = ["google-generativeai>=0.8.6"]

[project.scripts]
ears = "ears.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/ears"]

[dependency-groups]
dev = ["pytest>=8.0"]
