[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ears"
version = "0.1.0"
description = "Measuring renders: calibrated mastering meters (ears.meters, once mlab), profiles, a reference corpus"
requires-python = ">=3.12"
dependencies = [
    "librosa>=0.11.0",
    "numpy>=1.26.0",
    "onnxruntime>=1.20.0",
    "pyloudnorm>=0.1.1",
    "pyyaml>=6.0",
    "scipy>=1.11.0",
    "soundfile>=0.12.0",
    "typer>=0.12.0",
    "rich>=13.0.0",
]

[project.optional-dependencies]
# Heavy extractors — install manually after initial setup
# rhythm:   uv pip install madmom  (needs Cython at build time)
# pitch:    uv pip install basic-pitch
# stems:    uv pip install demucs
# essentia: conda install essentia (not on PyPI for all platforms)
gemini   = ["google-generativeai>=0.8.6"]

[project.scripts]
ears = "ears.cli:main"           # everything: profiles, the corpus and every meter
mlab = "ears.meters.cli:main"    # the mastering lab's commands, as they were when mlab was its own project

[tool.hatch.build.targets.wheel]
packages = ["src/ears", "src/mlab"]   # mlab: the old import name of ears.meters

[dependency-groups]
dev = [
    "jsonschema>=4.26.0",
    "mypy>=1.18",
    "pytest>=8.0",
]

[tool.pytest.ini_options]
# tests: ears and the meters (characterization, goldens); mlab/calibration: the meters' known-answer checks.
testpaths = ["tests", "mlab/calibration"]

[tool.mypy]
strict = true
files = ["src"]
mypy_path = "src"
# numpy's stubs type most reductions and many ufuncs as Any. Wrapping each in float() would change what some
# reports print (repr of np.float64), so returning those values is allowed; everything else is strict.
warn_return_any = false

[[tool.mypy.overrides]]
# Libraries without type information.
module = ["scipy", "scipy.*", "soundfile", "pyloudnorm", "librosa", "librosa.*", "yaml", "onnxruntime",
          "madmom", "madmom.*", "basic_pitch", "basic_pitch.*", "essentia", "essentia.*"]
ignore_missing_imports = true
