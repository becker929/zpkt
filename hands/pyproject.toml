[project]
name = "hands"
version = "0.1.0"
description = "DAW control layer — Ableton Live automation via MCP"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.0.0",
    "typer>=0.12.0",
    "rich>=13.0.0",
]

[project.optional-dependencies]
vibe = [
    "letta>=0.6.0",
    "librosa>=0.10.0",
    "mcp>=1.26.0",
    "pyloudnorm>=0.1.1",
    "pyngrok>=7.0.0",
    "starlette>=1.0.0",
    "uvicorn>=0.42.0",
]
self-improve = [
    "claude-agent-sdk>=0.1.0",
]
dev = [
    "pytest>=8.0",
    "mypy>=1.10",
]

[project.scripts]
hands = "hands.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/hands"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "mypy>=1.19.1",
    "pytest>=9.0.2",
]
