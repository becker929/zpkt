[project]
name = "hands"
version = "0.1.0"
description = "DAW control layer — Ableton Live automation via MCP"
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.5.4",
    "pydantic>=2.14.3",
    "rich>=13.0.0",
    "soundfile>=0.12",
    "typer>=0.28.0",
]

[project.optional-dependencies]
# `hands plan` (plans, the render cache, A/B every bar). Live renders also need what probe_pack uses.
plans = [
    "numpy>=2.5.4",
    "soundfile>=0.12",
    "pyloudnorm>=0.1.1",
]
# `hands serum2` (Serum 2 state codec; pedalboard/mido for offline renders and knob values).
serum = [
    "cbor2>=5.6",
    "zstandard>=0.23",
    "pedalboard>=0.9",
    "mido>=1.3",
]
dev = [
    "pytest>=9.2.0",
    "mypy>=2.4.1",
]

[project.scripts]
hands = "hands.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/hands"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "jsonschema>=4.26.0",
    "mypy>=2.4.1",
    "pytest>=9.2.0",
]
