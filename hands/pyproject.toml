[project]
name = "hands"
version = "0.1.0"
description = "DAW control layer — Ableton Live automation via MCP"
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.5.5",
    "pydantic>=2.14.3",
    "rich>=13.0.0",
    "soundfile>=0.12",
    "typer>=0.29.1",
]

[project.optional-dependencies]
# `hands serum2` (Serum 2 state codec; pedalboard/mido for offline renders and knob values).
serum = [
    "cbor2>=6.3.0",
    "zstandard>=0.23",
    "pedalboard>=0.9",
    "mido>=1.3",
]
dev = [
    "pytest>=9.2.0",
    "mypy>=2.4.1",
]

[project.scripts]
hands = "hands.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/hands"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "jsonschema>=4.26.0",
    "mypy>=2.4.1",
    "pytest>=9.2.0",
]

# mypy: `uv run --all-extras mypy` from hands/. Every module is checked; the library that drives Live (hands.live) and
# the modules written in the 2026-11 upgrade are strict, except that a reply from Live may be returned as Any: the
# LOM answers dynamic data, and each reply is parsed where its shape matters (hands.live.state, hands.live.desk).
[tool.mypy]
python_version = "3.12"
files = ["src/hands"]
ignore_missing_imports = true
warn_unused_ignores = true
warn_redundant_casts = true

# Left as is: hands.als reads ElementTree's find() without checking for None (about 75 places), so a file that is
# not a set Live wrote fails with an AttributeError rather than a message. Optional checking is off there until it
# reads through one checked helper.
[[tool.mypy.overrides]]
module = ["hands.als.*"]
strict_optional = false

# The duck-typed helpers that also run inside Live take Live's objects (song, a parameter) unannotated.
[[tool.mypy.overrides]]
module = ["hands.live.inlive.*"]
disallow_untyped_defs = false
disallow_incomplete_defs = false

[[tool.mypy.overrides]]
module = ["hands.live.*", "hands.bench", "hands.config", "hands.als_cli", "hands.kit_cli", "hands.project_cli"]
disallow_untyped_defs = true
disallow_incomplete_defs = true
disallow_untyped_calls = true
disallow_any_generics = true
check_untyped_defs = true
no_implicit_reexport = false
strict_equality = true
warn_return_any = false
