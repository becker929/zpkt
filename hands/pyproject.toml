[project]
name = "hands"
version = "0.1.0"
description = "DAW control layer — Ableton Live automation via MCP"
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.0",
    "pydantic>=2.0.0",
    "rich>=13.0.0",
    "soundfile>=0.12",
    "typer>=0.27.3",
]

[project.optional-dependencies]
# `hands plan` (plans, the render cache, A/B every bar). Live renders also need what probe_pack uses.
plans = [
    "numpy>=2.0",
    "soundfile>=0.12",
    "pyloudnorm>=0.1.1",
]
dev = [
    "pytest>=8.0",
    "mypy>=2.4.0",
]

[project.scripts]
hands = "hands.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/hands"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "jsonschema>=4.26.0",
    "mypy>=2.4.0",
    "pytest>=9.0.2",
]
