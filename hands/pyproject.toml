[project]
name = "hands"
version = "0.1.0"
description = "DAW control layer — Ableton Live automation via MCP"
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.0",
    "pydantic>=2.0.0",
    "rich>=13.0.0",
    "soundfile>=0.12",
    "typer>=0.12.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "mypy>=1.10",
]

[project.scripts]
hands = "hands.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/hands"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "jsonschema>=4.26.0",
    "mypy>=1.19.1",
    "pytest>=9.0.2",
]
