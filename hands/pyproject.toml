[project]
name = "hands"
version = "0.1.0"
description = "DAW control layer — Ableton Live automation via MCP"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.13.5",
    "typer>=0.27.2",
    "rich>=15.0.0",
]

[project.optional-dependencies]
vibe = [
    "letta>=0.33.5",
    "librosa>=1.0.0",
    "mcp>=2.2.0,<3",  # 2.x renamed FastMCP
    "pyloudnorm>=0.1.1",
    "pyngrok>=8.1.2",
    "starlette>=1.7.0",
    "uvicorn>=0.54.0",
]
self-improve = [
    "claude-agent-sdk>=0.2.160",
]
dev = [
    "pytest>=9.1.1",
    "mypy>=2.3.1",
]

[project.scripts]
hands = "hands.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/hands"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "jsonschema>=4.26.0",
    "mypy>=2.3.1",
    "pytest>=9.1.1",
]
