# One style for every Python part of zpkt. `make format` applies it; `make lint` checks it.
line-length = 120
src = ["src", "ears/mlab", "contrib/harness/src", "contrib/mixdesk", "contrib/arranger"]   # first-party packages, so imports sort as ours
target-version = "py311"   # Live's own Python is 3.11: code loaded into Live (contrib/mixdesk/pager.py) must run there
extend-exclude = [
    "agent/skills",                          # imported skills, kept as their authors wrote them
    ".claude/skills/learn-tutorial/scripts", # house skill scripts: checked by running them, not linted
    "prototypes",                            # experiments: frozen, not upgraded (Anthony, 24 Nov 2026)
    "contrib/humming",                       # research code, kept as it was
    "src/zpkt/live/remote_scripts/AbletonLiveMCP",   # vendored, kept as upstream wrote it
    "tests/live/data",                       # the Remote Script as it was before watch, kept as it was (a test compares)
]

[lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
ignore = [
    "E501",     # the formatter owns line length; long strings and URLs stay whole
    "RUF001",   # typographic quotes and dashes in user-facing text are deliberate
    "RUF002",
    "RUF003",
]

[lint.per-file-ignores]
"src/zpkt/live/remote_scripts/**" = ["SIM105", "UP031"]   # runs inside Live: kept in the plain style Live's own scripts use
"**/tests/**" = ["B011"]
# zpkt.live's tests: fakes that close over loop variables and are called inside the loop, match= patterns written as
# plain messages, small lambdas and nested with blocks that read in order.
"tests/live/**" = ["B011", "B017", "B023", "E731", "RUF043", "SIM115", "SIM117"]

[lint.flake8-bugbear]
# typer declares a command's options as default values; they are not evaluated per call.
extend-immutable-calls = ["typer.Option", "typer.Argument"]
