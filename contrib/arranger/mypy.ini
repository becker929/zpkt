# mypy for the arranger: .venv/bin/mypy --config-file contrib/arranger/mypy.ini (from the repo root)
[mypy]
python_version = 3.12
files = contrib/arranger
exclude = contrib/arranger/tests/
mypy_path = contrib/arranger:src
ignore_missing_imports = true
warn_unused_ignores = true
warn_redundant_casts = true
no_incremental = true
