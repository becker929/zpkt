<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>HW002 mix</title>
<style>
:root { --bg:#111214; --panel:#1a1c20; --line:#2a2d33; --text:#e9e9ea; --dim:#8b8f98; --accent:#ffd34d; --cut:#ff7a6b; }
* { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
html, body { margin:0; height:100%; background:var(--bg); color:var(--text); font:14px/1.3 -apple-system, system-ui, sans-serif; overscroll-behavior:none; }
body { display:flex; flex-direction:column; height:100dvh; user-select:none; -webkit-user-select:none; }
button { font:inherit; color:inherit; background:#24272d; border:1px solid var(--line); border-radius:8px; padding:0 10px; min-width:36px; height:36px; display:inline-flex; align-items:center; justify-content:center; gap:6px; }
button:active { background:#33373f; }
button svg { width:20px; height:20px; fill:none; stroke:currentColor; stroke-width:2; stroke-linecap:round; stroke-linejoin:round; }
header { display:flex; align-items:center; gap:8px; padding:8px 10px; padding-top:max(8px, env(safe-area-inset-top)); background:var(--panel); border-bottom:1px solid var(--line); }
#play { min-width:52px; height:40px; background:var(--accent); color:#111; border-color:var(--accent); }
#play svg { fill:currentColor; stroke:none; }
#pos { font-variant-numeric:tabular-nums; min-width:46px; color:var(--dim); }
#pos b { color:var(--text); font-size:17px; }
#master { flex:1; height:10px; background:#24272d; border-radius:5px; overflow:hidden; position:relative; }
#master i { position:absolute; left:0; top:0; bottom:0; background:#5fd38d; width:0; }
#master.clip i { background:#ff4d4d; }
#peak { font-size:11px; color:var(--dim); min-width:58px; text-align:right; font-variant-numeric:tabular-nums; }
#peak.clip { color:#ff4d4d; font-weight:600; }
#ruler { display:flex; height:28px; margin:6px 10px; background:#17191d; border:1px solid var(--line); border-radius:6px; overflow:hidden; position:relative; }
#ruler i { flex:1; border-left:1px solid #262930; font-style:normal; font-size:9px; color:var(--dim); padding:2px 0 0 2px; }
#ruler i.sec { border-left-color:#555a64; color:var(--text); }
#ruler i.from { background:#2d3240; }
#ruler .head { position:absolute; top:0; bottom:0; width:2px; background:#fff; display:none; }
#sketch { font-size:11px; color:var(--dim); padding:0 10px 6px; }
#sketch b { color:var(--accent); font-weight:600; }
#list { flex:1; overflow:auto; padding:0 10px 12px; -webkit-overflow-scrolling:touch; }
#list h2 { font-size:11px; letter-spacing:.06em; text-transform:uppercase; color:var(--dim); font-weight:600; margin:12px 0 4px; }
.ch { display:grid; grid-template-columns:6px 1fr auto; gap:4px 8px; align-items:center; padding:7px 0; border-bottom:1px solid var(--line); }
.ch .sw { grid-row:span 2; align-self:stretch; border-radius:3px; background:var(--c); }
.ch .name { display:flex; align-items:center; gap:6px; min-width:0; }
.ch .name span { overflow:hidden; text-overflow:ellipsis; white-space:nowrap; font-size:13px; }
.ch .meter { flex:1; height:4px; background:#24272d; border-radius:2px; overflow:hidden; min-width:30px; }
.ch .meter i { display:block; height:100%; width:0; background:#5fd38d; }
.ch .btns { display:flex; gap:4px; }
.ch .btns button { height:30px; min-width:30px; font-size:12px; padding:0 6px; }
.ch .btns button.m.on { background:#b33; border-color:#b33; color:#fff; }
.ch .btns button.s.on { background:var(--accent); border-color:var(--accent); color:#111; }
.ch .btns button.eq.set { color:var(--cut); border-color:var(--cut); }
.ch .ctl { grid-column:2 / 4; display:grid; grid-template-columns:3fr 2fr; gap:12px; align-items:center; }
.ch .ctl label:last-child output { min-width:34px; }
.ch label { display:flex; align-items:center; gap:6px; font-size:11px; color:var(--dim); }
.ch input[type=range] { flex:1; min-width:0; accent-color:var(--c); }
.ch output { min-width:50px; text-align:right; color:var(--text); font-variant-numeric:tabular-nums; font-size:12px; }
.ch.muted .ctl, .ch.muted .name { opacity:.4; }
#sheet { position:fixed; inset:0; background:rgba(0,0,0,.6); z-index:20; display:none; align-items:flex-end; justify-content:center; }
#sheet.open { display:flex; }
#sheet > div { background:var(--panel); width:100%; max-width:560px; max-height:88dvh; overflow:auto; border-radius:14px 14px 0 0; padding:12px 14px; padding-bottom:max(16px, env(safe-area-inset-bottom)); }
#sheet h3 { margin:2px 0 8px; font-size:15px; display:flex; align-items:center; gap:8px; }
#sheet h3 span { flex:1; }
#sheet canvas { width:100%; height:130px; background:#141518; border-radius:8px; display:block; margin-bottom:8px; }

.band .top button.on { background:var(--cut); border-color:var(--cut); color:#111; }
.band label { display:flex; align-items:center; gap:8px; font-size:12px; color:var(--dim); margin:4px 0; }
.band label span { width:44px; }
.band input[type=range] { flex:1; accent-color:var(--cut); }
.band output { min-width:64px; text-align:right; color:var(--text); font-variant-numeric:tabular-nums; }
.band.off label { opacity:.4; }
#sheet p { color:var(--dim); font-size:12px; margin:8px 0 0; }
#about { position:fixed; inset:0; background:rgba(0,0,0,.6); z-index:21; display:none; align-items:flex-end; justify-content:center; }
#about.open { display:flex; }
#about div { background:var(--panel); width:100%; max-width:560px; max-height:80dvh; overflow:auto; border-radius:14px 14px 0 0; padding:14px 16px; padding-bottom:max(16px, env(safe-area-inset-bottom)); font-size:13px; color:#cfd2d8; }
#about p { margin:0 0 10px; }
#load { position:fixed; inset:0; background:var(--bg); z-index:30; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:14px; }
#load div { width:220px; height:6px; background:#24272d; border-radius:3px; overflow:hidden; }
#load div i { display:block; height:100%; width:0; background:var(--accent); transition:width .15s; }
</style>
</head>
<body>
<header>
  <button id="play" aria-label="Play"></button>
  <div id="pos"><b>1</b></div>
  <div id="master"><i></i></div>
  <div id="peak">peak -</div>
  <button id="info" aria-label="About">?</button>
</header>
<div id="ruler"><div class="head"></div></div>
<div id="sketch"><b>Sketch.</b> Gain, pan and cuts in the browser, written down for Live. Not a render of the set.</div>
<div id="list"></div>
<div id="sheet"><div></div></div>
<div id="about"><div></div></div>
<div id="load"><span>Loading</span><div><i></i></div></div>
<script>
'use strict';
const $ = s => document.querySelector(s);
const el = (tag, cls, html) => { const e = document.createElement(tag); if (cls) e.className = cls; if (html != null) e.innerHTML = html; return e; };
const ICON = {
  play: '<svg viewBox="0 0 24 24"><path d="M7 4l13 8-13 8z"/></svg>',
  stop: '<svg viewBox="0 0 24 24"><rect x="5" y="5" width="14" height="14" rx="2"/></svg>',
};
const ARR_ID = 'short-8d2a2';
const FX_KINDS = { riser: ['Risers', '#62c8f2'], reverse: ['Reverse reverbs', '#c58cff'], fill: ['Fills', '#ffd34d'], downlifter: ['Downlifters', '#8aa4ff'] };
const GROUPS = [['kick', 'Kick'], ['hats', 'Hats'], ['perc', 'Perc'], ['sfx', 'Chord and splash'], ['break', 'Break'], ['fx', 'Transitions']];
const SECTIONS = [1, 9, 17, 25, 33];

let DATA, FX, ARR, CLIPS = {}, CANDS = {}, CHANNELS = [];
let ctx, buffers = {}, live = new Set(), playing = null, fromBar = 0;
let mix = { channels: {} };          // what the page writes: the arrangement's `mix`
let view = { mute: {}, solo: {} };   // listening aids only, not part of the mix

// ---------- the mix, as structure ----------
const blankEq = () => ({ hp: { on: false, freq: 30 }, lp: { on: false, freq: 18000 }, cuts: [0, 1, 2].map(k => ({ on: false, freq: [250, 1000, 4000][k], q: 1.4, gainDb: -3 })) });
function chMix(id) {
  const m = mix.channels[id] || (mix.channels[id] = { gainDb: 0, pan: 0, eq: blankEq() });
  m.eq = Object.assign(blankEq(), m.eq || {});
  return m;
}
let saveTimer;
function save() {
  clearTimeout(saveTimer);
  saveTimer = setTimeout(() => {
    const body = { made: Date.now() / 1000, note: 'Gain in dB, pan -1 (left) to 1 (right), EQ cuts as Web Audio biquads: hp and lp 12 dB/oct (Q 0.71), cuts are peaking filters with gain <= 0. Channel ids are the arrangement lanes, or fx-<kind> for transitions laid over the music; a scoop or kick fill plays on the kick channel.', channels: mix.channels };
    fetch(`/api/arrangements/${ARR_ID}/mix`, { method: 'PUT', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) });
  }, 300);
}

// ---------- audio: rendered files, through each channel's gain, pan and cuts (the named exception) ----------
function makeCtx() {
  const AC = window.AudioContext || window.webkitAudioContext;
  try { ctx = new AC({ sampleRate: DATA.rate, latencyHint: 'playback' }); } catch (e) { ctx = new AC(); }
}
async function fetchBuf(url) {
  if (buffers[url]) return buffers[url];
  const raw = await (await fetch(url)).arrayBuffer();
  return (buffers[url] = await new Promise((ok, no) => ctx.decodeAudioData(raw, ok, no)));
}
async function loadAll(urls, bar) {
  let done = 0; const q = urls.slice();
  const worker = async () => { for (let u; (u = q.shift());) { await fetchBuf(u); if (bar) bar.style.width = (100 * ++done / urls.length) + '%'; } };
  await Promise.all([1, 2, 3, 4].map(worker));
}
let masterIn, masterAn;
function buildGraph() {
  masterIn = ctx.createGain(); masterAn = ctx.createAnalyser(); masterAn.fftSize = 2048;
  masterIn.connect(ctx.destination); masterIn.connect(masterAn);
  for (const ch of CHANNELS) {
    const n = { in: ctx.createGain(), hp: ctx.createBiquadFilter(), cuts: [0, 1, 2].map(() => ctx.createBiquadFilter()), lp: ctx.createBiquadFilter(),
                gain: ctx.createGain(), mute: ctx.createGain(), pan: ctx.createStereoPanner(), an: ctx.createAnalyser() };
    n.hp.type = 'highpass'; n.lp.type = 'lowpass'; n.cuts.forEach(c => c.type = 'peaking');
    n.an.fftSize = 1024;
    let x = n.in;
    for (const f of [n.hp, ...n.cuts, n.lp, n.gain, n.mute, n.pan]) { x.connect(f); x = f; }
    x.connect(masterIn); x.connect(n.an);
    ch.nodes = n;
    applyChannel(ch, true);
  }
}
function applyChannel(ch, now) {
  const n = ch.nodes, m = chMix(ch.id), t = ctx.currentTime, k = now ? 0.001 : 0.015;
  const set = (p, v) => p.setTargetAtTime(v, t, k);
  set(n.hp.frequency, m.eq.hp.on ? m.eq.hp.freq : 10); n.hp.Q.value = 0.7071;
  set(n.lp.frequency, m.eq.lp.on ? m.eq.lp.freq : 22000); n.lp.Q.value = 0.7071;
  m.eq.cuts.forEach((c, i) => { set(n.cuts[i].frequency, c.freq); set(n.cuts[i].Q, c.q); set(n.cuts[i].gain, c.on ? Math.min(0, c.gainDb) : 0); });
  set(n.gain.gain, Math.pow(10, m.gainDb / 20));
  set(n.pan.pan, m.pan);
  applyMutes();
}
function audible(id) {
  const anySolo = Object.values(view.solo).some(Boolean);
  return !view.mute[id] && (!anySolo || view.solo[id]);
}
function applyMutes() {
  for (const ch of CHANNELS) if (ch.nodes) ch.nodes.mute.gain.setTargetAtTime(audible(ch.id) ? 1 : 0, ctx.currentTime, 0.01);
}
function start(buf, when, offset, dur, fadeIn, fadeOut, dest, gain = 1) {
  const src = ctx.createBufferSource();
  src.buffer = buf;
  const g = ctx.createGain();          // the few-millisecond fades a cut needs, and a transition's own level from its page
  g.gain.setValueAtTime(fadeIn ? 0 : gain, when);
  if (fadeIn) g.gain.linearRampToValueAtTime(gain, when + 0.004);
  if (fadeOut) { g.gain.setValueAtTime(gain, when + dur - 0.008); g.gain.linearRampToValueAtTime(0, when + dur); }
  src.connect(g); g.connect(dest);
  if (dur != null) src.start(when, offset, dur); else src.start(when, offset);
  const h = { src, out: g };
  live.add(h);
  src.onended = () => { live.delete(h); g.disconnect(); };
  return h;
}
function silence() {
  const t = ctx.currentTime;
  for (const h of live) { try { h.out.gain.cancelScheduledValues(t); h.out.gain.setValueAtTime(h.out.gain.value, t); h.out.gain.linearRampToValueAtTime(0, t + 0.012); h.src.stop(t + 0.02); } catch (e) {} }
}
const chan = id => CHANNELS.find(c => c.id === id);
function regionAt(lane, bar) { return ARR.regions.find(r => r.lane === lane && r.start <= bar && bar < r.start + r.len); }
function replacedAt(lane, bar) {   // a scoop or kick fill plays this lane's bar instead of the loop
  const beat = bar * 4;
  return (ARR.transitions || []).find(t => t.mode === 'replace' && t.lane === lane && t.startBeat <= beat && beat < t.startBeat + t.beats);
}
function scheduleBar(bar, when, first) {
  const B = DATA.barSeconds;
  for (const lane of DATA.lanes) {
    const ch = chan(lane.id); if (!ch) continue;
    if (replacedAt(lane.id, bar)) continue;
    const r = regionAt(lane.id, bar);
    if (!r) continue;
    const c = CLIPS[r.clip], buf = c && buffers['/audio/' + c.file];
    if (!buf) continue;
    const into = bar - r.start;
    if (c.kind === 'once') {
      if (into === 0 || first) { if (into < c.fileBars) start(buf, when, into * B, null, into > 0, false, ch.nodes.in); }
    } else {
      const phase = ((into + (r.off || 0)) % c.bars + c.bars) % c.bars;
      const last = into === r.len - 1;
      const nextBar = (bar + 1) % ARR.bars;
      const next = replacedAt(lane.id, nextBar);
      const rings = last && c.tail && buffers['/audio/' + c.tail] && !regionAt(lane.id, nextBar) && !next;
      start(buf, when, phase * B, B, first && phase !== 0, (last && !rings) || !!next, ch.nodes.in);
      if (rings) start(buffers['/audio/' + c.tail], when + B, 0, null, false, false, ch.nodes.in);   // what Live played after this loop stopped
    }
  }
}
function scheduleFx(passStart, from) {   // the arrangement's transitions, once per pass; from = the beat play started at
  const beat = DATA.barSeconds / 4;
  for (const t of ARR.transitions || []) {
    const c = CANDS[t.id], buf = c && buffers['/fx/audio/' + c.file];
    if (!buf) continue;
    const ch = chan(t.mode === 'replace' ? t.lane : 'fx-' + t.kind); if (!ch) continue;
    let when = passStart + t.startBeat * beat, off = 0;
    if (t.startBeat < from) {          // started before the play position: join it part way, or skip it
      off = (from - t.startBeat) * beat;
      if (off >= buf.duration) continue;
      when = passStart + from * beat;
    }
    const dur = t.mode === 'replace' ? Math.max(0.01, t.beats * beat - off) : null;
    start(buf, when, off, dur, off > 0, t.mode === 'replace', ch.nodes.in, Math.pow(10, (t.gainDb || 0) / 20));
  }
}
function play() {
  stop();
  if (ctx.state !== 'running') ctx.resume();
  peakHold = 0;
  playing = { t0: ctx.currentTime + 0.15, n: 0 };
  playing.timer = setInterval(pump, 40);
  pump();
  $('#play').innerHTML = ICON.stop; $('#ruler .head').style.display = 'block';
  requestAnimationFrame(frame);
}
function pump() {
  if (!playing) return;
  const B = DATA.barSeconds, N = ARR.bars;
  while (playing.t0 + playing.n * B < ctx.currentTime + 0.3) {
    const bar = (fromBar + playing.n) % N, when = playing.t0 + playing.n * B;
    if (playing.n === 0) scheduleFx(when - fromBar * B, fromBar * 4);
    else if (bar === 0) scheduleFx(when, 0);
    scheduleBar(bar, when, playing.n === 0);
    playing.n++;
  }
}
function stop() {
  if (!playing) return;
  clearInterval(playing.timer); playing = null;
  silence();
  $('#play').innerHTML = ICON.play; $('#ruler .head').style.display = 'none';
}
// ---------- meters: measuring is not making sound ----------
const tbuf = new Float32Array(2048);
let peakHold = 0;
function level(an) {
  const n = an.fftSize, d = tbuf.subarray(0, n);
  an.getFloatTimeDomainData(d);
  let p = 0; for (let i = 0; i < n; i++) { const v = Math.abs(d[i]); if (v > p) p = v; }
  return p;
}
const meterW = p => Math.max(0, Math.min(100, (20 * Math.log10(p + 1e-9) + 48) / 48 * 100));
function frame() {
  if (!playing) return;
  const B = DATA.barSeconds, t = ctx.currentTime - playing.t0;
  if (t >= 0) {
    const x = (fromBar + t / B) % ARR.bars;
    $('#ruler .head').style.left = (100 * x / ARR.bars) + '%';
    $('#pos').innerHTML = `<b>${Math.floor(x) + 1}</b>`;
  }
  const mp = level(masterAn); peakHold = Math.max(peakHold, mp);
  $('#master i').style.width = meterW(mp) + '%';
  $('#master').classList.toggle('clip', peakHold >= 1);
  const pk = $('#peak'); pk.textContent = 'peak ' + (20 * Math.log10(peakHold + 1e-9)).toFixed(1) + ' dB'; pk.classList.toggle('clip', peakHold >= 1);
  for (const ch of CHANNELS) if (ch.meter) ch.meter.style.width = meterW(level(ch.nodes.an)) + '%';
  requestAnimationFrame(frame);
}

// ---------- the page ----------
const fmtDb = v => (v > 0 ? '+' : v < 0 ? '−' : '') + Math.abs(v).toFixed(1) + ' dB';
const fmtPan = v => Math.abs(v) < 0.005 ? 'C' : (v < 0 ? 'L ' : 'R ') + Math.round(Math.abs(v) * 100);
const fmtHz = f => f >= 1000 ? (f / 1000).toFixed(f >= 10000 ? 1 : 2) + ' kHz' : Math.round(f) + ' Hz';
const logPos = (f, lo, hi) => Math.log(f / lo) / Math.log(hi / lo) * 1000;
const posLog = (p, lo, hi) => lo * Math.pow(hi / lo, p / 1000);
function eqSummary(m) {
  const n = m.eq.cuts.filter(c => c.on).length, bits = [];
  if (m.eq.hp.on) bits.push('HP'); if (n) bits.push(n + ' cut' + (n > 1 ? 's' : '')); if (m.eq.lp.on) bits.push('LP');
  return bits.join(' ') || 'EQ';
}
function renderRuler() {
  const r = $('#ruler'); r.querySelectorAll('i').forEach(e => e.remove());
  for (let b = 0; b < ARR.bars; b++) {
    const i = el('i', (SECTIONS.includes(b + 1) ? 'sec' : '') + (b === fromBar ? ' from' : ''), SECTIONS.includes(b + 1) ? String(b + 1) : '');
    i.onclick = () => { fromBar = b; renderRuler(); if (playing) play(); };
    r.insertBefore(i, r.querySelector('.head'));
  }
}
function slider(label, min, max, step, value, fmt, oninput, reset) {
  const l = el('label', '', `<span>${label}</span>`);
  const r = el('input'); Object.assign(r, { type: 'range', min, max, step, value });
  const o = el('output', '', fmt(Number(value)));
  r.oninput = () => { o.textContent = fmt(Number(r.value)); oninput(Number(r.value)); };
  if (reset != null) o.ondblclick = () => { r.value = reset; r.oninput(); };
  l.append(r, o);
  return l;
}
function renderList() {
  const list = $('#list'); list.innerHTML = '';
  for (const [g, title] of GROUPS) {
    const chs = CHANNELS.filter(c => c.group === g);
    if (!chs.length) continue;
    list.appendChild(el('h2', '', title));
    for (const ch of chs) {
      const m = chMix(ch.id);
      const row = el('div', 'ch' + (audible(ch.id) ? '' : ' muted'));
      row.style.setProperty('--c', ch.color);
      row.appendChild(el('div', 'sw'));
      const name = el('div', 'name', `<span>${ch.title}</span>`);
      const meter = el('div', 'meter', '<i></i>'); ch.meter = meter.firstChild; name.appendChild(meter);
      row.appendChild(name);
      const btns = el('div', 'btns');
      const mb = el('button', 'm' + (view.mute[ch.id] ? ' on' : ''), 'M'), sb = el('button', 's' + (view.solo[ch.id] ? ' on' : ''), 'S');
      const eb = el('button', 'eq' + (eqSummary(m) !== 'EQ' ? ' set' : ''), eqSummary(m));
      mb.onclick = () => { view.mute[ch.id] = !view.mute[ch.id]; applyMutes(); renderList(); };
      sb.onclick = () => { view.solo[ch.id] = !view.solo[ch.id]; applyMutes(); renderList(); };
      eb.onclick = () => openEq(ch);
      btns.append(mb, sb, eb); row.appendChild(btns);
      const ctl = el('div', 'ctl');
      ctl.appendChild(slider('Gain', -36, 6, 0.5, m.gainDb, fmtDb, v => { m.gainDb = v; applyChannel(ch); save(); }, 0));
      ctl.appendChild(slider('Pan', -1, 1, 0.01, m.pan, fmtPan, v => { m.pan = Math.abs(v) < 0.04 ? 0 : v; applyChannel(ch); save(); }, 0));
      row.appendChild(ctl);
      list.appendChild(row);
    }
  }
}
function openEq(ch) {
  const m = chMix(ch.id), box = $('#sheet > div');
  box.innerHTML = '';
  const h = el('h3', '', `<span>${ch.title}: EQ cuts</span>`);
  const done = el('button', '', 'Done'); done.onclick = () => { $('#sheet').classList.remove('open'); renderList(); };
  h.appendChild(done); box.appendChild(h);
  const cv = el('canvas'); box.appendChild(cv);
  const redraw = () => drawCurve(cv, ch);
  const changed = () => { applyChannel(ch); save(); setTimeout(redraw, 60); };
  const band = (title, b, rows) => {
    const d = el('div', 'band' + (b.on ? '' : ' off'));
    const top = el('div', 'top', `<span style="flex:1">${title}</span>`);
    const t = el('button', b.on ? 'on' : '', b.on ? 'On' : 'Off');
    t.onclick = () => { b.on = !b.on; t.textContent = b.on ? 'On' : 'Off'; t.classList.toggle('on', b.on); d.classList.toggle('off', !b.on); changed(); };
    top.appendChild(t); d.appendChild(top);
    rows.forEach(r => d.appendChild(r));
    box.appendChild(d);
  };
  band('High-pass', m.eq.hp, [slider('Freq', 0, 1000, 1, logPos(m.eq.hp.freq, 20, 2000), p => fmtHz(posLog(p, 20, 2000)), p => { m.eq.hp.freq = Math.round(posLog(p, 20, 2000)); changed(); })]);
  m.eq.cuts.forEach((c, i) => band(`Cut ${i + 1}`, c, [
    slider('Freq', 0, 1000, 1, logPos(c.freq, 30, 16000), p => fmtHz(posLog(p, 30, 16000)), p => { c.freq = Math.round(posLog(p, 30, 16000)); changed(); }),
    slider('Depth', -18, 0, 0.5, c.gainDb, fmtDb, v => { c.gainDb = v; changed(); }),
    slider('Width', 0, 1000, 1, logPos(c.q, 0.3, 12), p => 'Q ' + posLog(p, 0.3, 12).toFixed(1), p => { c.q = Math.round(posLog(p, 0.3, 12) * 100) / 100; changed(); }),
  ]));
  band('Low-pass', m.eq.lp, [slider('Freq', 0, 1000, 1, logPos(m.eq.lp.freq, 1000, 20000), p => fmtHz(posLog(p, 1000, 20000)), p => { m.eq.lp.freq = Math.round(posLog(p, 1000, 20000)); changed(); })]);
  box.appendChild(el('p', '', 'Cuts only: depth goes down to −18 dB and never above 0. These are the browser\'s filters, a sketch of where to cut; Live applies them with its own EQ when the recipe runs.'));
  $('#sheet').classList.add('open');
  requestAnimationFrame(redraw);
}
function drawCurve(cv, ch) {   // the response of this channel's filters, drawn from the nodes themselves
  const w = cv.width = cv.clientWidth * devicePixelRatio, h = cv.height = cv.clientHeight * devicePixelRatio, g = cv.getContext('2d');
  const n = 200, f = new Float32Array(n), mag = new Float32Array(n), ph = new Float32Array(n), tot = new Float32Array(n).fill(0);
  for (let i = 0; i < n; i++) f[i] = 20 * Math.pow(1000, i / (n - 1));
  for (const node of [ch.nodes.hp, ...ch.nodes.cuts, ch.nodes.lp]) { node.getFrequencyResponse(f, mag, ph); for (let i = 0; i < n; i++) tot[i] += 20 * Math.log10(mag[i] + 1e-9); }
  const y = db => h * (0.15 + 0.85 * Math.min(1, Math.max(0, -db / 24)));
  g.clearRect(0, 0, w, h);
  g.strokeStyle = '#2a2d33'; g.lineWidth = 1;
  for (const hz of [100, 1000, 10000]) { const x = w * Math.log(hz / 20) / Math.log(1000); g.beginPath(); g.moveTo(x, 0); g.lineTo(x, h); g.stroke(); }
  g.beginPath(); g.moveTo(0, y(0)); g.lineTo(w, y(0)); g.stroke();
  g.strokeStyle = '#ff7a6b'; g.lineWidth = 2 * devicePixelRatio; g.beginPath();
  for (let i = 0; i < n; i++) { const x = w * i / (n - 1); i ? g.lineTo(x, y(tot[i])) : g.moveTo(x, y(tot[i])); }
  g.stroke();
}

async function main() {
  [DATA, FX, ARR] = await Promise.all(['/loops.json', '/fx.json', '/api/arrangements/' + ARR_ID].map(u => fetch(u).then(r => r.json())));
  for (const c of DATA.clips) CLIPS[c.id] = c;
  for (const c of FX.candidates) CANDS[c.id] = c;
  if (ARR.mix && ARR.mix.channels) mix.channels = ARR.mix.channels;
  const used = new Set(ARR.regions.map(r => r.lane));
  for (const t of ARR.transitions || []) if (t.mode === 'replace' && t.lane) used.add(t.lane);
  for (const l of DATA.lanes) if (used.has(l.id)) CHANNELS.push({ id: l.id, title: l.title, group: l.group === 'kick' ? 'kick' : l.group, color: l.color });
  const kinds = [...new Set((ARR.transitions || []).filter(t => t.mode !== 'replace').map(t => t.kind))];
  for (const k of Object.keys(FX_KINDS)) if (kinds.includes(k)) CHANNELS.push({ id: 'fx-' + k, title: FX_KINDS[k][0], group: 'fx', color: FX_KINDS[k][1] });
  makeCtx(); buildGraph();
  const clips = [...new Set(ARR.regions.map(r => r.clip))].map(id => CLIPS[id]).filter(Boolean);
  const urls = [...new Set(clips.flatMap(c => c.tail ? [c.file, c.tail] : [c.file]))].map(f => '/audio/' + f);
  const fx = [...new Set((ARR.transitions || []).map(t => CANDS[t.id]).filter(Boolean).map(c => '/fx/audio/' + c.file))];
  await loadAll([...urls, ...fx], $('#load i'));
  $('#load').remove();
  $('#play').innerHTML = ICON.play;
  $('#play').onclick = () => (playing ? stop() : play());
  $('#sheet').onclick = e => { if (e.target.id === 'sheet') { $('#sheet').classList.remove('open'); renderList(); } };
  $('#info').onclick = () => $('#about').classList.add('open');
  $('#about').onclick = e => { if (e.target.id === 'about') $('#about').classList.remove('open'); };
  $('#about div').innerHTML = `<p>The first mixing step: gain balance, pan and EQ cuts, one channel per part of the canonical arrangement (8d2a2) and one per kind of transition. Tap a bar in the strip to play from there. M and S mute and solo for listening only; they are not part of the mix. Double-tap a number to reset it.</p>
<p>What this page makes is a structure, not audio: each channel's gain, pan and cuts are written into the arrangement (its <code>mix</code>), for Live to apply when the recipe runs. Distortion, EQ boosts, compression and bus processing come next, heard as small batches rendered in Live.</p>
<p>The sound is the loops and transition sounds rendered in Live, through the browser's gain, pan and filters (a named exception to the sound rule for this page). The browser's filters are not Live's EQ, and loops summed here are not the set's groups and Main reacting to each other: it is a sketch of the balance, not a render. ${DATA.check || ''}</p>`;
  renderRuler(); renderList();
}
main();
</script>
