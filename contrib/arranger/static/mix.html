<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>HW002 mix</title>
<style>
:root { --bg:#111214; --panel:#1a1c20; --line:#2a2d33; --text:#e9e9ea; --dim:#8b8f98; --accent:#ffd34d; --cut:#ff7a6b; --ref:#ffb347; --on:#7fd1ff; }
* { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
html, body { margin:0; height:100%; background:var(--bg); color:var(--text); font:14px/1.3 -apple-system, system-ui, sans-serif; overscroll-behavior:none; }
body { display:flex; flex-direction:column; height:100dvh; user-select:none; -webkit-user-select:none; }
button { font:inherit; color:inherit; background:#24272d; border:1px solid var(--line); border-radius:8px; padding:0 10px; min-width:36px; height:38px; display:inline-flex; align-items:center; justify-content:center; gap:6px; }
button:active { background:#33373f; }
button.on { background:#cfd3da; border-color:#cfd3da; color:#111; }
button svg { width:20px; height:20px; fill:currentColor; }
header { display:flex; align-items:center; gap:8px; padding:8px 10px; padding-top:max(8px, env(safe-area-inset-top)); background:var(--panel); border-bottom:1px solid var(--line); }
#play { min-width:52px; height:40px; background:var(--accent); color:#111; border-color:var(--accent); }
#pos { font-variant-numeric:tabular-nums; min-width:40px; color:var(--dim); }
#pos b { color:var(--text); font-size:17px; }
#htitle { flex:1; min-width:0; font-size:14px; font-weight:600; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
#htitle small { display:block; font-weight:400; color:var(--dim); font-size:11px; }
#peak { font-size:11px; color:var(--dim); text-align:right; font-variant-numeric:tabular-nums; }
#peak.clip { color:#ff4d4d; font-weight:600; }
main { flex:1; overflow:auto; -webkit-overflow-scrolling:touch; }
.sketch { font-size:10.5px; color:#6d717a; padding:4px 14px 0; }
.sketch b { color:#b8a35a; font-weight:500; }
main { display:flex; flex-direction:column; overflow:hidden; }
/* mini map: one tick per card, grouped by sound, left to right */
#mini { display:flex; align-items:center; gap:10px; padding:8px 14px 4px; }
#miniTrack { flex:1; display:flex; gap:5px; height:10px; align-items:stretch; }
#miniTrack .g { flex:var(--n); display:flex; gap:1px; }
#miniTrack i { flex:1; border-radius:2px; background:#25282d; cursor:pointer; }
#miniTrack i.done { background:color-mix(in srgb, var(--c) 45%, #1b1d21); }
#miniTrack i.cur { background:var(--c); box-shadow:0 0 0 1.5px #fff; }
#miniTrack .whole i { background:#30333a; }
#miniTrack .whole i.cur { background:#e9e9ea; }
#mapBtn { height:26px; font-size:11.5px; background:none; border-color:#2a2d33; color:var(--dim); }
/* the cards: one decision each, swiped left to right */
#cards { flex:1; display:flex; overflow-x:auto; overflow-y:hidden; scroll-snap-type:x mandatory; scrollbar-width:none; -webkit-overflow-scrolling:touch; }
#cards::-webkit-scrollbar { display:none; }
.card { flex:0 0 100%; scroll-snap-align:center; scroll-snap-stop:always; overflow-y:auto; padding:6px 14px 0; }
.card .face { min-height:calc(100% - 6px); }
.card .head { padding:14px 2px 2px; }
.card .head small { display:flex; align-items:center; gap:6px; color:var(--dim); font-size:12px; }
.card .head small i { width:7px; height:7px; border-radius:4px; background:var(--c); }
.card .head small em { margin-left:auto; font-style:normal; color:#5fd38d; font-size:11px; }
.card .head b { display:block; font-size:22px; font-weight:600; margin-top:4px; letter-spacing:.01em; }
.card .summary { padding:2px 2px 6px; color:#6d717a; font-size:12px; }
.card .hint { padding:40px 2px; color:#4d5159; font-size:12px; }
.wl { display:flex; align-items:center; gap:8px; padding:8px 2px; border-top:1px solid #202328; font-size:13px; }
.wl i { width:4px; height:18px; border-radius:2px; background:var(--c); }
.wl span { flex:1; }
.wl small { color:var(--dim); }
/* the map of the process */
#map { position:fixed; inset:0; background:var(--bg); z-index:25; display:none; flex-direction:column; }
#map.open { display:flex; }
#map header { justify-content:space-between; }
#map .body { flex:1; overflow:auto; padding:6px 12px 20px; }
#map h3 { font-size:11px; color:var(--dim); text-transform:uppercase; letter-spacing:.06em; margin:16px 0 8px; font-weight:600; }
.recipe { display:flex; gap:6px; overflow-x:auto; padding-bottom:4px; }
.recipe a, .recipe div { flex:0 0 auto; min-width:92px; border:1px solid var(--line); border-radius:10px; padding:8px; font-size:12px; color:var(--text); text-decoration:none; background:#16181b; }
.recipe .now { border-color:var(--accent); box-shadow:0 0 0 1px var(--accent); }
.recipe small { display:block; color:var(--dim); margin-top:2px; }
.recipe .arrow { min-width:0; border:none; background:none; padding:8px 0; color:var(--dim); align-self:center; }
.mapgrid { display:grid; grid-template-columns:repeat(auto-fill, minmax(104px, 1fr)); gap:6px; }
.mapcard { border:1px solid #23262b; border-left:3px solid var(--c); border-radius:8px; background:#15171a; padding:7px 8px; font-size:12px; text-align:left; height:auto; display:block; }
.mapcard .steps { display:flex; gap:4px; margin-top:5px; }
.mapcard .steps span { font-size:10.5px; color:#6d717a; border:1px solid #2a2d33; border-radius:5px; padding:1px 5px; }
.mapcard .steps span.done { color:#5fd38d; border-color:#2d4a37; }
.mapcard b { display:block; font-size:13px; }
.mapcard small { color:var(--dim); display:block; }
.mapcard.done { background:#17201b; }
.mapcard.cur { box-shadow:0 0 0 2px #fff; }
#listen { background:none; border:none; padding:0 2px; height:24px; font-size:11.5px; color:#6d717a; justify-content:flex-start; }
#listenOpts { display:none; padding:2px 0 6px; }
#listenOpts.open { display:block; }
.bar2 { display:flex; gap:6px; padding:4px 0 0; align-items:center; flex-wrap:wrap; }
.bar2 .lab { font-size:11px; color:#6d717a; width:40px; }
.seg { display:flex; gap:4px; flex-wrap:wrap; flex:1; }
.seg button { height:26px; font-size:11.5px; padding:0 8px; background:none; color:var(--dim); }
.seg button.on { background:#2a2d33; color:var(--text); border-color:#3a3e46; }
#curves { width:100%; height:130px; margin:8px 0 0; display:block; background:#0d0f12; border-radius:8px; }
.legend { display:flex; gap:12px; font-size:10.5px; color:#6d717a; padding:4px 0 0; flex-wrap:wrap; }
.legend i { display:inline-block; width:14px; height:3px; border-radius:2px; vertical-align:middle; margin-right:4px; }
#tabs { display:none; }
.pane { padding:14px 0 10px; }
.big { display:flex; gap:6px; }
.big button { flex:1; height:46px; font-size:15px; }
.readout { text-align:center; font-size:30px; font-weight:300; font-variant-numeric:tabular-nums; margin:18px 0 14px; }
.big button { background:none; }
.big button.on { background:#2a2d33; color:var(--text); border-color:#8b8f98; }
.fine { display:flex; align-items:center; gap:8px; font-size:12px; color:var(--dim); margin-top:10px; }
.fine input { flex:1; accent-color:#8b8f98; }
.sug { display:flex; flex-direction:column; gap:6px; margin-bottom:10px; }
.sug button { justify-content:flex-start; text-align:left; height:auto; min-height:40px; padding:6px 10px; font-size:13px; }
.sug button small { color:var(--dim); display:block; font-size:11px; }
.band { border-top:1px solid var(--line); padding:8px 0; }
.band .top { display:flex; align-items:center; gap:8px; font-size:13px; margin-bottom:4px; }
.band .top button { height:28px; font-size:12px; }
.band .top button.on { background:var(--cut); border-color:var(--cut); color:#111; }
.band label { display:flex; align-items:center; gap:8px; font-size:12px; color:var(--dim); margin:4px 0; }
.band label span { width:44px; }
.band input[type=range] { flex:1; accent-color:var(--cut); }
.band output { min-width:64px; text-align:right; color:var(--text); font-variant-numeric:tabular-nums; }
.band.off label { opacity:.4; }
.nav { display:flex; gap:8px; padding:8px 0 16px; align-items:center; }
.nav #prev { background:none; border:none; color:#6d717a; padding:0 4px; }
.nav .done { margin-left:auto; background:#1e2a22; border-color:#2d4a37; color:#7fe0a3; font-weight:500; padding:0 16px; }
/* the one A/B button */
footer { background:#141619; border-top:1px solid #202328; padding:6px 12px; padding-bottom:max(8px, env(safe-area-inset-bottom)); }
#abmodes { display:flex; gap:2px; margin-bottom:6px; }
#abmodes button { flex:1; height:24px; font-size:11px; background:none; border:none; color:#6d717a; border-radius:6px; }
#abmodes button.on { background:#24272d; color:var(--text); }
#ab { width:100%; height:48px; font-size:17px; font-weight:600; letter-spacing:.02em; display:flex; gap:0; padding:0; overflow:hidden; background:#1a1c20; }
#ab span { flex:1; height:100%; display:grid; place-items:center; color:var(--dim); }
#ab span.cur { background:#2b3a46; color:#cfe9ff; }
#ab span.pending { outline:2px dashed #fff; outline-offset:-4px; animation:pend 1.2s ease-in-out infinite; }
#ab span small { display:block; font-size:11px; font-weight:400; }
@keyframes pend { 50% { opacity:.55; } }
#ab.flash { animation:flash .45s ease-out; }
@keyframes flash { from { box-shadow:0 0 0 4px #fff; } to { box-shadow:0 0 0 0 transparent; } }
#refline { font-size:10.5px; color:#6d717a; margin-top:4px; display:flex; gap:8px; align-items:center; }
#refline span { flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
#refline button { height:24px; font-size:11px; background:none; color:var(--dim); }
#sheet { position:fixed; inset:0; background:rgba(0,0,0,.6); z-index:20; display:none; align-items:flex-end; justify-content:center; }
#sheet.open { display:flex; }
#sheet > div { background:var(--panel); width:100%; max-width:560px; max-height:80dvh; overflow:auto; border-radius:14px 14px 0 0; padding:12px 14px; padding-bottom:max(16px, env(safe-area-inset-bottom)); }
#sheet h3 { margin:6px 0; font-size:12px; color:var(--dim); font-weight:500; text-transform:uppercase; letter-spacing:.05em; }
#sheet .item { width:100%; justify-content:space-between; margin-bottom:6px; }
#sheet .item small { color:var(--dim); }
#sheet p { color:#cfd2d8; font-size:13px; }
#load { position:fixed; inset:0; background:var(--bg); z-index:30; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:14px; }
#load div { width:220px; height:6px; background:#24272d; border-radius:3px; overflow:hidden; }
#load div i { display:block; height:100%; width:0; background:var(--accent); transition:width .15s; }
</style>
</head>
<body>
<header>
  <button id="play" aria-label="Play"></button>
  <div id="pos"><b>-</b></div>
  <div id="htitle">Mix 1<small>Gain, pan and cuts, one card at a time</small></div>
  <div id="peak"></div>
  <button id="info" aria-label="About">?</button>
</header>
<main>
  <div id="mini"><div id="miniTrack"></div><button id="mapBtn">Map</button></div>
  <div class="sketch"><b>Sketch.</b> Gain, pan and cuts in the browser, written down for Live. Not a render of the set.</div>
  <section id="cards"></section>
  <section id="focus">
    <button id="listen"></button>
    <div id="listenOpts">
      <div class="bar2"><span class="lab">Under</span><div class="seg" id="under"></div></div>
      <div class="bar2"><span class="lab">Bars</span><div class="seg" id="bars"></div></div>
    </div>
    <canvas id="curves"></canvas>
    <div class="legend" id="legend"></div>
    <div id="tabs"><button data-t="level">Level</button><button data-t="pan">Pan</button><button data-t="cuts">Cuts</button></div>
    <div class="pane" id="pane"></div>
    <div class="nav"><button id="prev">← Back</button><button id="done" class="done">Done →</button></div>
  </section>
</main>
<div id="map"><header><b>The process</b><button id="mapClose">Close</button></header><div class="body"></div></div>
<footer>
  <div id="abmodes"><button data-m="ba">Before / after</button><button data-m="io">Without / with</button><button data-m="ref">Mix / reference</button></div>
  <button id="ab"><span data-s="A"></span><span data-s="B"></span></button>
  <div id="refline"><span></span><button id="pickref">Reference</button></div>
</footer>
<div id="sheet"><div></div></div>
<div id="load"><span>Loading</span><div><i></i></div></div>
<script>
'use strict';
const $ = s => document.querySelector(s);
const el = (tag, cls, html) => { const e = document.createElement(tag); if (cls) e.className = cls; if (html != null) e.innerHTML = html; return e; };
const PLAY = '<svg viewBox="0 0 24 24"><path d="M7 4l13 8-13 8z"/></svg>', STOP = '<svg viewBox="0 0 24 24"><rect x="5" y="5" width="14" height="14" rx="2"/></svg>';
const ARR_ID = 'short-8d2a2', DROP_BEAT = 64;   // 8d2a2's drop: bar 17
const FX_KINDS = { riser: ['Risers', '#62c8f2'], reverse: ['Reverse reverbs', '#c58cff'], fill: ['Fills', '#ffd34d'], downlifter: ['Downlifters', '#8aa4ff'] };
// The ladder: from the most fundamental sound up. Each is set against the ones above it.
const LADDER = ['kick', 'chord', 'break-horn', 'break-stab', 'break-chop', 'break-beatbox', 'p1-oh66', 'p2-ch27', 'p2-oh', 'p1-rd',
                'p2-rd2', 'p2-ch1', 'p2-rd1', 'crash', 'splash', 'fx-riser', 'fx-reverse', 'fx-fill', 'fx-downlifter'];
const WINDOWS = [['Break', 1, 8], ['Build', 9, 16], ['Into the drop', 13, 20], ['Drop', 17, 24], ['Peak', 25, 32], ['Horn back', 33, 40]];
const UNDER = [['set', 'Set so far'], ['all', 'Everything'], ['solo', 'Alone']];

let DATA, FX, ARR, REFS, CLIPS = {}, CANDS = {}, CHANNELS = [];
let mix = { channels: {} };
let view = { focus: null, under: 'set', win: {}, tab: 'level', mode: 'ba', ref: null };
try { Object.assign(view, JSON.parse(localStorage.getItem('mixview') || '{}')); } catch (e) {}
const saveView = () => { try { localStorage.setItem('mixview', JSON.stringify(view)); } catch (e) {} };

// ---------- the mix, as structure ----------
const blankEq = () => ({ hp: { on: false, freq: 30 }, lp: { on: false, freq: 18000 }, cuts: [0, 1, 2].map(k => ({ on: false, freq: [250, 1000, 4000][k], q: 1.4, gainDb: -3 })) });
function chMix(id) {
  const m = mix.channels[id] || (mix.channels[id] = { gainDb: 0, pan: 0, eq: blankEq() });
  m.eq = Object.assign(blankEq(), m.eq || {});
  return m;
}
let saveTimer;
function save() {
  clearTimeout(saveTimer);
  saveTimer = setTimeout(() => {
    const body = { made: Date.now() / 1000, note: 'Gain in dB, pan -1 (left) to 1 (right), EQ cuts as Web Audio biquads: hp and lp 12 dB/oct (Q 0.71), cuts are peaking filters with gain <= 0. Channel ids are the arrangement lanes, or fx-<kind> for transitions laid over the music; a scoop or kick fill plays on the kick channel. steps / done = which decisions are set on the page.', channels: mix.channels };
    fetch(`/api/arrangements/${ARR_ID}/mix`, { method: 'PUT', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) });
  }, 300);
}

// ---------- audio graph: rendered files through each channel's gain, pan and cuts (the named exception) ----------
let ctx, buffers = {}, live = new Set(), playing = null;
let mixBus, refBus, bedSum, master, anFocus, anBed, anMaster, anMix, kL, kR;
async function fetchBuf(url) {
  if (buffers[url]) return buffers[url];
  const raw = await (await fetch(url)).arrayBuffer();
  return (buffers[url] = await new Promise((ok, no) => ctx.decodeAudioData(raw, ok, no)));
}
async function loadAll(urls, bar) {
  let done = 0; const q = urls.slice();
  const worker = async () => { for (let u; (u = q.shift());) { await fetchBuf(u); if (bar) bar.style.width = (100 * ++done / urls.length) + '%'; } };
  await Promise.all([1, 2, 3, 4].map(worker));
}
function analyser() { const a = ctx.createAnalyser(); a.fftSize = 8192; a.smoothingTimeConstant = 0; return a; }
function buildGraph() {
  master = ctx.createGain(); master.connect(ctx.destination);
  mixBus = ctx.createGain(); mixBus.connect(master);     // the mix: muted while the reference plays
  refBus = ctx.createGain(); refBus.gain.value = 0; refBus.connect(master);
  bedSum = ctx.createGain();                              // everything audible but the focused sound: measured, not heard
  anFocus = analyser(); anBed = analyser(); anMaster = analyser();
  bedSum.connect(anBed); master.connect(anMaster);
  anMix = analyser(); mixBus.connect(anMix);   // the mix alone, for its curve against the reference
  // a K-weighted tap on the mix for the loudness match: BS.1770's two filters with the coefficients pyloudnorm uses
  // (refs.py measures the references with them), as IIR filters. Measured, not heard.
  const rbj = (type, G, Q, fc) => {
    const A = Math.pow(10, G / 40), w0 = 2 * Math.PI * fc / ctx.sampleRate, al = Math.sin(w0) / (2 * Q), c = Math.cos(w0);
    const [b, a] = type === 'shelf'
      ? [[A * ((A + 1) + (A - 1) * c + 2 * Math.sqrt(A) * al), -2 * A * ((A - 1) + (A + 1) * c), A * ((A + 1) + (A - 1) * c - 2 * Math.sqrt(A) * al)],
         [(A + 1) - (A - 1) * c + 2 * Math.sqrt(A) * al, 2 * ((A - 1) - (A + 1) * c), (A + 1) - (A - 1) * c - 2 * Math.sqrt(A) * al]]
      : [[(1 + c) / 2, -(1 + c), (1 + c) / 2], [1 + al, -2 * c, 1 - al]];
    return ctx.createIIRFilter(b.map(v => v / a[0]), a.map(v => v / a[0]));
  };
  const shelf = rbj('shelf', 4, Math.SQRT1_2, 1500), hp = rbj('hp', 0, 0.5, 38);
  const split = ctx.createChannelSplitter(2); kL = analyser(); kR = analyser(); kL.fftSize = kR.fftSize = 4096;
  mixBus.connect(shelf); shelf.connect(hp); hp.connect(split); split.connect(kL, 0); split.connect(kR, 1);
  for (const ch of CHANNELS) {
    const n = { in: ctx.createGain(), hp: ctx.createBiquadFilter(), cuts: [0, 1, 2].map(() => ctx.createBiquadFilter()), lp: ctx.createBiquadFilter(),
                gain: ctx.createGain(), pan: ctx.createStereoPanner(), listen: ctx.createGain(), bed: ctx.createGain(), focus: ctx.createGain() };
    n.hp.type = 'highpass'; n.lp.type = 'lowpass'; n.cuts.forEach(c => c.type = 'peaking');
    let x = n.in;
    for (const f of [n.hp, ...n.cuts, n.lp, n.gain, n.pan, n.listen]) { x.connect(f); x = f; }
    x.connect(mixBus); x.connect(n.bed); x.connect(n.focus);
    n.bed.connect(bedSum); n.focus.connect(anFocus);
    ch.nodes = n;
    applyChannel(ch, chMix(ch.id), 0);
  }
  routeListen(0);
}
function applyChannel(ch, m, when) {   // when: 0 = now, smoothly; or an audio time for an A/B switch on the beat
  const n = ch.nodes, t = when || ctx.currentTime;
  const set = (p, v) => when ? p.setValueAtTime(v, t) : p.setTargetAtTime(v, t, 0.015);
  set(n.hp.frequency, m.eq.hp.on ? m.eq.hp.freq : 10); n.hp.Q.value = 0.7071;
  set(n.lp.frequency, m.eq.lp.on ? m.eq.lp.freq : 22000); n.lp.Q.value = 0.7071;
  m.eq.cuts.forEach((c, i) => { set(n.cuts[i].frequency, c.freq); set(n.cuts[i].Q, c.q); set(n.cuts[i].gain, c.on ? Math.min(0, c.gainDb) : 0); });
  set(n.gain.gain, Math.pow(10, m.gainDb / 20));
  set(n.pan.pan, m.pan);
}
// what is heard under the focused sound: the ones set so far, everything, or it alone (listening aids, not the mix)
function audibleIds() {
  if (!view.focus) return new Set(CHANNELS.map(c => c.id));
  if (view.under === 'all') return new Set(CHANNELS.map(c => c.id));
  if (view.under === 'solo') return new Set([view.focus]);
  const k = ladder().findIndex(c => c.id === view.focus);
  return new Set(ladder().slice(0, k + 1).map(c => c.id));
}
let outFocus = false;   // the A/B "without" side
function routeListen(when) {
  const on = audibleIds(), t = when || ctx.currentTime;
  for (const ch of CHANNELS) {
    const n = ch.nodes, f = ch.id === view.focus;
    const v = on.has(ch.id) && !(f && outFocus) ? 1 : 0;
    when ? n.listen.gain.setValueAtTime(v, t) : n.listen.gain.setTargetAtTime(v, t, 0.01);
    n.bed.gain.value = f ? 0 : 1; n.focus.gain.value = f ? 1 : 0;
  }
}
function start(buf, when, offset, dur, fadeIn, fadeOut, dest, gain = 1) {
  const src = ctx.createBufferSource(); src.buffer = buf;
  const g = ctx.createGain();          // the few-millisecond fades a cut needs, and a transition's level from its page
  g.gain.setValueAtTime(fadeIn ? 0 : gain, when);
  if (fadeIn) g.gain.linearRampToValueAtTime(gain, when + 0.004);
  if (fadeOut) { g.gain.setValueAtTime(gain, when + dur - 0.008); g.gain.linearRampToValueAtTime(0, when + dur); }
  src.connect(g); g.connect(dest);
  if (dur != null) src.start(when, offset, Math.max(0.01, dur)); else src.start(when, offset);
  const h = { src, out: g };
  live.add(h); src.onended = () => { live.delete(h); g.disconnect(); };
  return h;
}
function silenceAt(t) {
  for (const h of live) { try { h.out.gain.cancelScheduledValues(t); h.out.gain.setValueAtTime(h.out.gain.value, t); h.out.gain.linearRampToValueAtTime(0, t + 0.008); h.src.stop(t + 0.012); } catch (e) {} }
}
const chan = id => CHANNELS.find(c => c.id === id);
function regionAt(lane, bar) { return ARR.regions.find(r => r.lane === lane && r.start <= bar && bar < r.start + r.len); }

  i = Math.max(0, Math.min(n - 1, i));
  box.scrollTo({ left: i * box.clientWidth, behavior: smooth ? 'smooth' : 'auto' });
  if (!smooth || Math.abs(box.scrollLeft - i * box.clientWidth) < 2) { activate(i); return; }
  setTimeout(() => {   // if the smooth scroll did not get there (a backgrounded tab does not animate), jump
    if (cardIdx !== i) { box.scrollLeft = i * box.clientWidth; activate(i); }
  }, 700);
}
function onScroll() {   // the card under the snap, once the swipe settles
  clearTimeout(scrollTimer);
  scrollTimer = setTimeout(() => {
    const box = $('#cards'); if (!box.clientWidth) return;
    const i = Math.round(box.scrollLeft / box.clientWidth);
    if (i !== cardIdx || !$('#focus').closest('.card')) activate(i);
  }, 90);
}
function activate(i) {

  cardIdx = i; view.card = key; if (step) view.tab = step; saveView();
  card.querySelector('.face').appendChild($('#focus'));
  $('#focus').classList.add('open');
  if (soundChanged) { openFocus(id); renderMini(); restart(); }
  else { openFocus(id, true); renderMini(); }   // the same sound, the next decision: keep playing as it is
}

      const c = el('button', 'mapcard' + (id !== WHOLE && chMix(id).done ? ' done' : '') + (id === curSound ? ' cur' : ''),

function listenLine(id) {

}
function openFocus(id, sameSound) {
  if (!sameSound) {
    if (side === 'A' && playing) applySide(ctx.currentTime + 0.03, false, 'B');
    side = 'B'; pendingSide = null; outFocus = false;
    smooth.focus = smooth.bed = null;
  }
  view.focus = id; saveView();
  const L = ladder(), k = L.findIndex(c => c.id === id), ch = L[k], whole = !id, step = whole ? null : view.tab;
  if (whole) { if (view.mode !== 'ref') view.modeBefore = view.mode; view.mode = 'ref'; }   // the whole-mix card compares the mix with a reference
  else if (view.modeBefore) { view.mode = view.modeBefore; view.modeBefore = null; }
  else snapshot = JSON.parse(JSON.stringify(chMix(id)));   // "before" is how this sound was when this card opened
  $('#htitle').innerHTML = whole ? 'Whole mix<small>Every sound, against a reference</small>' : `${ch.title}<small>${STEP_NAME[step]} · mix 1</small>`;
  document.querySelectorAll('#abmodes button').forEach(b => { b.disabled = whole && b.dataset.m !== 'ref'; });
  const under = $('#under'); under.innerHTML = '';
  under.parentElement.style.display = whole ? 'none' : '';

  listenLine(id);
  const curves = whole || step === 'cuts';   // the curves where they help: cutting, and the whole mix against a reference
  $('#curves').style.display = $('#legend').style.display = curves ? '' : 'none';
  $('#prev').disabled = cardIdx === 0;

function renderWhole() {
  const p = $('#pane'); p.innerHTML = '';
  ladder().forEach((c, i) => {

const fmtDb = v => (v > 0 ? '+' : v < 0 ? '−' : '') + Math.abs(v).toFixed(1) + ' dB';
const fmtPan = v => Math.abs(v) < 0.005 ? 'centre' : (v < 0 ? 'left ' : 'right ') + Math.round(Math.abs(v) * 100);
const fmtHz = f => f >= 1000 ? (f / 1000).toFixed(f >= 10000 ? 1 : 2) + ' kHz' : Math.round(f) + ' Hz';
const logPos = (f, lo, hi) => Math.log(f / lo) / Math.log(hi / lo) * 1000, posLog = (p, lo, hi) => lo * Math.pow(hi / lo, p / 1000);

}

}
// suggested cuts: where this sound's average spectrum sits close under the strongest bands of the sounds above it
function avgSpectrum(id) {
  const files = id.startsWith('fx-')
    ? (ARR.transitions || []).filter(t => t.mode !== 'replace' && 'fx-' + t.kind === id).map(t => CANDS[t.id] && CANDS[t.id].file)
    : ARR.regions.filter(r => r.lane === id).map(r => CLIPS[r.clip].file);
  const sp = files.map(f => REFS.sounds[f]).filter(Boolean);
  if (!sp.length) return null;
  const g = Math.pow(10, chMix(id).gainDb / 10);
  return sp[0].map((_, b) => 10 * Math.log10(sp.reduce((a, s) => a + Math.pow(10, s[b] / 10), 0) / sp.length * g + 1e-12));
}
const bandHz = b => FMIN * Math.pow(FMAX / FMIN, (b + 0.5) / NB);
function suggestions(id) {
  const L = ladder(), k = L.findIndex(c => c.id === id); if (k <= 0) return [];
  const me = avgSpectrum(id); if (!me) return [];
  const above = L.slice(0, k).map(c => [c, avgSpectrum(c.id)]).filter(x => x[1]);
  if (!above.length) return [];
  const out = [], peak = Math.max(...me);
  // the sounds above, band by band: who is loudest there
  const loud = me.map((_, b) => above.reduce((best, [c, s]) => (s[b] > best[1] ? [c, s[b]] : best), [null, -999]));
  const scores = me.map((v, b) => { const [c, o] = loud[b], f = bandHz(b); return f < 40 || f > 12000 || !c ? -99 : (v > peak - 30 ? Math.min(v, o) - Math.abs(v - o) : -99); });
  const picked = [];
  for (const b of scores.map((s, b) => [s, b]).sort((a, b) => b[0] - a[0]).map(x => x[1])) {
    if (scores[b] < -60 || picked.length >= 2) break;
    if (picked.some(p => Math.abs(p - b) < 8)) continue;
    picked.push(b);
  }
  for (const b of picked) {
    const f = Math.round(bandHz(b)), who = loud[b][0];
    out.push({ label: `Cut 3 dB at ${fmtHz(f)}`, why: `${who.title} is strong there and this sound sits close under it`,
               apply: m => { const c = m.eq.cuts.find(c => !c.on) || m.eq.cuts[2]; Object.assign(c, { on: true, freq: f, q: 1.4, gainDb: -3 }); } });
  }
  // a high-pass where this sound has little left and the kick is strong
  const kick = above.find(([c]) => c.id === 'kick');
  if (kick && id !== 'kick') {
    let b = 0; while (b < NB && me[b] < peak - 24) b++;
    const f = Math.round(bandHz(Math.max(0, b - 2)));
    if (f > 45 && f < 600) out.push({ label: `High-pass at ${fmtHz(f)}`, why: 'little of this sound is below there, and the kick lives there',
                                      apply: m => Object.assign(m.eq.hp, { on: true, freq: f }) });
  }
  return out;
}

<p>The A/B button switches on the next beat. Before / after: this sound as it was when you opened it, against now. Without / with: the mix without this sound. Mix / reference: the reference track at its own tempo, at the same place relative to the drop (your bar 17 = its drop), turned to the mix's loudness over the same bars (a listening aid); switching back picks the mix up where the reference has got to.</p>
<p>The curves are measured from what plays: the sound, what is under it, and the reference at the same place (dashed). What this page makes is a structure, the arrangement's <code>mix</code>, for Live to apply. The sound is the loops and transition sounds rendered in Live, through the browser's gain, pan and filters (a named exception to the sound rule for this page), so it is a sketch of the balance, not a render.</p>`;
