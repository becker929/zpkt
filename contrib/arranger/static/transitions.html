<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>HW002 transitions</title>
<style>
:root { --bg:#111214; --panel:#1a1c20; --line:#2a2d33; --text:#e9e9ea; --dim:#8b8f98; --accent:#ffd34d;
  --riser:#62c8f2; --downlifter:#8aa4ff; --reverse:#c58cff; --scoop:#ff6b5e; --fill:#ffd34d; }
* { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
html, body { margin:0; height:100%; background:var(--bg); color:var(--text); font:14px/1.3 -apple-system, system-ui, sans-serif; overscroll-behavior:none; }
body { display:flex; flex-direction:column; height:100dvh; user-select:none; -webkit-user-select:none; }
button { font:inherit; color:inherit; background:#24272d; border:1px solid var(--line); border-radius:8px; padding:0 10px; min-width:40px; height:40px; display:inline-flex; align-items:center; justify-content:center; gap:6px; }
button:active { background:#33373f; }
button svg { width:20px; height:20px; fill:none; stroke:currentColor; stroke-width:2; stroke-linecap:round; stroke-linejoin:round; }
header { display:flex; align-items:center; gap:8px; padding:8px 10px; padding-top:max(8px, env(safe-area-inset-top)); background:var(--panel); border-bottom:1px solid var(--line); }
#play { min-width:52px; background:var(--accent); color:#111; border-color:var(--accent); }
#play svg { fill:currentColor; stroke:none; }
#pos { font-variant-numeric:tabular-nums; min-width:56px; color:var(--dim); }
#pos b { color:var(--text); font-size:17px; }
header .sp { flex:1; }
#ab.off { background:#b33; border-color:#b33; color:#fff; }
#ab.pending, .chip.pending { animation:pend 1.4s ease-in-out infinite; outline:2px dashed #fff; outline-offset:-2px; }
@keyframes pend { 50% { opacity:.55; } }
#seams { display:flex; gap:6px; overflow-x:auto; padding:6px 10px; background:#15171a; border-bottom:1px solid var(--line); scrollbar-width:none; }
#seams::-webkit-scrollbar { display:none; }
#seams button { flex:none; height:34px; font-size:12.5px; white-space:nowrap; color:var(--dim); }
#seams button.on { background:var(--accent); border-color:var(--accent); color:#111; font-weight:600; }
#seams button small { opacity:.75; }
#sketch { font-size:11px; color:var(--dim); padding:5px 10px; border-bottom:1px solid var(--line); background:#15171a; }
#sketch b { color:var(--accent); font-weight:600; }
#strip { position:relative; height:86px; margin:8px 10px 4px; background:#17191d; border:1px solid var(--line); border-radius:8px; overflow:hidden; }
#strip .bar { position:absolute; top:0; bottom:0; border-left:1px solid #2b2e35; font-size:10px; color:var(--dim); padding:2px 0 0 3px; }
#strip .bar.seam { border-left:2px solid #fff; color:#fff; font-weight:600; }
#strip .lay { position:absolute; height:11px; border-radius:3px; opacity:.9; }
#strip .lay.rep { background-image:repeating-linear-gradient(45deg, rgba(0,0,0,.35) 0 4px, transparent 4px 8px); }
#strip .head { position:absolute; top:0; bottom:0; width:2px; background:#fff; display:none; }
#strip .ring { position:absolute; inset:0; pointer-events:none; }
#strip.flash::after { content:''; position:absolute; inset:0; background:linear-gradient(115deg, transparent 30%, rgba(255,255,255,.35) 50%, transparent 70%); animation:sweep .45s ease-out; }
@keyframes sweep { from { transform:translateX(-100%); } to { transform:translateX(100%); } }
#opts { display:flex; gap:6px; padding:0 10px 6px; align-items:center; font-size:12px; color:var(--dim); }
#opts button { height:30px; font-size:12px; }
#opts button.on { color:#111; background:#cfd3da; border-color:#cfd3da; }
#stack { padding:0 10px 6px; font-size:12px; color:var(--dim); min-height:20px; }
#stack b { color:var(--text); font-weight:600; }
#list { flex:1; overflow:auto; padding:0 10px 10px; -webkit-overflow-scrolling:touch; }
#list h2 { font-size:12px; letter-spacing:.06em; text-transform:uppercase; color:var(--dim); font-weight:600; margin:14px 0 6px; display:flex; gap:8px; align-items:center; }
#list h2 i { width:10px; height:10px; border-radius:2px; background:var(--c); display:inline-block; }
#list h2 small { text-transform:none; letter-spacing:0; font-weight:400; }
#list h2 .fader { margin-left:auto; display:flex; align-items:center; gap:6px; text-transform:none; letter-spacing:0; }
#list h2 input[type=range] { width:120px; accent-color:var(--c); }
#list h2 output { min-width:52px; text-align:right; font-variant-numeric:tabular-nums; color:var(--text); font-weight:500; }
.chips { display:grid; grid-template-columns:repeat(auto-fill, minmax(150px, 1fr)); gap:6px; }
.chip { position:relative; min-height:58px; border-radius:8px; border:1px solid var(--line); background:#1d2025; padding:6px 34px 6px 8px; text-align:left; font-size:12px; line-height:1.25; display:block; height:auto; justify-content:flex-start; }
.chip.on { background:var(--c); color:#0b0b0c; border-color:var(--c); }
.chip small { display:block; color:var(--dim); font-size:10.5px; margin-top:3px; }
.chip.on small { color:#2a2a2a; }
.chip .like { position:absolute; right:3px; top:3px; width:28px; min-width:28px; height:28px; padding:0; border:none; background:transparent; }
.chip .like svg { width:16px; height:16px; }
.chip .like.on svg { fill:#ff5d73; stroke:#ff5d73; }
.chip.hit { animation:hit .5s ease-out; }
@keyframes hit { 0% { box-shadow:0 0 0 0 rgba(255,255,255,.9), 0 0 0 0 rgba(255,255,255,.6); } 60% { box-shadow:0 0 0 6px rgba(255,255,255,0), 0 0 0 12px rgba(255,255,255,.15); } 100% { box-shadow:0 0 0 14px rgba(255,255,255,0), 0 0 0 20px rgba(255,255,255,0); } }
#load { position:fixed; inset:0; background:var(--bg); z-index:30; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:14px; }
#load div { width:220px; height:6px; background:#24272d; border-radius:3px; overflow:hidden; }
#load div i { display:block; height:100%; width:0; background:var(--accent); transition:width .15s; }
#about { position:fixed; inset:0; background:rgba(0,0,0,.6); z-index:20; display:none; align-items:flex-end; justify-content:center; }
#about.open { display:flex; }
#about div { background:var(--panel); width:100%; max-width:560px; max-height:80dvh; overflow:auto; border-radius:14px 14px 0 0; padding:14px 16px; padding-bottom:max(16px, env(safe-area-inset-bottom)); font-size:13px; color:#cfd2d8; }
#about p { margin:0 0 10px; }
</style>
</head>
<body>
<header>
  <button id="play" aria-label="Play"></button>
  <div id="pos"><b>-</b></div>
  <div class="sp"></div>
  <button id="ab" aria-label="Transitions on or off">With</button>
  <button id="clear" aria-label="Clear the stack">Clear</button>
  <button id="info" aria-label="About">?</button>
</header>
<nav id="seams"></nav>
<div id="sketch"><b>Sketch.</b> Loops and transition sounds rendered in Live, started together here. Not a render of the set.</div>
<div id="strip"><div class="head"></div></div>
<div id="opts">From <button data-pre="4">4 bars before</button><button data-pre="8">8 bars before</button></div>
<div id="stack"></div>
<div id="list"></div>
<div id="about"><div></div></div>
<div id="load"><span>Loading</span><div><i></i></div></div>
<script>
'use strict';
const $ = s => document.querySelector(s);
const el = (tag, cls, html) => { const e = document.createElement(tag); if (cls) e.className = cls; if (html != null) e.innerHTML = html; return e; };
const ICON = {
  play: '<svg viewBox="0 0 24 24"><path d="M7 4l13 8-13 8z"/></svg>',
  stop: '<svg viewBox="0 0 24 24"><rect x="5" y="5" width="14" height="14" rx="2"/></svg>',
  heart: '<svg viewBox="0 0 24 24"><path d="M12 20s-7-4.4-7-10a4 4 0 0 1 7-2.6A4 4 0 0 1 19 10c0 5.6-7 10-7 10z"/></svg>',
};
const KINDS = [['riser', 'Risers'], ['reverse', 'Reverse reverbs'], ['fill', 'Drum fills'], ['scoop', 'Bass scoops'], ['downlifter', 'Downlifters']];
const SEAMS = { 9: 'Break, second half', 17: 'The drop', 25: 'Peak, second 8', 33: 'Horn back', 41: 'End, back to the top' };
const ARR_ID = 'short-8d2a2';

let DATA, FX, ARR, CLIPS = {}, CANDS = {};
let ctx, buffers = {}, live = new Set(), playing = null;
let state = { seam: 17, pre: 4, picks: {}, gains: {} };   // picks[seam] = { stack, liked }; gains[seam][kind] = dB
let on = true, onPending = null;
const POST = 4;

function seamPicks(s = state.seam) { return state.picks[s] || (state.picks[s] = { stack: [], liked: [] }); }
function gainDb(kind, s = state.seam) { return (state.gains[s] || {})[kind] || 0; }

// ---------- audio: rendered files, started on the audio clock, as rendered ----------
function makeCtx() {
  const AC = window.AudioContext || window.webkitAudioContext;
  try { ctx = new AC({ sampleRate: DATA.rate, latencyHint: 'playback' }); } catch (e) { ctx = new AC(); }
}
async function fetchBuf(url) {
  if (buffers[url]) return buffers[url];
  const raw = await (await fetch(url)).arrayBuffer();
  return (buffers[url] = await new Promise((ok, no) => ctx.decodeAudioData(raw, ok, no)));
}
async function loadAll(urls, bar) {
  let done = 0; const q = urls.slice();
  const worker = async () => { for (let u; (u = q.shift());) { await fetchBuf(u); if (bar) bar.style.width = (100 * ++done / urls.length) + '%'; } };
  await Promise.all([1, 2, 3, 4].map(worker));
}
function start(buf, when, offset, dur, fadeIn, fadeOut, dest = ctx.destination) {
  const src = ctx.createBufferSource();
  src.buffer = buf;
  let node = src;
  if (fadeIn || fadeOut) {             // only the few-millisecond fade a cut needs
    const g = ctx.createGain();
    if (fadeIn) { g.gain.setValueAtTime(0, when); g.gain.linearRampToValueAtTime(1, when + 0.004); }
    if (fadeOut) { g.gain.setValueAtTime(1, when + dur - 0.008); g.gain.linearRampToValueAtTime(0, when + dur); }
    src.connect(g); node = g;
  }
  const out = ctx.createGain();        // unity; used to end the sound cleanly on Stop
  node.connect(out); out.connect(dest);
  if (dur != null) src.start(when, offset, dur); else src.start(when, offset);
  const h = { src, out };
  live.add(h);
  src.onended = () => { live.delete(h); out.disconnect(); };
  return h;
}
function silence(set) {
  const t = ctx.currentTime;
  for (const h of set) {
    try { h.out.gain.cancelScheduledValues(t); h.out.gain.setValueAtTime(1, t); h.out.gain.linearRampToValueAtTime(0, t + 0.012); h.src.stop(t + 0.02); } catch (e) {}
  }
}

// The one named exception to the sound rule (contrib/docs/sound.md): a plain gain per kind of transition sound at
// the section change shown, set by its fader. Nothing else touches the sound.
const kindGain = {};
function kindNode(kind) {
  if (!kindGain[kind]) { kindGain[kind] = ctx.createGain(); kindGain[kind].connect(ctx.destination); }
  return kindGain[kind];
}
function applyGains() {
  for (const [kind] of KINDS) kindNode(kind).gain.setTargetAtTime(Math.pow(10, gainDb(kind) / 20), ctx.currentTime, 0.01);
}

// The window: `pre` bars before the seam and POST after it, in the arrangement's bars (0-based, wrapping at the end).
function windowBars() {
  const s = state.seam - 1, out = [];
  for (let k = -state.pre; k < POST; k++) out.push(((s + k) % ARR.bars + ARR.bars) % ARR.bars);
  return out;
}
function regionAt(lane, bar) { return ARR.regions.find(r => r.lane === lane && r.start <= bar && bar < r.start + r.len); }
function replaced(lane, k) {   // is window bar k (bars from the seam) covered by a stacked replace candidate on this lane?
  if (!on) return null;
  for (const id of seamPicks().stack) {
    const c = CANDS[id];
    if (c && c.mode === 'replace' && c.lane === lane && c.start / 4 <= k && k < c.end / 4) return c;
  }
  return null;
}
function scheduleBar(i, when, first) {
  const B = DATA.barSeconds, bars = windowBars(), bar = bars[i], k = i - state.pre;
  for (const lane of DATA.lanes) {
    if (replaced(lane.id, k)) continue;
    const r = regionAt(lane.id, bar);
    if (!r) continue;
    const c = CLIPS[r.clip], buf = c && buffers['/audio/' + c.file];
    if (!buf) continue;
    const into = bar - r.start;
    if (c.kind === 'once') {
      if (into === 0 || first) { if (into < c.fileBars) start(buf, when, into * B, null, into > 0, false); }
    } else {
      const phase = ((into + (r.off || 0)) % c.bars + c.bars) % c.bars;
      const lastHere = into === r.len - 1 || i === bars.length - 1;
      const nextReplaced = replaced(lane.id, k + 1);
      const rings = into === r.len - 1 && c.tail && buffers['/audio/' + c.tail] && !regionAt(lane.id, (bar + 1) % ARR.bars) && !nextReplaced;
      start(buf, when, phase * B, B, first && phase !== 0, lastHere && !rings || !!nextReplaced);
      if (rings) start(buffers['/audio/' + c.tail], when + B, 0, null, false, false);   // what Live played after this loop stopped
    }
  }
}
function scheduleFx(passStart) {   // the stacked candidates, once per pass of the window
  if (!on) return;
  const B = DATA.barSeconds, beat = B / 4, seamT = passStart + state.pre * B, end = passStart + (state.pre + POST) * B;
  for (const id of seamPicks().stack) {
    const c = CANDS[id], buf = c && buffers['/fx/audio/' + c.file];
    if (!buf) continue;
    let t = seamT + c.start * beat, off = 0;
    if (t < passStart) { off = passStart - t; t = passStart; }
    if (t >= end || off >= buf.duration) continue;
    const dur = c.mode === 'replace' ? Math.min(buf.duration - off, end - t) : null;
    start(buf, t, off, dur, off > 0, c.mode === 'replace', kindNode(c.kind));
    landed(id, t);
  }
}
function landed(id, when) {   // the chip lights when its sound reaches the speaker, not when it was tapped
  setTimeout(() => {
    const chip = document.querySelector(`.chip[data-id="${id}"]`);
    if (chip) { chip.classList.remove('pending', 'hit'); void chip.offsetWidth; chip.classList.add('hit'); }
  }, Math.max(0, (when - ctx.currentTime) * 1000));
}
function play() {
  stop();
  if (ctx.state !== 'running') ctx.resume();
  playing = { t0: ctx.currentTime + 0.15, n: 0 };
  playing.timer = setInterval(pump, 40);
  pump();
  $('#play').innerHTML = ICON.stop; $('#strip .head').style.display = 'block';
  requestAnimationFrame(frame);
}
function pump() {
  if (!playing) return;
  const B = DATA.barSeconds, N = state.pre + POST;
  while (playing.t0 + playing.n * B < ctx.currentTime + 0.3) {
    const i = playing.n % N, when = playing.t0 + playing.n * B;
    if (i === 0) {
      if (onPending !== null) { on = onPending; onPending = null; abShow(when); }
      scheduleFx(when);
    }
    scheduleBar(i, when, playing.n === 0);
    playing.n++;
  }
}
function stop() {
  if (!playing) return;
  clearInterval(playing.timer); playing = null;
  silence(live);
  $('#play').innerHTML = ICON.play; $('#strip .head').style.display = 'none';
  $('#pos').innerHTML = '<b>-</b>';
}
function frame() {
  if (!playing) return;
  const B = DATA.barSeconds, N = state.pre + POST, t = ctx.currentTime - playing.t0;
  if (t >= 0) {
    const x = (t / B) % N;
    $('#strip .head').style.left = (100 * x / N) + '%';
    const bars = windowBars();
    $('#pos').innerHTML = `<b>${bars[Math.floor(x)] + 1}</b>`;
  }
  requestAnimationFrame(frame);
}
function restartIfPlaying() { if (playing) play(); }

// ---------- the page ----------
function seamCands(s) { return FX.candidates.filter(c => c.seams.includes(s)); }
function renderSeams() {
  const nav = $('#seams'); nav.innerHTML = '';
  for (const s of Object.keys(SEAMS).map(Number)) {
    const n = seamPicks(s).stack.length;
    const b = el('button', s === state.seam ? 'on' : '', `Bar ${s === 41 ? '40 → 1' : s} <small>${SEAMS[s]}${n ? ' · ' + n : ''}</small>`);
    b.onclick = () => { state.seam = s; save(); renderAll(); applyGains(); prefetch(); restartIfPlaying(); };
    nav.appendChild(b);
  }
}
function renderStrip() {
  const strip = $('#strip'), N = state.pre + POST, bars = windowBars();
  strip.querySelectorAll('.bar, .lay').forEach(e => e.remove());
  bars.forEach((b, i) => {
    const d = el('div', 'bar' + (i === state.pre ? ' seam' : ''), String(b + 1));
    d.style.left = (100 * i / N) + '%'; strip.appendChild(d);
  });
  seamPicks().stack.forEach((id, row) => {
    const c = CANDS[id]; if (!c) return;
    const a = Math.max(0, state.pre + c.start / 4), z = Math.min(N, state.pre + Math.max(c.end, c.start + c.seconds / (DATA.barSeconds / 4)) / 4);
    if (z <= 0 || a >= N) return;
    const lay = el('div', 'lay' + (c.mode === 'replace' ? ' rep' : ''));
    lay.style.left = (100 * a / N) + '%'; lay.style.width = (100 * (z - a) / N) + '%';
    lay.style.top = (18 + row * 13) + 'px'; lay.style.background = `var(--${c.kind})`;
    strip.appendChild(lay);
  });
}
function renderStack() {
  const ids = seamPicks().stack;
  $('#stack').innerHTML = ids.length ? 'Stacked: ' + ids.map(id => `<b>${CANDS[id]?.title || id}</b>`).join(' + ') : 'Nothing stacked: tap sounds below to lay them over the change, one of each kind.';
}
function renderList() {
  const list = $('#list'); list.innerHTML = '';
  const picks = seamPicks(), cs = seamCands(state.seam);
  for (const [kind, title] of KINDS) {
    const these = cs.filter(c => c.kind === kind);
    const h = el('h2', '', `<i style="--c:var(--${kind})"></i>${title} <small>${these.length}</small>`);
    h.style.setProperty('--c', `var(--${kind})`);
    if (these.length) {
      const f = el('label', 'fader');
      const r = el('input'); Object.assign(r, { type: 'range', min: -24, max: 12, step: 0.5, value: gainDb(kind) });
      r.setAttribute('aria-label', `${title} level`);
      const o = el('output', '', fmtDb(gainDb(kind)));
      r.oninput = () => { (state.gains[state.seam] ||= {})[kind] = Number(r.value); o.textContent = fmtDb(Number(r.value)); applyGains(); save(); };
      o.ondblclick = () => { r.value = 0; r.oninput(); };
      f.append(r, o); h.appendChild(f);
    }
    list.appendChild(h);
    if (!these.length) { list.appendChild(el('div', 'hint', kind === 'scoop' && state.seam === 9 ? '<small style="color:var(--dim)">No kick here to scoop.</small>' : '')); continue; }
    const grid = el('div', 'chips');
    for (const c of these) {
      const chip = el('button', 'chip' + (picks.stack.includes(c.id) ? ' on' : ''));
      chip.dataset.id = c.id; chip.style.setProperty('--c', `var(--${kind})`);
      chip.innerHTML = `${c.title}<small>${c.mode === 'replace' ? 'in place of the kick, ' : ''}${where(c)} · peak ${c.peakDb} dB</small>`;
      const like = el('button', 'like' + (picks.liked.includes(c.id) ? ' on' : ''), ICON.heart);
      like.setAttribute('aria-label', 'Keep');
      like.onclick = e => { e.stopPropagation(); toggle(picks.liked, c.id); like.classList.toggle('on'); save(); };
      chip.appendChild(like);
      chip.onclick = () => choose(c, chip);
      grid.appendChild(chip);
    }
    list.appendChild(grid);
  }
}
function fmtDb(v) { return (v > 0 ? '+' : v < 0 ? '\u2212' : '') + Math.abs(v).toFixed(1) + ' dB'; }
function where(c) {
  const b = x => (Math.abs(x) % 4 === 0 ? `${Math.abs(x) / 4} bar${Math.abs(x) === 4 ? '' : 's'}` : `${Math.abs(x)} beat${Math.abs(x) === 1 ? '' : 's'}`);
  if (c.end <= 0) return `${b(c.start)} before`;
  if (c.start >= 0) return `${b(c.end)} after`;
  return 'across';
}
function toggle(list, id) { const i = list.indexOf(id); if (i >= 0) list.splice(i, 1); else list.push(id); }
async function choose(c, chip) {
  const picks = seamPicks();
  if (picks.stack.includes(c.id)) picks.stack = picks.stack.filter(x => x !== c.id);
  else {   // one of each kind; two replace sounds on one lane cannot both play
    picks.stack = picks.stack.filter(x => CANDS[x].kind !== c.kind && !(c.mode === 'replace' && CANDS[x].mode === 'replace' && CANDS[x].lane === c.lane));
    picks.stack.push(c.id);
    if (playing) chip.classList.add('pending');   // audible from the next pass
    await fetchBuf('/fx/audio/' + c.file);
  }
  save(); renderAll();
  if (playing && picks.stack.includes(c.id)) document.querySelector(`.chip[data-id="${c.id}"]`)?.classList.add('pending');
}
function abShow(when) {
  setTimeout(() => {
    const b = $('#ab'); b.classList.remove('pending'); b.classList.toggle('off', !on); b.textContent = on ? 'With' : 'Without';
    const s = $('#strip'); s.classList.remove('flash'); void s.offsetWidth; s.classList.add('flash');
  }, Math.max(0, (when - ctx.currentTime) * 1000));
}
function renderAll() {
  renderSeams(); renderStrip(); renderStack(); renderList();
  document.querySelectorAll('#opts button').forEach(b => b.classList.toggle('on', Number(b.dataset.pre) === state.pre));
}
function prefetch() { loadAll(seamCands(state.seam).map(c => '/fx/audio/' + c.file)); }
// What the page produces: the arrangement's transitions, as a structure Live can build. Beats are the arrangement's
// (0 = bar 1); a change at "bar 41" is the end of the arrangement going back to bar 1, so what comes after it is at
// the start. Each pick carries the recipe that made its sound (fx.json).
function structure() {
  const out = [];
  for (const [s, p] of Object.entries(state.picks)) {
    const seamBeat = (Number(s) - 1) * 4, len = ARR.bars * 4;
    for (const id of p.stack) {
      const c = CANDS[id]; if (!c) continue;
      const at = b => ((seamBeat + b) % len + len) % len;
      out.push({ seam: Number(s), id, kind: c.kind, title: c.title, mode: c.mode, lane: c.lane || null,
                 startBeat: at(c.start), beats: c.end - c.start, gainDb: gainDb(c.kind, s), recipe: c.recipe });   // past the end wraps to bar 1
    }
  }
  return out.sort((a, b) => a.seam - b.seam || a.startBeat - b.startBeat);
}
let saveTimer;
function save() {
  clearTimeout(saveTimer);
  saveTimer = setTimeout(() => {
    const json = { method: 'PUT', headers: { 'Content-Type': 'application/json' } };
    fetch('/api/transitions', { ...json, body: JSON.stringify(state) });
    fetch(`/api/arrangements/${ARR_ID}/transitions`, { ...json, body: JSON.stringify(structure()) });
  }, 300);
}

async function main() {
  [DATA, FX, ARR] = await Promise.all(['/loops.json', '/fx.json', '/api/arrangements/' + ARR_ID].map(u => fetch(u).then(r => r.json())));
  for (const c of DATA.clips) CLIPS[c.id] = c;
  for (const c of FX.candidates) CANDS[c.id] = c;
  try { const s = await (await fetch('/api/transitions')).json(); if (s && s.picks) state = Object.assign(state, s); } catch (e) {}
  makeCtx();
  const used = [...new Set(ARR.regions.map(r => r.clip))].map(id => CLIPS[id]).filter(Boolean);
  const urls = [...new Set(used.flatMap(c => c.tail ? [c.file, c.tail] : [c.file]))].map(f => '/audio/' + f);
  const stacked = Object.values(state.picks).flatMap(p => p.stack).filter(id => CANDS[id]).map(id => '/fx/audio/' + CANDS[id].file);
  await loadAll([...urls, ...new Set(stacked)], $('#load i'));
  $('#load').remove();
  $('#play').innerHTML = ICON.play;
  $('#play').onclick = () => (playing ? stop() : play());
  $('#ab').onclick = () => {
    const want = onPending === null ? !on : !onPending;
    if (!playing) { on = want; onPending = null; $('#ab').classList.toggle('off', !on); $('#ab').textContent = on ? 'With' : 'Without'; return; }
    onPending = want === on ? null : want; $('#ab').classList.toggle('pending', onPending !== null);
  };
  $('#clear').onclick = () => { seamPicks().stack = []; save(); renderAll(); };
  document.querySelectorAll('#opts button').forEach(b => b.onclick = () => { state.pre = Number(b.dataset.pre); save(); renderAll(); restartIfPlaying(); });
  $('#info').onclick = () => $('#about').classList.add('open');
  $('#about').onclick = e => { if (e.target.id === 'about') $('#about').classList.remove('open'); };
  $('#about div').innerHTML = `<p>The canonical arrangement (8d2a2) around one section change, looping. Tap sounds to stack them over the change, one of each kind; the heart keeps a sound you like. With / Without switches the whole stack on or off from the next pass. Each kind has a level fader for this change (double-tap the number for 0 dB); it is the one thing this page does to sound, a plain gain, and the level is saved with the picks for Live to apply.</p>
<p>What this page makes is a structure, not audio: the stack at each change is written into the arrangement (its transitions), each pick with its beats and the Live recipe that made it, to be built into the set and rendered in Live.</p>
<p>Every sound you hear was made in Live, in a copy of ${DATA.set} (${FX.set}), through the set's own tracks and Main: noise and Operator risers and downlifters with Auto Filter sweeps, reverse reverbs of the set's own hits through Live's Reverb (turned around after the render, as Live's Rev button does), bass scoops with an EQ Eight on the kick group, fills on the set's hat racks and kick, and on Live's 909 Core Kit. A scoop or a kick fill plays in place of the kick's bars. This page only starts those files on the beat, at their rendered level; it makes no sound of its own.</p>
<p>It is a sketch: in the set, a riser shares Main's chain with everything else, so levels and glue here are only close. ${FX.check || ''}</p>`;
  state.gains = state.gains || {};
  applyGains(); renderAll(); prefetch();
}
main();
</script>
</body>
</html>
