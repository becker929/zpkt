[project]
name = "booth"
version = "0.1.0"
description = "The booth: scores in, Live renders out, for the Bluesky music bot (contrib/docs/design/bluesky-bot.md)"
requires-python = ">=3.12"
dependencies = [
    "aiohttp>=3.14.4",
    "hands",
    "numpy>=2.0",
    "pillow>=11",
    "pydantic>=2.0.0",
    "pyloudnorm>=0.1.1",
    "soundfile>=0.12",
]

[project.scripts]
booth = "booth.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv.sources]
hands = { path = "../../hands", editable = true }

[tool.hatch.build.targets.wheel]
packages = ["src/booth"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[dependency-groups]
dev = [
    "jsonschema>=4.26.0",
    "pytest>=9.0.2",
    "pytest-asyncio>=0.23",
]
