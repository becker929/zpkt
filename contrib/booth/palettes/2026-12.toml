# The booth's palette, December 2026: what a score may name. 2026-11's eleven instruments, unchanged, and forty more
# from Live 12 Suite's Core Library, so the rooms' loops stop sounding alike: basses, leads and plucks, pads and
# strings, brass and winds, pianos and organs, guitars and harp, mallets and bells, seven drum kits, two textures.
# Core Library only: nothing purchased, nothing of Anthony's, nothing in iCloud. Every new one was loaded, played and
# measured in Live by `booth survey --palette 2026-12 --listen` (2026-12.survey.json: devices, pads, macros, loudness).
#
# A score sees ids, roles, ranges, `about` and macro names (GET /v1/guide). `load`, `fx`, `set` and the macro mappings
# never leave the booth. Roles say what a part does: bass, lead (a tune), keys (chords and comping), pluck (short
# notes, ostinatos), pad (held notes), drums (pads 36-51), texture (a bed of noise or weather).
# `trim` is the starting volume in dB. The old eleven keep SH001's; a new one's trim brings its measured loudness at
# 0 dB to the old ones' median (`lufs` + `trim` in the survey), rounded, so a part at gain 0 sits near the others.
# A macro maps a score's 0..1 linearly between `lo` and `hi`, in the units Live shows for that rack macro (the
# survey's `macros`: name, value, min, max). A score with eight new parts and their macros rendered clean on
# 2026-11-02 (-14.5 LUFS, no flags). None of the forty was dropped; Rainstorm needed a Utility, as Music Box does.
#
# A palette is never edited once a score has used it: make the next month's file instead, so old scores render the same.
# The booth serves 2026-11 until config.toml (`palette = "2026-12"`) or palette.SERVED says otherwise.

version = "2026-12"

