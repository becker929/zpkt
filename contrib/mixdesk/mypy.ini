# mypy for the mix desk: hands/.venv/bin/mypy --config-file contrib/mixdesk/mypy.ini (from the repo root)
[mypy]
python_version = 3.12
files = contrib/mixdesk
exclude = contrib/mixdesk/tests/
mypy_path = contrib/mixdesk:hands/src
ignore_missing_imports = true
warn_unused_ignores = true
warn_redundant_casts = true
no_incremental = true
