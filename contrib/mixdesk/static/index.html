<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>HW002 mix desk</title>
<style>
:root {
  --bg: #0e0f12; --panel: #17191e; --panel2: #1e2128; --line: #2c3039; --text: #e9eaee; --muted: #8b909c;
  --accent: #ffb547; --accent-dim: #ffb54733; --on: #5fd38d; --ghost: #7aa7ff; --err: #ff6b6b;
  --fs: 12px;
}
@media (prefers-color-scheme: light) {
  :root { --bg: #f3f2ef; --panel: #ffffff; --panel2: #f6f5f2; --line: #dedbd4; --text: #1c1d21; --muted: #6c6f78;
          --accent: #d9820b; --accent-dim: #d9820b2a; --on: #1f9d55; --ghost: #3c6fd8; --err: #c93a3a; }
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text);
  font: var(--fs)/1.3 -apple-system, BlinkMacSystemFont, "SF Pro Text", "Inter", system-ui, sans-serif; }
body { display: flex; flex-direction: column; min-height: 100vh; }
header { display: flex; align-items: center; gap: 16px; padding: 10px 16px; border-bottom: 1px solid var(--line); flex-wrap: wrap; }
header h1 { font-size: 15px; margin: 0; letter-spacing: .02em; font-weight: 650; }
header .armed { font-size: 15px; color: var(--accent); font-weight: 650; }
header .what { color: var(--muted); flex: 1; min-width: 200px; }
.status { display: flex; align-items: center; gap: 6px; color: var(--muted); }
.dot { width: 8px; height: 8px; border-radius: 50%; background: var(--err); }
.dot.ok { background: var(--on); }
nav { display: flex; gap: 6px; padding: 8px 16px; border-bottom: 1px solid var(--line); overflow-x: auto; }
nav button { flex: 0 0 auto; display: flex; align-items: center; gap: 8px; background: var(--panel); color: var(--text);
  border: 1px solid var(--line); border-radius: 8px; padding: 7px 12px; font: inherit; cursor: pointer; }
nav button .pad { font: 600 10px ui-monospace, Menlo, monospace; color: var(--muted); border: 1px solid var(--line);
  border-radius: 4px; padding: 1px 4px; }
nav button.on { border-color: var(--accent); background: var(--accent-dim); }
nav button.on .pad { color: var(--accent); border-color: var(--accent); }
main { flex: 1; display: grid; gap: 10px; padding: 10px 16px; grid-template-columns: repeat(4, minmax(0, 1fr)); grid-auto-rows: 1fr; }
.card { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 10px; display: flex;
  flex-direction: column; gap: 8px; cursor: pointer; transition: border-color .15s, opacity .15s; min-width: 0; }
.card:not(.on) { opacity: .72; }
.card:not(.on):hover { opacity: 1; }
.card.on { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent) inset; opacity: 1; cursor: default; }
.card h2 { margin: 0; font-size: 13px; display: flex; align-items: baseline; gap: 8px; }
.card h2 .pad { font: 600 10px ui-monospace, Menlo, monospace; color: var(--muted); }
.card.on h2 .pad { color: var(--accent); }
.card h2 .chip { margin-left: auto; font-size: 10px; font-weight: 700; letter-spacing: .08em; color: var(--accent); }
.card .what { color: var(--muted); font-size: 11px; min-height: 2.6em; }
.body { display: grid; grid-template-columns: 1fr auto; gap: 10px; flex: 1; align-items: start; }
.knobs { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 6px 4px; align-content: start; }
.knob { display: flex; flex-direction: column; align-items: center; gap: 1px; min-width: 0; border-radius: 6px; padding: 2px 0; }
.knob svg { width: 50px; height: 50px; }
.knob .arc-bg { stroke: var(--line); }
.knob .arc { stroke: var(--text); }
.card.on .knob .arc { stroke: var(--accent); }
.lbl { font-size: 11px; text-align: center; line-height: 1.15; max-width: 100%; overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; min-height: 2.3em; }
.val { font: 10px ui-monospace, Menlo, monospace; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 100%; }
.slot { font: 600 9px ui-monospace, Menlo, monospace; color: var(--muted); opacity: .8; }
.faders { display: grid; grid-template-columns: repeat(4, 48px); gap: 4px; }
.fader { display: flex; flex-direction: column; align-items: center; gap: 2px; min-width: 0; border-radius: 6px; }
.track { position: relative; width: 14px; height: 150px; border-radius: 6px; background: var(--panel2); border: 1px solid var(--line); overflow: hidden; }
.track .fill { position: absolute; left: 0; right: 0; bottom: 0; background: var(--text); opacity: .85; }
.card.on .track .fill { background: var(--accent); }
.track .ghost { position: absolute; left: -2px; right: -2px; height: 2px; background: var(--ghost); display: none; }
.fader.waiting .ghost { display: block; }
.fader .lbl, .fader .val { max-width: 48px; }
.pads { display: grid; grid-template-columns: repeat(8, minmax(0, 1fr)); gap: 4px; }
.padb { border: 1px solid var(--line); border-radius: 6px; background: var(--panel2); padding: 4px 2px; min-height: 46px;
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 1px; min-width: 0; cursor: pointer; }
.padb.lit { background: color-mix(in srgb, var(--on) 22%, var(--panel2)); border-color: var(--on); }
.padb.empty, .knob.empty, .fader.empty { opacity: .28; cursor: default; }
.padb .lbl { font-size: 10px; min-height: 0; }
.err .val { color: var(--err); }
.flash { animation: flash .6s ease-out; }
@keyframes flash { 0% { background: var(--accent-dim); box-shadow: 0 0 0 2px var(--accent); } 100% { background: transparent; box-shadow: none; } }
footer { padding: 6px 16px 12px; color: var(--muted); display: flex; gap: 18px; flex-wrap: wrap; }
footer b { color: var(--text); font-weight: 600; }
@media (max-width: 1500px) { main { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
@media (max-width: 760px) {
  main { grid-template-columns: 1fr; }
  .card.on { order: -1; }
  .knob svg { width: 36px; height: 36px; }
}
</style>
</head>
<body>
<header>
  <h1>HW002 mix desk</h1>
  <span class="armed" id="armed">–</span>
  <span class="what" id="what"></span>
  <span class="status"><span class="dot" id="dot"></span><span id="status">connecting</span></span>
</header>
<nav id="tabs"></nav>
<main id="cards"></main>
<footer>
  <span><b>Pads A1–A8</b> or the <b>big encoder</b>: arm a page</span>
  <span><b>Knobs 1–8</b>: snap to the armed page's values</span>
  <span><b>Faders 1–4</b>: pick up once they pass the value (blue line = where the fader is)</span>
  <span><b>Pads B1–B8</b>: the page's switches</span>
  <span>Click a page here to arm it; click a lit pad to flip it</span>
</footer>
<script>
const KNOB_SLOTS = ["k1","k2","k3","k4","k5","k6","k7","k8"];
const FADER_SLOTS = ["f1","f2","f3","f4"];
const PAD_SLOTS = ["b1","b2","b3","b4","b5","b6","b7","b8"];
let desk = null, state = { page: 0, values: {}, hw: {}, picked: {}, attached: false, live: "" };
const el = {};   // "page:slot" -> element

const label = (c) => c.label || (c.param === "volume" ? c.track : c.param.startsWith("send:") ? `${c.track} → ${c.param.slice(5)}`
  : (c.param === "mute" || c.param === "solo") ? `${c.track.replace(/ bus$/, "")} ${c.param}` : `${c.device} ${c.param}`);

function arcPath(n) {
  const a0 = -225, a1 = a0 + 270 * Math.max(0, Math.min(1, n));
  const r = 15, cx = 20, cy = 20, rad = (a) => a * Math.PI / 180;
  const p = (a) => [cx + r * Math.cos(rad(a)), cy + r * Math.sin(rad(a))];
  const [x0, y0] = p(a0), [x1, y1] = p(a1);
  return `M${x0.toFixed(2)},${y0.toFixed(2)} A${r},${r} 0 ${a1 - a0 > 180 ? 1 : 0} 1 ${x1.toFixed(2)},${y1.toFixed(2)}`;
}

function build() {
  const tabs = document.getElementById("tabs"), cards = document.getElementById("cards");
  tabs.innerHTML = ""; cards.innerHTML = "";
  desk.pages.forEach((pg, i) => {
    const b = document.createElement("button");
    b.innerHTML = `<span class="pad">A${i + 1}</span>${pg.name}`;
    b.onclick = () => arm(i);
    tabs.appendChild(b); el[`tab:${i}`] = b;

    const card = document.createElement("section");
    card.className = "card";
    card.innerHTML = `<h2><span class="pad">A${i + 1}</span>${pg.name}<span class="chip"></span></h2><div class="what">${pg.what || ""}</div>`;
    card.onclick = (ev) => { if (state.page !== i && !ev.target.closest(".padb")) arm(i); };
    const body = document.createElement("div"); body.className = "body";
    const knobs = document.createElement("div"); knobs.className = "knobs";
    KNOB_SLOTS.forEach((s, k) => {
      const c = pg.controls[s], d = document.createElement("div");
      d.className = "knob" + (c ? "" : " empty");
      d.innerHTML = `<svg viewBox="0 0 40 40"><path class="arc-bg" d="${arcPath(1)}" fill="none" stroke-width="4" stroke-linecap="round"/>`
        + `<path class="arc" d="" fill="none" stroke-width="4" stroke-linecap="round"/></svg>`
        + `<span class="lbl">${c ? label(c) : "—"}</span><span class="val"></span><span class="slot">K${k + 1}</span>`;
      if (c) d.title = `${c.track}${c.device ? " / " + c.device : ""} / ${c.param}`;
      knobs.appendChild(d); el[`${i}:${s}`] = d;
    });
    const faders = document.createElement("div"); faders.className = "faders";
    FADER_SLOTS.forEach((s, k) => {
      const c = pg.controls[s], d = document.createElement("div");
      d.className = "fader" + (c ? "" : " empty");
      d.innerHTML = `<div class="track"><div class="fill"></div><div class="ghost"></div></div>`
        + `<span class="lbl">${c ? label(c) : "—"}</span><span class="val"></span><span class="slot">F${k + 1}</span>`;
      if (c) d.title = `${c.track}${c.device ? " / " + c.device : ""} / ${c.param}`;
      faders.appendChild(d); el[`${i}:${s}`] = d;
    });
    body.append(knobs, faders);
    const pads = document.createElement("div"); pads.className = "pads";
    PAD_SLOTS.forEach((s, k) => {
      const c = pg.controls[s], d = document.createElement("div");
      d.className = "padb" + (c ? "" : " empty");
      d.innerHTML = `<span class="lbl">${c ? label(c) : "—"}</span><span class="slot">B${k + 1}</span>`;
      if (c) { d.title = `${c.track}${c.device ? " / " + c.device : ""} / ${c.param}`; d.onclick = () => toggle(i, s); }
      pads.appendChild(d); el[`${i}:${s}`] = d;
    });
    card.append(body, pads);
    cards.appendChild(card); el[`card:${i}`] = card;
  });
}

function paintValue(key) {
  const d = el[key], v = state.values[key];
  if (!d || !v) return;
  d.classList.toggle("err", !!v.err);
  const slot = key.split(":")[1];
  const val = d.querySelector(".val");
  if (val) val.textContent = v.err ? v.err : (v.s || "").trim();
  if (slot[0] === "k") d.querySelector(".arc").setAttribute("d", v.n == null ? "" : arcPath(v.n));
  if (slot[0] === "f") d.querySelector(".fill").style.height = `${100 * (v.n || 0)}%`;
  if (slot[0] === "b") d.classList.toggle("lit", (v.n || 0) >= 0.5);
}

function paintFaders() {
  desk.pages.forEach((_, i) => FADER_SLOTS.forEach((s) => {
    const d = el[`${i}:${s}`]; if (!d) return;
    const armed = i === state.page, hw = state.hw[s], picked = state.picked[s];
    const waiting = armed && hw != null && !picked && !d.classList.contains("empty");
    d.classList.toggle("waiting", waiting);
    if (waiting) d.querySelector(".ghost").style.bottom = `calc(${100 * hw}% - 1px)`;
  }));
}

function paintPage() {
  const pg = desk.pages[state.page] || {};
  document.getElementById("armed").textContent = pg.name ? `A${state.page + 1} · ${pg.name}` : "–";
  document.getElementById("what").textContent = pg.what || "";
  desk.pages.forEach((_, i) => {
    el[`tab:${i}`].classList.toggle("on", i === state.page);
    el[`card:${i}`].classList.toggle("on", i === state.page);
    el[`card:${i}`].querySelector(".chip").textContent = i === state.page ? "ON THE MINILAB" : "";
  });
  paintFaders();
}

function paintStatus() {
  const ok = state.live === "attached";
  document.getElementById("dot").classList.toggle("ok", ok);
  document.getElementById("status").textContent = ok ? "MiniLab 3 → Live" : (state.live || "connecting");
}

function paintAll() { Object.keys(state.values).forEach(paintValue); paintPage(); paintStatus(); }

function flash(key) {
  const d = el[key]; if (!d) return;
  d.classList.remove("flash"); void d.offsetWidth; d.classList.add("flash");
}

async function post(path, body) {
  try { await fetch(path, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) }); }
  catch (e) { /* the event stream shows the outcome */ }
}
const arm = (page) => post("/api/page", { page });
const toggle = (page, slot) => post("/api/toggle", { page, slot });

function connect() {
  const es = new EventSource("/events");
  es.onmessage = (ev) => {
    const m = JSON.parse(ev.data);
    if (m.t === "full") { state = m.state; paintAll(); }
    else if (m.t === "v") { const k = `${m.page}:${m.slot}`; state.values[k] = { ...(state.values[k] || {}), n: m.n, s: m.s }; paintValue(k); }
    else if (m.t === "page") { state.page = m.page; state.picked = {}; paintPage(); }
    else if (m.t === "hw") {
      if (m.hw != null && m.slot[0] === "f") { state.hw[m.slot] = m.hw; state.picked[m.slot] = m.picked; paintFaders(); }
      flash(`${m.page}:${m.slot}`);
    }
  };
  es.onerror = () => { state.live = "server not answering"; paintStatus(); };
}

fetch("/api/desk").then((r) => r.json()).then((d) => { desk = d; build(); connect(); });
</script>
</body>
</html>
