[project]
name = "harness"
version = "0.1.0"
description = "The Mac end: /skrng and the pages under /studio/ over the tailnet"
requires-python = ">=3.12"
dependencies = [
    "aiohttp>=3.14.5",
    "claude-agent-sdk>=0.2.187",
    "numpy>=2.5.5",
]

[project.optional-dependencies]
# tests/ui drives the pages in a browser; it also needs `uv run --extra dev playwright install chromium webkit`.
dev = ["pytest>=9.2.0", "pytest-asyncio>=1.5.0", "playwright>=1.65.2"]

[project.scripts]
harness = "harness.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/harness"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
markers = ["ui: browser tests of the pages (Playwright); skipped when no browser is installed"]
