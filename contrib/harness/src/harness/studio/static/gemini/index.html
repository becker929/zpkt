<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
  <meta name="theme-color" content="#000000">
  <title>Gemini CLI</title>
  <link rel="stylesheet" href="gemini.css">
</head>
<body>
  <aside id="side" aria-label="Sessions">
    <header class="g-side-top">
      <a class="g-ib" href="/studio/" aria-label="Back to the studio"><svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg></a>
      <button type="button" id="new" class="g-new"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>New session</button>
    </header>
    <div id="list" class="g-list"></div>
    <footer class="g-side-foot">
      <p id="spend"></p>
      <a href="/studio/images/">Images wall</a> · <a href="/skrng/#jobs">Claude jobs</a>
    </footer>
  </aside>
  <div id="scrim"></div>
  <main id="main">
    <header class="g-top">
      <button type="button" class="g-ib" id="menu" aria-label="Sessions"><svg viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h16"/></svg></button>
      <div class="g-title"><h1 id="title">Gemini CLI</h1><p id="sub"></p></div>
      <button type="button" class="g-ib" id="gear" aria-label="Session settings"><svg viewBox="0 0 24 24"><path d="M4 7h10M18 7h2M4 17h2M10 17h10"/><circle cx="16" cy="7" r="2"/><circle cx="8" cy="17" r="2"/></svg></button>
    </header>
    <div id="msgs"><div class="g-wrap" id="thread"></div></div>
    <div id="bar"><div class="g-wrap">
      <div class="g-modes" id="modes" role="radiogroup" aria-label="What Gemini may do without asking"></div>
      <div id="prev"></div>
      <div id="box">
        <button type="button" class="g-ib" id="attach" aria-label="Attach images"><svg viewBox="0 0 24 24"><rect x="4" y="5" width="16" height="14" rx="1"/><path d="M4 16l5-5 4 4 2-2 5 5"/><circle cx="15.5" cy="9.5" r="1.3"/></svg></button>
        <textarea id="in" rows="1" placeholder="Ask Gemini to do something in zpkt" enterkeyhint="send"></textarea>
        <button type="button" id="send" aria-label="Send"><svg viewBox="0 0 24 24" id="send-icon"><path d="M12 19V5M6 11l6-6 6 6"/></svg></button>
      </div>
      <input type="file" id="file" accept="image/*" multiple hidden>
    </div></div>
  </main>

  <div class="g-sheet-bg" id="set" aria-hidden="true"><form class="g-sheet" id="set-form">
    <h2>Session</h2>
    <label for="model">Model</label><select id="model"></select>
    <label for="stitle">Title</label><input id="stitle" maxlength="80">
    <p class="g-note" id="cwd"></p>
    <div class="g-row"><button type="button" id="set-x">Cancel</button><button class="pri" id="set-ok">Save</button></div>
  </form></div>

  <div class="g-sheet-bg" id="job" aria-hidden="true"><form class="g-sheet" id="job-form">
    <h2>Send to Claude</h2>
    <p class="g-note">This starts a Claude Code job in zpkt on the Mac. You get a notification when it finishes.</p>
    <label for="job-title">Title</label><input id="job-title" maxlength="80">
    <label for="job-prompt">What Claude gets</label><textarea id="job-prompt" rows="10"></textarea>
    <p class="g-note" id="job-msg"></p>
    <div class="g-row"><button type="button" id="job-x">Cancel</button><button class="pri" id="job-ok">Start the job</button></div>
  </form></div>

  <script type="module" src="gemini.js"></script>
</body>
</html>
