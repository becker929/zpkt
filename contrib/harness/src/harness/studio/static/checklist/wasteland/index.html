<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#000000">
  <title>The Wasteland</title>
  <link rel="stylesheet" href="wasteland.css">
  <link rel="stylesheet" href="../map/feedback.css">
</head>
<body>
  <label class="haptic" aria-hidden="true"><input type="checkbox" switch tabindex="-1"></label>
  <canvas id="game" aria-label="The Wasteland: drag to walk, or tap a spot to walk there"></canvas>
  <div id="labels" aria-live="polite"></div>
  <div id="ring" aria-hidden="true"><i></i></div>
  <header class="top">
    <a class="back" href="../map/" aria-label="Back to the ledger">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg>
    </a>
    <p class="where">HW002 · The Wasteland</p>
    <button type="button" class="mapbtn" id="mapbtn" aria-label="The map">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 6l6-2 6 2 6-2v14l-6 2-6-2-6 2zM9 4v14M15 6v14"/></svg>
    </button>
  </header>
  <div id="way" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M4 12h13M12 6l7 6-7 6"/></svg><span></span></div>
  <section class="chart" id="chart" aria-hidden="true" aria-label="The map"></section>
  <div class="title" id="title" aria-hidden="true"><b>The Wasteland</b><span>HW002</span></div>
  <p class="hint" id="hint">Drag anywhere to walk · tap a spot to go there</p>
  <script type="module" src="main.js"></script>
</body>
</html>
