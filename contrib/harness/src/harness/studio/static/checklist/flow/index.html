<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#ffffff">
  <title>Checklist Flow</title>
  <link rel="stylesheet" href="flow.css">
  <link rel="stylesheet" href="widgets.css">
  <link rel="stylesheet" href="juice/juice.css">
</head>
<body>
  <label class="haptic" aria-hidden="true"><input type="checkbox" switch tabindex="-1"></label>
  <div id="app">
    <header class="top">
      <a class="back" href="../" aria-label="Back to the checklist">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg>
      </a>
      <div class="title">
        <h1 id="track">HW002</h1>
        <p>Flow · a mock-up</p>
      </div>
      <div class="mini" id="mini" aria-hidden="true"></div>
      <div class="total"><b id="total-n">0</b>/<span id="total-of">0</span></div>
    </header>
    <div class="bar">
      <div class="seg" id="kind" role="radiogroup" aria-label="Juice object"></div>
      <button type="button" class="snd" id="snd" aria-pressed="true" aria-label="Click sound">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9h4l5-4v14l-5-4H4z"/><path class="w" d="M16.5 8.5a5 5 0 0 1 0 7M19 6a8.5 8.5 0 0 1 0 12"/><path class="x" d="M16 9l6 6M22 9l-6 6"/></svg>
      </button>
    </div>
    <main id="steps"></main>
    <footer class="foot">
      <p>Tap an item to work on it (a mocked studio surface). Commit there, or tap a box to check it straight away.
        Nothing is locked: you can release whenever you like.</p>
      <button type="button" id="reset">Reset the checks</button>
    </footer>
  </div>
  <section class="widget-host" id="widget" aria-hidden="true"></section>
  <div class="fx" id="fx" aria-hidden="true"></div>
  <section class="splash" id="splash" aria-hidden="true">
    <div class="stage" id="stage"></div>
    <div class="caption" id="caption"><b id="cap-step"></b><span id="cap-item"></span><span id="cap-n"></span></div>
    <p class="cont" id="cont">Tap to continue</p>
  </section>
  <script type="module" src="flow.js"></script>
</body>
</html>
