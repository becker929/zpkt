# Format and rules: docs/workflow.md ("Records"). Agents add records here in a PR, never in the library.

[HW002]
note = "The release is a YouTube Short cut from the full track. The cuts and mix batches are made on copies in the rig's sets folder, so the library's newest set (HW002_121) shows the full track. Experiments on anthonybecker.me/skrng are not a release."

[HW002.arrange]
percent = 70
by = "docs"
date = "2026-10-09"
note = "Short shape chosen: batch 4.3 track 1 (scooped kick, hats A to ABCD, splashes every 8 bars). It is 20 bars, 30 s, under the 33-50 s target, and the chord loop was muted in it until 9 Oct."
source = "docs/hw002/batch-4.3-4.4-decisions.md, docs/hw002/batch-8-chord-and-break.md"

[HW002.kick]
percent = 70
by = "docs"
date = "2026-10-07"
