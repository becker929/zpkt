[HW004]
note = "HW004.als (27 May) has the same tracks, clips, devices and automation as HW002_11 (26 May) and plays HW002's samples. Its scores are HW002's as of May, not work of its own. Unconfirmed whether it is a new track started from HW002 or a parked copy."
