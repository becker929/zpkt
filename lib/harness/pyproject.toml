[project]
name = "harness"
version = "0.1.0"
description = "The Mac end: /skrng and the studio voice app over the tailnet, Claude Code jobs through the Agent SDK"
requires-python = ">=3.12"
dependencies = [
    "aiohttp>=3.14.4",
    "claude-agent-sdk>=0.2.163",
    "numpy>=2",
    "pillow>=11",
    "voice",
    "websockets>=13.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23"]

[project.scripts]
harness = "harness.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv.sources]
voice = { path = "../voice", editable = true }

[tool.hatch.build.targets.wheel]
packages = ["src/harness"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
