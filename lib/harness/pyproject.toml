[project]
name = "harness"
version = "0.1.0"
description = "Jobs from the browser: an outbound socket to anthonybecker.me, Claude Code jobs through the Agent SDK"
requires-python = ">=3.12"
dependencies = [
    "aiohttp>=3.14.4",
    "claude-agent-sdk>=0.1.0",
    "websockets>=13.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23"]

[project.scripts]
harness = "harness.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/harness"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
