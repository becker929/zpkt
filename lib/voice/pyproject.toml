[project]
name = "voice"
version = "0.1.0"
description = "studio's speech models in their own process: Kokoro text-to-speech, and local speech-to-text with a stop word"
requires-python = ">=3.12"
dependencies = ["numpy>=2"]

[project.optional-dependencies]
# The models. Without them the worker still runs with --tts fake --stt fake (tests, page work).
engines = []
dev = ["pytest>=8.0", "pytest-asyncio>=0.23"]

[project.scripts]
voice = "voice.worker:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/voice"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
