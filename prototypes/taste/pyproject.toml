[project]
name = "taste"
version = "0.1.0"
description = "Taste: models Anthony's preferences — pick corpus and preference judge"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.14.3",
    "numpy>=2.5.4",
    "typer>=0.28.0",
    "rich>=13.0.0",
]

[project.optional-dependencies]
judge = [
    "anthropic>=2.6.0",
]
annotation = [
    "flask>=3.1.0",
]
dev = [
    "pytest>=9.2.0",
    "mypy>=2.4.1",
]

[project.scripts]
taste = "taste.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/taste"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "flask>=3.1.3",
    "jsonschema>=4.26.0",
    "pytest>=9.2.0",
]
