[project]
name = "checklist-prototype"
version = "0.1.0"
description = "The track's checklist across the spine and the worlds around it (map, rummage, wasteland, flow, concepts)"
requires-python = ">=3.12"
dependencies = [
    "aiohttp>=3.14.4",
    "harness",            # its artist, regions and site-audio routes, which the pages call
    "numpy>=2",           # scripts/cutout.py and the tests' fixture audio
    "pillow>=13.0.0",     # scripts/cutout.py
]

[project.optional-dependencies]
# The tests drive the pages in a browser; they also need `uv run --extra dev playwright install chromium webkit`.
dev = ["pytest>=8.0", "pytest-asyncio>=0.23", "playwright>=1.48"]

[tool.uv]
package = false

[tool.uv.sources]
harness = { path = "../../contrib/harness", editable = true }

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
pythonpath = ["."]
markers = ["ui: browser tests of the pages (Playwright); skipped when no browser is installed"]
