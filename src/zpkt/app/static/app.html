<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>zpkt</title>
<style>
:root{--bg:#f1eee6;--panel:#fff;--ink:#111;--mute:#6a6963;--line:#111;--acc:#c6f432;--accd:#8aa31b;--pin:#2f6fed;--pind:#1f4fb5;--bad:#b3261e;--c1:#fff;--c2:#f8f7f3;--cl:#d9d7d0;--well:#dcdbd5;--edge:#c9c8c2;--k3:#bcbbb4}
@media (prefers-color-scheme:dark){:root{--bg:#121212;--panel:#1c1c1c;--ink:#f2f2ee;--mute:#9c9b95;--line:#4a4a4a;--pin:#6b9bff;--pind:#3a68d0;--bad:#ff7a70;--c1:#2a2a2c;--c2:#222224;--cl:#3d3d40;--well:#3b3c40;--edge:#141416;--k3:#0d0d0f}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0;background:var(--bg);color:var(--ink);font:15px/1.4 'Helvetica Neue',Helvetica,Arial,sans-serif;overflow:hidden;user-select:none;-webkit-user-select:none}
button{font:inherit;color:inherit}
svg{display:block}
.mono{font-family:ui-monospace,Menlo,monospace}
#app{height:100%;display:flex;flex-direction:column;max-width:100%;position:relative}
#cols{flex:1;min-height:0;display:flex;flex-direction:column}
#hear{display:contents}
#htop{order:0}#main{order:1}#hbot{order:2}
#side{display:none}
.hear{background:var(--panel);flex:none}
#htop{border-bottom:1.5px solid var(--line);padding:8px 16px;display:flex;flex-direction:column;gap:6px}
#hbot{border-top:1.5px solid var(--line);padding:6px 10px;display:flex;align-items:center;justify-content:center;flex-wrap:wrap;gap:6px 10px}
#hbot .key{min-width:44px;padding:0 8px}
#hbot .seg .key{padding:0 10px}
.grp{display:flex;gap:6px;align-items:center}
.hr{display:flex;align-items:center;gap:8px;min-width:0;flex-wrap:wrap}
.sp{flex:1}
.nm{font:600 14px ui-monospace,Menlo,monospace;white-space:nowrap}
.pill{font:11.5px ui-monospace,Menlo,monospace;border:1px solid var(--line);padding:2px 7px;white-space:nowrap;background:var(--panel)}
.pill.acc{background:var(--acc);color:#111;border-color:#6d8213}
.pill.pin{background:var(--pin);color:#fff;border-color:var(--pind)}
.pill.warn{border-color:var(--bad);color:var(--bad)}
.tl{height:16px;border-radius:4px;background:var(--well);position:relative;overflow:hidden}
.tl .ph{position:absolute;top:0;bottom:0;width:2px;background:var(--ink)}
.spc{display:flex;align-items:flex-end;gap:2px;height:40px}
.spc:empty{background:var(--well);border-radius:4px}
.spc i{flex:1;background:var(--ink);opacity:.85;min-height:2px}
.key{min-width:44px;height:48px;border-radius:12px;border:1px solid var(--cl);background:linear-gradient(var(--c1),var(--c2));box-shadow:0 2px 0 var(--edge);display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:0 12px;font-size:14px;cursor:pointer;white-space:nowrap}
.key:active{transform:translateY(1.5px);box-shadow:0 .5px 0 var(--edge)}
.key.on{background:var(--acc);border-color:var(--accd);color:#111}
.key.pin{background:var(--pin);border-color:var(--pind);color:#fff}
.key.sm{height:44px;min-width:44px;font-size:13px;padding:0 10px}
.key.off{opacity:.4}
.seg{display:flex}.seg .key{border-radius:0}.seg .key:first-child{border-radius:12px 0 0 12px}.seg .key:last-child{border-radius:0 12px 12px 0}
#banner{display:none;background:var(--pin);color:#fff;padding:6px 16px;font-size:13px}
#banner.on{display:block}
#lock{display:none;background:var(--bad);color:#fff;padding:6px 16px;font-size:13px}
#lock.on{display:block}
#main{flex:1;min-height:0;position:relative;display:flex;flex-direction:column;overflow:hidden}
#desk,#song{flex:1;min-height:0;padding:10px 16px;display:flex;flex-direction:column;gap:8px;overflow:auto}
#desk[hidden],#song[hidden]{display:none}
#song>*{flex:none}
#tabs{display:flex;border-top:1.5px solid var(--line);background:var(--panel);flex:none}
#tabs button{flex:1;height:48px;background:none;border:0;display:flex;align-items:center;justify-content:center;gap:6px;font-size:12px;color:var(--mute)}
#tabs a{flex:1;height:48px;display:flex;align-items:center;justify-content:center;gap:6px;font-size:12px;color:var(--mute);text-decoration:none}
#tabs button.on{color:var(--ink);box-shadow:inset 0 3px 0 var(--acc)}
.ph2{display:flex;align-items:center;gap:8px;min-height:26px;flex-wrap:wrap}
.ph2 b{font-size:17px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tag{font:10.5px ui-monospace,Menlo,monospace;text-transform:uppercase;letter-spacing:.08em;color:var(--mute);white-space:nowrap}
.g4{display:grid;grid-template-columns:repeat(4,minmax(0,120px));gap:6px;justify-content:center}
.ctl{display:flex;flex-direction:column;align-items:center;position:relative;touch-action:none;min-width:0;max-width:120px;width:100%}
.ctl .w{width:100%;max-width:72px;aspect-ratio:1;min-height:44px;border:1px solid var(--cl);border-radius:12px;background:var(--well);position:relative;overflow:hidden;cursor:ns-resize;touch-action:none}
.ctl.pad .w{cursor:pointer;aspect-ratio:auto;height:48px;max-width:100%}
.ctl .w i{position:absolute;left:0;right:0;bottom:0;background:var(--ink);opacity:.8}
.ctl.missing .w{opacity:.35}
.ctl .v{font:12.5px ui-monospace,Menlo,monospace;margin-top:2px;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ctl .l{color:var(--mute);font-size:11px;line-height:1.15;height:26px;text-align:center;overflow:hidden;max-width:100%}
.ctl.chg::after{content:"";position:absolute;top:0;right:calc(50% - 40px);width:9px;height:9px;border-radius:50%;background:var(--acc);border:1px solid var(--line)}
.ctl.flash .w{outline:2px solid var(--acc)}
.dots{display:flex;gap:0;justify-content:center;align-items:center;flex-wrap:wrap}
.dots button{width:44px;height:44px;border:0;background:none;padding:0;position:relative}
.dots button::after{content:"";position:absolute;left:15px;top:15px;width:14px;height:14px;border-radius:50%;background:var(--k3)}
.dots button.c::after{background:var(--ink);left:9px;width:26px;border-radius:7px}
#scrim{position:absolute;inset:0;background:rgba(0,0,0,.35);opacity:0;pointer-events:none;transition:opacity .2s;z-index:30}
#scrim.on{opacity:1;pointer-events:auto}
.sheet{position:absolute;left:0;right:0;bottom:0;z-index:31;background:var(--panel);border-top:1.5px solid var(--line);border-radius:20px 20px 0 0;padding:10px 16px 18px;transform:translateY(105%);visibility:hidden;transition:transform .28s,visibility 0s .28s;max-height:78%;display:flex;flex-direction:column;gap:8px}
.sheet.on{transform:none;visibility:visible;transition-delay:0s}
.sheet h3{margin:0;font-size:17px}
.hl{display:flex;flex-direction:column;overflow:auto}
.he{display:flex;gap:8px;font-size:13px;padding:7px 0;border-bottom:1px solid var(--cl);align-items:center}
.he .w2{font:11px ui-monospace,Menlo,monospace;color:var(--mute);width:56px;flex:none}
.he .who{font:10.5px ui-monospace,Menlo,monospace;border:1px solid var(--line);padding:1px 5px;flex:none}
.he .who.agent{background:var(--acc);color:#111}
.he .who.minilab{background:var(--pin);color:#fff;border-color:var(--pind)}
.spc.ver{height:24px;margin-top:-2px}
.spc.ver i{background:var(--pin);opacity:.9}
.vline{font:12px ui-monospace,Menlo,monospace;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.ol{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px;flex:none}
.ol .key{height:44px;font-size:13px;flex:none;max-width:70vw;overflow:hidden;text-overflow:ellipsis}
.why{font-size:13px;line-height:1.4;color:var(--mute);overflow-wrap:anywhere;max-height:7.2em;overflow-y:auto;flex:none}
.vg{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;overflow:auto;min-height:0}
.vc{border:1px solid var(--cl);border-radius:12px;padding:8px 10px;background:linear-gradient(var(--c1),var(--c2));text-align:left;display:flex;flex-direction:column;gap:2px;cursor:pointer;min-height:64px}
.vc.on{border-color:var(--pind);box-shadow:inset 0 0 0 2px var(--pin)}
.vc.now{background:var(--acc);color:#111}
.vc.off{opacity:.45;cursor:default}
.vc b{font-size:13px;line-height:1.2}
.vc span{font:11.5px ui-monospace,Menlo,monospace;color:var(--mute)}
.vc.now span{color:#111}
.gp{color:var(--pind)}.gn{color:var(--bad)}
.lane{display:flex;align-items:center;gap:8px;min-width:0}
.lane .ln{font:11px ui-monospace,Menlo,monospace;color:var(--mute);width:64px;flex:none;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lane .tr{flex:1;min-width:0;height:22px;border-radius:6px;background:var(--well);position:relative;overflow:hidden}
.lane .tr i{position:absolute;top:2px;bottom:2px;background:var(--ink);opacity:.85;border-radius:3px}
.lane .tr b{position:absolute;top:0;bottom:0;width:2px;background:var(--pin)}
.sketch{font-size:12px;color:var(--mute);padding:6px 0}
.sketch b{color:var(--ink)}
.sheet.tall{height:94%;max-height:94%}
.sheet.tall iframe{flex:1;min-height:0;width:100%;border:1px solid var(--cl);border-radius:12px;background:#0e0f11}
.btns{display:flex;gap:8px;flex-wrap:wrap}
select{font:inherit;color:inherit;background:var(--panel);border:1px solid var(--line);border-radius:8px;height:44px;max-width:100%}
#toast{position:absolute;left:50%;top:150px;transform:translate(-50%,-10px);background:var(--ink);color:var(--bg);padding:8px 14px;border-radius:12px;font-size:13px;z-index:50;opacity:0;transition:all .2s;pointer-events:none;max-width:92%}
#toast.on{opacity:1;transform:translate(-50%,0)}
#bubble{position:fixed;z-index:60;pointer-events:none;background:var(--ink);color:var(--bg);font:600 20px ui-monospace,Menlo,monospace;padding:6px 12px;border-radius:12px;opacity:0;white-space:nowrap}
#bubble.on{opacity:1}
.pcs{display:flex;flex-direction:column;gap:10px}
.card{border:1px solid var(--cl);border-radius:16px;padding:8px 10px 10px;background:var(--panel);min-width:0}
.card.t1{background:var(--c2)}
.card h4{margin:0 0 6px;font:600 11px ui-monospace,Menlo,monospace;text-transform:uppercase;letter-spacing:.08em;color:var(--mute);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cg{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.pc{display:flex;flex-direction:column;align-items:center;min-width:0;max-width:220px;width:100%;justify-self:center;position:relative;touch-action:none;grid-column:span 1}
.pc.big{grid-column:span 2}
.pc.w-segmented,.pc.w-list{grid-column:1/-1;align-items:stretch}
.pc .w{width:56px;height:56px;border:1px solid var(--cl);border-radius:50%;background:var(--well);position:relative;overflow:hidden;cursor:ns-resize;touch-action:none}
.pc.w-fader .w,.pc.w-macro .w{border-radius:12px;width:44px;height:96px}
.pc.big .w{width:72px;height:72px}
.pc.big.w-fader .w{height:120px;width:56px}
.pc.small .w{width:44px;height:44px}
.pc.small.w-fader .w{height:72px;width:44px}
.pc .w i{position:absolute;left:0;right:0;bottom:0;background:var(--ink);opacity:.8}
.pc .w b.rg{position:absolute;left:0;right:0;border-top:2px solid var(--acc);border-bottom:2px solid var(--acc);background:rgba(198,244,50,.28);pointer-events:none}
.pc .v{font:12.5px ui-monospace,Menlo,monospace;margin-top:2px;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pc .l{color:var(--mute);font-size:11px;line-height:1.15;text-align:center;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:100%}
.pc.missing{opacity:.35}
.pc.missing .w{cursor:not-allowed}
.pc.chg::after{content:"";position:absolute;top:0;right:4px;width:9px;height:9px;border-radius:50%;background:var(--acc);border:1px solid var(--line)}
.pc .seg{width:100%}.pc .seg .key{flex:1;min-width:0;padding:0 4px;font-size:12px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;display:block;line-height:46px}
.pc select{width:100%;height:44px;border-radius:12px;border:1px solid var(--cl);background:var(--c1);color:var(--ink);font:inherit;padding:0 8px;min-width:0}
.pc.w-key .key{width:100%;max-width:72px;padding:0 4px;min-width:0}
.pair{grid-column:span 2;max-width:220px;width:100%;justify-self:center;display:flex;gap:6px;justify-content:center;border-radius:12px;background:var(--well);padding:4px;min-width:0}
.pair .pc{flex:1;min-width:0}
.ml{border-top:1px solid var(--cl);padding-top:6px;display:flex;flex-direction:column;gap:3px}
.ml .row{display:grid;grid-template-columns:repeat(8,minmax(0,1fr));gap:3px}
/* The map mirrors the hardware: knobs 4 x 2 | faders | the pads' row under both. */
.mlhw{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:3px 10px}
.ml .row.k{grid-template-columns:repeat(4,minmax(0,1fr))}
.ml .row.f{grid-template-columns:repeat(4,minmax(0,1fr))}
.ml .row.f span.s{height:43px;writing-mode:vertical-rl;transform:rotate(180deg);padding:3px 2px}
.ml .row.p{grid-column:1/-1}
.ml span.s{font:10px ui-monospace,Menlo,monospace;border:1px solid var(--cl);border-radius:6px;padding:2px 3px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;color:var(--mute);min-width:0;height:20px}
.ml span.s.on{color:var(--ink);background:var(--c2)}
.ml .hr .key{height:44px;min-width:44px}
#tabs:has(button:only-child){display:none}
.legacy{display:flex;flex-direction:column;gap:8px}
/* The desk as the MiniLab 3 sits on the table (feedback: pages match the controller); folded where 8 columns of 44 px do not fit. */
#desk{container:desk/inline-size}
.legacy.hw{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);grid-template-areas:"k f" "p1 p2";gap:10px 12px;max-width:1000px;margin:0 auto;width:100%}
.hwk,.hwf,.hwp{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px 4px;justify-items:center}
.hwk{grid-area:k}.hwf{grid-area:f}.hwp1{grid-area:p1}.hwp2{grid-area:p2}
.hwf .ctl{height:100%}
.hwf .ctl .w{aspect-ratio:auto;flex:1;min-height:96px;max-width:44px;border-radius:10px}
@container desk (max-width:400px){.legacy.hw{grid-template-columns:minmax(0,1fr);grid-template-areas:"k" "p1" "f" "p2"}}
.ctl.none{visibility:hidden}
.pl{display:flex;flex-direction:column;gap:6px}
.pl .key{justify-content:flex-start;width:100%;overflow:hidden;text-overflow:ellipsis}
#side .vg{grid-template-columns:1fr}
#side>.key{flex:none}
/* One breakpoint system: phone is one column; tablet (700) puts the Hear bar beside the Desk; desktop (1100) adds Pages and Versions. */
@media (max-width:380px){#hbot{gap:6px}#hbot .seg .key{padding:0 8px}}
@media (min-width:700px){
 #cols{display:grid;grid-template-columns:minmax(0,1fr) 320px;grid-template-rows:minmax(0,1fr)}
 #hear{display:flex;flex-direction:column;min-height:0;overflow:auto;border-left:1.5px solid var(--line);background:var(--panel)}
 #htop,#main,#hbot{order:0}
 #htop{flex:1 0 auto;border-bottom:0}
 #htop .spc:not(.ver){height:auto;min-height:140px;flex:1}
 #tabs{border-top:1.5px solid var(--line)}
}
@media (min-width:1100px){
 #cols{grid-template-columns:220px minmax(0,1fr) 320px}
 #side{display:flex;flex-direction:column;gap:8px;min-height:0;overflow:auto;padding:10px 12px;border-right:1.5px solid var(--line);background:var(--panel)}
 #tabs,.dots{display:none}
 #song[hidden]{display:flex}
 #song{flex:none;max-height:240px;border-bottom:1.5px solid var(--line)}
 #song .sketch{display:none}
 #htop .spc:not(.ver){min-height:220px}
 .legacy.hw{column-gap:28px}
 .pcs{flex-direction:row;flex-wrap:wrap;align-items:flex-start}.card{flex:1 1 280px;max-width:420px}
}
@media (min-width:1400px){#cols{grid-template-columns:280px minmax(0,1fr) 420px}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style></head><body>

<div id="app">
 <div id="lock" role="alert"></div>
 <div id="banner" role="status"></div>

  <aside id="side" aria-label="Pages and Versions"></aside>

<script>
"use strict";
const $ = s => document.querySelector(s);
const I = n => `<svg width="22" height="22"><use href="#i-${n}"/></svg>`;
const S = {state: null, desk: null, hear: {hearing: "now", changed: 0, keys: [], match: true, monitor: {slot: "W", ref: "C1"}, pin: "start"},
           hist: {entries: [], can_undo: false, can_redo: false}, meter: null, sheet: false, flash: {},
           options: {options: [], shown: null}, optSel: null, layouts: {}, phonePage: {},
           tab: "desk", song: {list: [], id: null, view: null, loaded: false, sure: false}, page: null};
let toastTimer = 0;

function toast(msg) { const t = $("#toast"); t.textContent = msg; t.classList.add("on"); clearTimeout(toastTimer); toastTimer = setTimeout(() => t.classList.remove("on"), 2200); }
async function command(kind, args = {}, group) {
  const r = await fetch("/api/command", {method: "POST", headers: {"Content-Type": "application/json"}, body: JSON.stringify({kind, args, group})});
  const body = await r.json();
  if (!r.ok) toast(body.error || "That did not work.");
  return {ok: r.ok, body};
}

// ---- the Hear bar -------------------------------------------------------------------------------------------------
function renderHear() { renderTop(); renderBottom(); }
function renderTop() {
  const st = S.state, h = S.hear;
  if (!st) return;
  const bar = Math.floor(st.pos / 4) + 1, total = 64 * 4;

let drag = null, sendTimer = 0;
document.addEventListener("pointerdown", e => {
  const w = e.target.closest(".ctl .w, .pc .w");
  if (!w) return;
  const el = w.closest(".ctl, .pc"), slot = el.dataset.slot, key = el.dataset.key;
  if (el.classList.contains("missing")) return;
  if (el.classList.contains("ctl") && slot[0] === "b") { command("mix.toggle", {slot, page: S.state.page}); return; }
  if (!key) return;
  const v = el.classList.contains("pc") ? valueMap()[key] || {} : S.state.values[`${S.state.page}:${slot}`] || {};
  drag = {key, slot, y: e.clientY, n0: v.n ?? 0, n: v.n ?? 0, el};
  w.setPointerCapture(e.pointerId);
  e.preventDefault();
});
document.addEventListener("pointermove", e => {
  if (!drag) return;
  drag.n = Math.max(0, Math.min(1, drag.n0 + (drag.y - e.clientY) / 160));
  const w = drag.el.querySelector(".w");
  w.querySelector("i").style.height = Math.round(drag.n * 100) + "%";
  const b = $("#bubble"); b.textContent = Math.round(drag.n * 100) + "%"; b.classList.add("on");
  b.style.left = (e.clientX + 14) + "px"; b.style.top = (e.clientY - 50) + "px";
  clearTimeout(sendTimer);
  sendTimer = setTimeout(sendDrag, 40);
});

document.addEventListener("pointerup", () => {

  S.page = name;
  $("#psheet").innerHTML = `<div class="hr"><h3>${sh.title}</h3><span class="pill" id="sketchpill">sketch</span><span class="sp"></span><button class="key sm" id="pclose">Close</button></div>
    <div class="sketch"><b>Sketch.</b> Rendered files played here, not a render of the set.</div>
    <iframe title="${sh.title}" src="${sh.path}"></iframe>`;
  $("#psheet").classList.add("on"); $("#scrim").classList.add("on");
}
function closeSheet() {
  S.page = null;
  $("#psheet").classList.remove("on"); $("#psheet").innerHTML = ""; $("#scrim").classList.toggle("on", S.sheet);
}
async function buildSong() {
  if (!S.song.sure) { S.song.sure = true; renderSong(); setTimeout(() => { S.song.sure = false; if (S.tab === "song") renderSong(); }, 4000); return; }
  S.song.sure = false; renderSong(); toast("Building in Live. This takes a while.");
  const r = await command("song.build", {id: S.song.id});
  if (r.ok) toast(`Built ${r.body.channels} channels and ${r.body.clips} clips.`);
}
document.addEventListener("change", e => { if (e.target.id === "songsel") loadSong(e.target.value); });

document.addEventListener("click", async e => {
  const t = e.target.closest("button");
  if (!t) return;
  if (t.dataset.t) return showTab(t.dataset.t);
  if (t.dataset.sheet) return openSheet(t.dataset.sheet);
  if (t.id === "pclose") return closeSheet();
  if (t.id === "songbuild") return buildSong();
  if (t.dataset.pkey !== undefined) {
    if (t.dataset.i === undefined) return command("mix.set", {norms: [[t.dataset.pkey, +t.dataset.n >= .5 ? 0 : 1]]});
    return command("mix.set", {norms: [[t.dataset.pkey, +t.dataset.i / Math.max(1, +t.dataset.of - 1)]]});
  }
  if (t.dataset.swipe) {
    const id = entries().find(en => en.hw.includes(S.state.page)).page_id;
    S.phonePage[id] = Math.max(0, (S.phonePage[id] || 0) + +t.dataset.swipe);
    return renderDesk();
  }
  if (t.dataset.hear) return command("monitor.hear", {hearing: t.dataset.hear});
  if (t.dataset.page !== undefined) return command("page.arm", {page: +t.dataset.page});
  if (t.id === "kplay") return command("transport", {action: S.state.playing ? "pause" : "play"});
  if (t.id === "kmkpin") { const r = await command("monitor.pin"); if (r.ok) toast("Pinned the mix as it is now."); return; }
  if (t.id === "kundo" || t.id === "hundo") return command("history.undo");
  if (t.id === "kredo") return command("history.redo");
  if (t.id === "khist") { S.sheet = "hist"; return renderHist(); }
  if (t.id === "topts" || t.id === "sopts") { S.sheet = S.sheet === "options" ? false : "options"; return renderHist(); }
  if (t.dataset.optsel) { S.optSel = t.dataset.optsel; return renderHist(); }
  if (t.dataset.opt) { await command("options.show", {option: t.dataset.opt, version: t.dataset.ver}); return; }
  if (t.id === "onow") {
    const os = S.options.options, sel = os.find(o => o.id === S.optSel) || os[0], v = toPick(sel);
    if (!v) return toast("Tap a Version first, then Pick.");
    if (!v.writes && sel.kind !== "proposal") return toast("Pick a Version that has values for the mix.");
    const r = await command("options.pick", {option: sel.id, version: v.id});
    if (r.ok) toast("Picked " + v.label + ". It is Now.");
    return;
  }
  if (t.id === "hclose") { S.sheet = false; return renderHist(); }
  if (t.id === "hver") { const r = await command("history.checkpoint", {name: "v" + new Date().toTimeString().slice(0, 8).replace(/:/g, "")}); if (r.ok) toast("Made a version."); }
});
document.addEventListener("change", e => {
  const t = e.target;
  if (t.tagName === "SELECT" && t.dataset.pkey) command("mix.set", {norms: [[t.dataset.pkey, +t.value / Math.max(1, +t.dataset.of - 1)]]});
});
$("#scrim").addEventListener("click", () => { S.sheet = false; renderHist(); closeSheet(); });

// ---- events ---------------------------------------------------------------------------------------------------------
function apply(m) {
  let part = "all";
  if (m.t === "full") S.state = m.state;
  else if (m.t === "hear") { S.hear = m; if (m.why === "touched") toast("Back on Now."); }
  else if (m.t === "hist") S.hist = m;
  else if (m.t === "options") { S.options = m; if (!S.optSel && m.options.length) S.optSel = m.options[0].id; }
  else if (m.t === "option") {
    const os = S.options.options, at = os.findIndex(o => o.id === m.option.id);
    if (at >= 0) os[at] = m.option; else os.unshift(m.option);
    if (!S.optSel) S.optSel = m.option.id;
    if (S.options.shown && S.options.shown.option === m.option.id) {
      const v = m.option.versions.find(x => x.id === S.options.shown.version.id);
      if (v) S.options.shown.version = v;
    }
  }
  else if (m.t === "meter") { S.meter = m; return renderTop(); }
  else if (m.t === "v" && S.state) {
    S.state.values[`${m.page}:${m.slot}`] = {...(S.state.values[`${m.page}:${m.slot}`] || {}), n: m.n, s: m.s, r: m.r, key: m.key};
    part = "desk";
  }
  else if (m.t === "pos" && S.state) {
    const flipped = S.state.playing !== m.p;
    S.state.pos = m.b; S.state.playing = m.p;
    part = flipped ? "all" : "top";
  }
  else if (m.t === "page" && S.state) S.state.page = m.page;
  else if (m.t === "mon" && S.state) S.state.monitor = {slot: m.slot, ref: m.ref};
  else if (m.t === "desk") { S.layouts = {}; loadDesk(); return; }
  S.lockReason = S.state && S.state.live !== "attached" && S.state.live !== "starting" ? `Live: ${S.state.live}` : "";
  if (part === "top") renderTop();
  else if (drag) renderTop();
  else if (part === "desk") renderDesk();
  else render();
}
async function loadDesk() { S.desk = await (await fetch("/api/desk")).json(); render(); }
function connect() {
  const es = new EventSource("/events?app=1");
  es.onmessage = ev => apply(JSON.parse(ev.data));
  es.onerror = () => { S.lockReason = "Lost the connection. Trying again."; renderHear(); };
}
loadDesk().then(connect);
// On a desktop the Song strip is always there; crossing the breakpoint draws the side column and the strip.
const desktop = window.matchMedia("(min-width:1100px)");
function onDesktop() { if (desktop.matches && !S.song.loaded) loadSong(); render(); }
desktop.addEventListener("change", onDesktop);
if (desktop.matches) loadSong();
window.zpkt = {S, command};
</script></body></html>
