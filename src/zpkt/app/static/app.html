<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>zpkt</title>
<link rel="stylesheet" href="/app/shell/shell.css">
<link rel="stylesheet" href="/app/shell/controls.css">
<style>
/* The tokens (--bg, --panel, --ink, --acc ...), the tab bar and the loading line are in /app/shell/shell.css. */
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0;background:var(--bg);color:var(--ink);font:15px/1.4 'Helvetica Neue',Helvetica,Arial,sans-serif;overflow:hidden;user-select:none;-webkit-user-select:none}
button{font:inherit;color:inherit}
svg{display:block}
.mono{font-family:ui-monospace,Menlo,monospace}
#app{height:100%;display:flex;flex-direction:column;max-width:100%;position:relative}
#cols{flex:1;min-height:0;display:flex;flex-direction:column}
#hear{display:contents}
#htop{order:0}#main{order:1}#hbot{order:2}
#side{display:none}
.hear{background:var(--panel);flex:none}
#htop{border-bottom:1px solid var(--line);padding:8px 16px;display:flex;flex-direction:column;gap:6px}
#hkeys{display:contents}
#listen{display:inline-flex;align-items:center}#listen:empty{display:none}
#hbot{border-top:1px solid var(--line);padding:6px 10px;display:flex;align-items:center;justify-content:center;flex-wrap:wrap;gap:6px 10px}
#hbot .key{min-width:44px;padding:0 8px}
#hbot .key:disabled{opacity:.35;cursor:default;transform:none}
/* Undo says what it takes back: the control and the value it returns to */
#kundo .uw{display:flex;flex-direction:column;align-items:flex-start;line-height:1.15;max-width:104px;min-width:0;text-align:left}
#kundo .uw b,#kundo .uw i{max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-style:normal}
#kundo .uw b{font-size:11.5px;font-weight:600}#kundo .uw i{font:11px ui-monospace,Menlo,monospace;color:var(--mute)}
/* solo and mute, beside the transport: lit while any track is soloed or muted; a tap on a name clears it */
#flags{display:flex;gap:6px;align-items:center;flex-wrap:wrap;justify-content:center}
#flags:empty{display:none}
.chip{height:44px;min-width:44px;border-radius:22px;border:1px solid var(--cl);background:var(--panel);display:inline-flex;align-items:center;gap:6px;padding:0 10px 0 6px;font-size:13px;cursor:pointer;white-space:nowrap;max-width:190px}
.chip>b{flex:none;width:24px;height:24px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font:700 12px ui-monospace,Menlo,monospace}
.chip>span{overflow:hidden;text-overflow:ellipsis}
.chip svg{flex:none;opacity:.6}
.chip.solo{border-color:var(--pind)}.chip.solo>b{background:var(--pin);color:#fff}
.chip.mute{border-color:var(--bad)}.chip.mute>b{background:var(--bad);color:var(--bg)}
.chip.going{opacity:.4}
#flagpop{position:absolute;z-index:40;right:8px;bottom:120px;width:min(300px,calc(100% - 16px));background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:8px;display:flex;flex-direction:column;gap:6px;box-shadow:var(--shadow)}
#flagpop[hidden]{display:none}
#flagpop .chip{max-width:none;justify-content:flex-start}#flagpop .chip>span{flex:1;text-align:left}
#hbot .seg .key{padding:0 10px}
.grp{display:flex;gap:6px;align-items:center}
.hr{display:flex;align-items:center;gap:8px;min-width:0;flex-wrap:wrap}
.sp{flex:1}
.nm{font:600 14px ui-monospace,Menlo,monospace;white-space:nowrap}
.pill{font:11.5px ui-monospace,Menlo,monospace;border:1px solid var(--cl);border-radius:20px;padding:2px 9px;white-space:nowrap;background:var(--panel)}
.pill.acc{background:var(--acc);color:var(--acc-ink);border-color:var(--accd)}
.pill.pin{background:var(--pin);color:#fff;border-color:var(--pind)}
.pill.warn{border-color:var(--bad);color:var(--bad)}
/* a pill that takes a tap: the button around it is a full 44 px target */
.ptap{min-height:44px;margin:-10px 0;border:0;background:none;padding:0;display:inline-flex;align-items:center;cursor:pointer;min-width:0;max-width:100%}
.ptap .pill{display:inline-flex;align-items:center;gap:5px;min-width:0;max-width:100%}
.ptap svg{flex:none}
.ptap:focus-visible .pill{outline:2px solid var(--ink);outline-offset:1px}
#chgbase{display:inline-flex;align-items:center;gap:3px;min-width:0;overflow:hidden;text-overflow:ellipsis;border-left:1px solid currentColor;padding-left:6px;opacity:.75}
#chgbase:empty{display:none}
#looppill{display:inline-flex;align-items:center;gap:4px}
#specbox,#loopbox,#livebox,#tlloop,#tlparts{display:contents}
#awaybox[hidden]{display:none}
.tl{height:16px;border-radius:4px;background:var(--well);position:relative;overflow:hidden}
.tl .ph{position:absolute;top:0;bottom:0;width:2px;background:var(--ink)}
.tl .part{position:absolute;top:0;bottom:0;box-shadow:inset 2px 0 0 var(--k3)}
.tl .part:nth-child(even){background:var(--k3);opacity:.35}
/* the transport: play or pause, stop, and what loops (the whole song, its beginning, its peak; none lit: no loop) */
#tgrp .seg .key{min-width:44px;padding:0 9px;font-size:13px}
#tgrp .seg svg{flex:none;opacity:.6}
.tl .lp{position:absolute;top:0;bottom:0;background:var(--acc);opacity:.55;border-left:2px solid var(--accd);border-right:2px solid var(--accd)}
.spc{display:flex;align-items:flex-end;gap:2px;height:40px}
.spc:empty{background:var(--well);border-radius:4px}
.spc i{flex:1;background:var(--ink);opacity:.85;min-height:2px}
.key{min-width:44px;height:48px;border-radius:12px;border:1px solid var(--cl);background:linear-gradient(var(--c1),var(--c2));box-shadow:0 2px 0 var(--edge);display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:0 12px;font-size:14px;cursor:pointer;white-space:nowrap}
.key:active{transform:translateY(1.5px);box-shadow:0 .5px 0 var(--edge)}
.key.on{background:var(--acc);border-color:var(--accd);color:#111}
.key.sm{height:44px;min-width:44px;font-size:13px;padding:0 10px}
.key.off{opacity:.4}
.seg{display:flex}.seg .key{border-radius:0}.seg .key:first-child{border-radius:12px 0 0 12px}.seg .key:last-child{border-radius:0 12px 12px 0}
#lock{display:none;background:var(--bad);color:#fff;padding:6px 16px;font-size:13px}
#lock.on{display:block}
#main{flex:1;min-height:0;position:relative;display:flex;flex-direction:column;overflow:hidden}
#desk,#song{flex:1;min-height:0;padding:10px 16px;display:flex;flex-direction:column;gap:8px;overflow:auto}
/* The Desk never scrolls: the title, the paging row and the whole map of the page are on screen at once. The map
   takes what height is left (controls.css), and on a phone too short for all 20 slots it shows one face at a time. */
#desk{overflow:hidden}
/* The Song never scrolls either: the lanes take the height that is left, give way down to 14 px each, and past
   that are shown a part at a time (fitSong). */
#song{overflow:hidden}
#song>#lanes{flex:1 1 auto;min-height:60px;overflow:hidden}
#song .shd{display:flex;align-items:center;gap:8px;min-width:0}
#song .shd b{font-size:17px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:0 1 auto;min-width:0}
#song .shd select{flex:1 1 140px;min-width:0}
#song .shd .tag{flex:none}
#song .acts{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
#song .acts .key{height:44px;font-size:13px;padding:0 10px;min-width:44px;flex:0 1 auto}
#song .acts .key>span{overflow:hidden;text-overflow:ellipsis}
#songlive,#songlive .btns{display:contents}
@media (max-width:699px){#songname{display:none}#song{padding:8px 12px;gap:6px}}
#desk[hidden],#song[hidden]{display:none}
#song>*{flex:none}
.ph2{display:flex;align-items:center;gap:8px;min-height:26px;flex-wrap:wrap}
.ph2 b{font-size:17px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#desk .ph2{flex-wrap:nowrap}
#desk .ph2 b{flex:0 1 auto;min-width:48px}
#desk .ph2 .tag{flex:0 10 auto;min-width:0;overflow:hidden;text-overflow:ellipsis}
#desk .ph2 .pill{flex:none}
#mlpages{margin-left:auto;flex:none;flex-wrap:nowrap;gap:4px}
/* the paging row: the page before, which page of how many, the page after; and the map's face where it has two */
.dots .pgn{font:600 13px ui-monospace,Menlo,monospace;min-width:52px;text-align:center;white-space:nowrap}
.dots .key svg.back{transform:rotate(180deg)}
.dots .sp{flex:1}
.dots .seg .key{min-width:44px;padding:0 10px}
.tag{font:10.5px ui-monospace,Menlo,monospace;text-transform:uppercase;letter-spacing:.08em;color:var(--mute);white-space:nowrap}
.dots{display:flex;gap:6px;align-items:center;flex-wrap:nowrap;margin-top:auto}
#scrim{position:absolute;inset:0;background:rgba(0,0,0,.35);opacity:0;pointer-events:none;transition:opacity .2s;z-index:30}
#scrim.on{opacity:1;pointer-events:auto}
.sheet{position:absolute;left:0;right:0;bottom:0;z-index:31;background:var(--panel);border-top:1px solid var(--line);border-radius:20px 20px 0 0;padding:10px 16px 18px;transform:translateY(105%);visibility:hidden;transition:transform .28s,visibility 0s .28s;max-height:78%;display:flex;flex-direction:column;gap:8px}
.sheet.on{transform:none;visibility:visible;transition-delay:0s}
.sheet h3{margin:0;font-size:17px}
/* a list that can grow is paged, never scrolled: History's rows, the list of Pages, the soloed and muted tracks */
.hl{display:flex;flex-direction:column;overflow:hidden;flex:1;min-height:0}
.hl>*{flex:none}
.pgs{display:flex;align-items:center;gap:6px;flex:none}
.pgs[hidden]{display:none}
.pgs .pgn{font:600 12px ui-monospace,Menlo,monospace;color:var(--mute);flex:1;text-align:center;white-space:nowrap}
.pgs .key svg.back{transform:rotate(180deg)}
#sheet.hist{height:max(62%,min(100%,340px));padding-bottom:10px}
#sheet.hist .cpf{flex-wrap:nowrap}#sheet.hist .cpf input{min-width:0}
.shh{display:flex;align-items:center;gap:8px}.shh h3{flex:1}
.he{display:flex;gap:6px 8px;font-size:13px;padding:7px 0;border-bottom:1px solid var(--cl);align-items:center;flex-wrap:wrap}
.he .ht{flex:1;min-width:150px;display:flex;flex-direction:column;gap:2px;overflow-wrap:anywhere}
.he .hv{font:12px ui-monospace,Menlo,monospace;color:var(--mute);white-space:nowrap}
.he .hv b{color:var(--ink);font-weight:600}
.he .tagu{font:10.5px ui-monospace,Menlo,monospace;border:1px dashed var(--mute);padding:1px 5px;flex:none}
.he.undone>*:not(.tagu){opacity:.45}
/* a step in effect is a place to go back to: the row takes a tap and then offers the way back to just before it */
.he.row{min-height:44px;cursor:pointer}
.he.row:focus-visible{outline:2px solid var(--ink);outline-offset:-2px}
.he.row.sel{background:var(--accbg);box-shadow:inset 0 -3px 0 var(--accd)}
.hday{display:flex;align-items:center;gap:8px;width:100%;min-height:44px;border:0;border-bottom:1px solid var(--cl);background:none;padding:0;font:600 12px ui-monospace,Menlo,monospace;color:var(--mute);cursor:pointer;text-align:left}
.hday svg{transition:transform .15s;flex:none}.hday[aria-expanded="true"] svg{transform:rotate(90deg)}
.hday .sp{flex:1}
.he.old{padding-left:10px}
#histdock{display:none}
.he.undone .ht b{text-decoration:line-through}
/* a checkpoint is a place in the list you can go back to: a card with its own button */
.he.cp{border:1px solid var(--cl);border-radius:12px;padding:6px 8px 6px 10px;margin:5px 0;background:linear-gradient(var(--c1),var(--c2))}
.he.cp .ht{font-weight:600;font-size:14px}
.he.cp svg{flex:none}
.he.saving{border-style:dashed}
.cpf{display:flex;gap:8px;flex-wrap:wrap;margin:0}
.cpf input{flex:1;min-width:150px;height:44px;font:16px 'Helvetica Neue',Helvetica,Arial,sans-serif;border:1px solid var(--line);border-radius:10px;padding:0 10px;background:var(--panel);color:var(--ink);user-select:text;-webkit-user-select:text}
.spin::before{content:"";display:inline-block;box-sizing:border-box;width:10px;height:10px;border-radius:50%;border:2px solid currentColor;border-top-color:transparent;margin-right:6px;vertical-align:-1px;animation:mc-send .7s linear infinite}
/* the identity line, the spectrum when no meter sends, the level meter */
#ident{flex-wrap:nowrap;align-items:baseline}
#setname{font-size:15px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.idf{font:12px ui-monospace,Menlo,monospace;color:var(--mute);white-space:nowrap;flex:none}
.pill.quiet{color:var(--mute);border-style:dashed}
/* no spectrum arrives and the device can be put on Main from here: a strip with the one action, and how it goes */
.spc.act{align-items:center;justify-content:space-between;gap:8px;height:auto;min-height:48px;background:var(--well);border-radius:8px;padding:2px 4px 2px 10px}
.spc.act[data-job="error"]{outline:1px solid var(--bad)}
.lvl{display:flex;align-items:center;gap:8px;height:20px}
.lvl .lt{font:11px ui-monospace,Menlo,monospace;color:var(--mute);flex:none}
.lvl .lb{flex:1;height:10px;border-radius:5px;background:var(--well);position:relative;overflow:hidden}
.lvl .lb i{position:absolute;left:0;top:0;bottom:0;background:var(--ink);border-radius:5px}
.lvl .lb b{position:absolute;top:0;bottom:0;width:2px;margin-left:-1px;background:var(--pin)}
.lvl .ln{font:11.5px ui-monospace,Menlo,monospace;flex:none;min-width:76px;text-align:right;white-space:nowrap}
.lvl:not([data-state="on"]) .lb{background:repeating-linear-gradient(135deg,var(--well) 0 4px,transparent 4px 8px)}
.lvl:not([data-state="on"]) .ln{color:var(--mute)}
/* the Song's buttons by what they touch; the confirm that shows what a build replaces */
.bgrp{display:flex;flex-direction:column;gap:4px}
.swap{display:flex;align-items:stretch;gap:8px;flex-wrap:wrap}
.swap>div{flex:1;min-width:130px;border:1px solid var(--cl);border-radius:12px;padding:8px 10px;background:var(--c2);display:flex;flex-direction:column;gap:2px;font-size:13px;overflow-wrap:anywhere}
.swap>div b{font-size:15px}
.swap .gone{border-color:var(--bad)}.swap .gone b{text-decoration:line-through;text-decoration-color:var(--bad)}
.swap>.arr{flex:none;min-width:0;border:0;background:none;padding:0;justify-content:center}
.key.danger{background:var(--bad);border-color:var(--bad);color:var(--bg);box-shadow:0 2px 0 var(--edge)}
.he .w2{font:11px ui-monospace,Menlo,monospace;color:var(--mute);width:56px;flex:none}
.he .who{font:10.5px ui-monospace,Menlo,monospace;border:1px solid var(--line);padding:1px 5px;flex:none}
.he .who.agent{background:var(--acc);color:#111}
.he .who.minilab{background:var(--pin);color:#fff;border-color:var(--pind)}
.lane{display:flex;align-items:stretch;gap:8px;min-width:0;flex:1 1 22px;min-height:14px;max-height:22px}
.lane[hidden]{display:none}
.lane .ln{line-height:14px;align-self:center}
.lane .ln{font:11px ui-monospace,Menlo,monospace;color:var(--mute);width:64px;flex:none;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lane .tr{flex:1;min-width:0;border-radius:6px;background:var(--well);position:relative;overflow:hidden}
.lane .tr i{position:absolute;top:2px;bottom:2px;background:var(--ink);opacity:.85;border-radius:3px}
.lane .tr b{position:absolute;top:0;bottom:0;width:2px;background:var(--pin)}
.sketch{font-size:12px;color:var(--mute);padding:6px 0}
.sketch b{color:var(--ink)}
.bdg{font:10px ui-monospace,Menlo,monospace;font-style:normal;text-transform:uppercase;letter-spacing:.06em;border:1px dashed var(--mute);border-radius:10px;padding:1px 6px;color:var(--mute)}
/* the bar ruler over the lanes: bar numbers, the sections, the loop, and Live's playhead through ruler and lanes */
#lanes{position:relative;display:flex;flex-direction:column;gap:3px;--lnw:72px}
.ruler{display:flex;align-items:stretch;gap:8px;min-width:0;flex:none}
#lanes .pgs{margin-top:auto;position:relative;z-index:3;background:var(--bg)}
.ruler .ln{width:64px;flex:none}
.ruler .rt{flex:1;min-width:0;height:34px;position:relative;font:10px ui-monospace,Menlo,monospace;color:var(--mute)}
.ruler .rt .sec{position:absolute;top:14px;height:8px;border-radius:2px;background:var(--k3);box-shadow:inset 2px 0 0 var(--ink)}
.ruler .rt .sec.s1{background:var(--well)}
.ruler .rt .bn{position:absolute;top:0;transform:translateX(1px);font-style:normal}
.ruler .rt .lp{position:absolute;top:24px;height:8px;border-radius:2px;background:var(--acc);border:1px solid var(--accd);box-sizing:border-box}
#songhead{position:absolute;top:0;bottom:0;width:2px;margin-left:-1px;background:var(--pin);pointer-events:none;z-index:2}
#songhead[hidden]{display:none}
.sets{display:flex;gap:8px;flex-wrap:nowrap;min-width:0}
.sets>div{flex:0 1 auto;border:1px solid var(--cl);border-radius:12px;padding:4px 10px;background:var(--c2);display:flex;flex-direction:column;gap:1px;font-size:12px;min-width:0;overflow:hidden}
.sets>div b{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sets>div.need{border-style:dashed}
.key:disabled{opacity:.4;cursor:default}
.sheet.tall{height:94%;max-height:94%}
.sheet.tall iframe{flex:1;min-height:0;width:100%;border:1px solid var(--cl);border-radius:12px;background:#0e0f11}
.btns{display:flex;gap:8px;flex-wrap:wrap}
select{font:inherit;color:inherit;background:var(--panel);border:1px solid var(--line);border-radius:8px;height:44px;max-width:100%}
#toast{position:absolute;left:50%;top:150px;transform:translate(-50%,-10px);background:var(--ink);color:var(--bg);padding:8px 14px;border-radius:12px;font-size:13px;z-index:50;opacity:0;transition:all .2s;pointer-events:none;max-width:92%}
#toast.on{opacity:1;transform:translate(-50%,0)}
#bubble{position:fixed;z-index:60;pointer-events:none;background:var(--ink);color:var(--bg);font:600 20px ui-monospace,Menlo,monospace;padding:6px 12px;border-radius:12px;opacity:0;white-space:nowrap}
#bubble small{font:500 11px ui-monospace,Menlo,monospace;opacity:.7;margin-left:8px}
#bubble.on{opacity:1}
#bubble[hidden]{display:none}
/* A Page's controls are one panel, a map of the MiniLab 3: /app/shell/controls.css and controls.js. */
#mlpages .key{min-width:44px}
#desk>*{flex:none}
.pl{display:flex;flex-direction:column;gap:6px}
.pl .key{justify-content:flex-start;width:100%;overflow:hidden;text-overflow:ellipsis}
#side>.key{flex:none}
#deskhead,#mlnums,#panelbox,#deskdots{display:contents}
#desk>*>:not(.mlpw){flex:none}
/* A page change that Live has not confirmed yet: the tapped button waits (.is-waiting, shell.css), the line runs, the old controls dim. */
#slow{flex:none;display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:8px 16px;background:var(--panel);border-bottom:1px solid var(--line);font-size:14px}
#slow[hidden]{display:none}
#slow span{flex:1;min-width:140px}
/* One breakpoint system: phone is one column; tablet (700) puts the Hear bar beside the Desk; desktop (1100) adds the list of Pages. The tab bar is at the bottom on a phone and at the top from 700 px up (nav.js). */
@media (max-width:380px){#hbot{gap:6px}#hbot .seg .key{padding:0 8px}}
/* a short phone: the Hear bar keeps the song's facts and the playhead; the spectrum and the level give the Desk room */
@media (max-width:699px) and (max-height:720px){#specbox,#lvl{display:none}#htop{padding:6px 16px}#desk{padding:8px 12px;gap:6px}}
@media (max-width:699px){#htop>.hr{flex-wrap:nowrap}#chgpill{flex:0 1 auto;min-width:0}#chgbase{flex:0 1 auto}#chgn{flex:none;white-space:nowrap}}
@media (min-width:700px){
 #cols{display:grid;grid-template-columns:minmax(0,1fr) 320px;grid-template-rows:minmax(0,1fr)}
 #hear{display:flex;flex-direction:column;min-height:0;overflow:hidden;border-left:1px solid var(--line);background:var(--panel)}
 #htop,#main,#hbot{order:0}
 #htop{flex:1 0 auto;border-bottom:0}
 #htop .spc{height:auto;min-height:140px;flex:1}
 #htop .spc.act{flex:none;min-height:48px}
 #flagpop{bottom:76px}
}
@media (min-width:1100px){
 #cols{grid-template-columns:220px minmax(0,1fr) 320px}
 #side{display:flex;flex-direction:column;gap:8px;min-height:0;overflow:hidden;padding:10px 12px;border-right:1px solid var(--line);background:var(--panel)}
 #side .pl{flex:1;min-height:0;overflow:hidden}
 .dots{display:none}
 /* History is docked in the right column, between the song's facts and the transport: its rows fill while knobs turn */
 #htop{flex:none}
 #htop .spc{min-height:96px;height:96px;flex:none}
 #htop .spc.act{min-height:48px;height:auto}
 #histdock{display:flex;flex-direction:column;gap:8px;flex:1;min-height:120px;padding:8px 16px;border-top:1px solid var(--line);overflow:hidden}
 #histdock .hl{flex:1;min-height:0}
 #histdock.ping{animation:dock-ping .6s ease-out 1}
 #khist{display:none}
}
@keyframes dock-ping{0%{background:var(--accbg)}100%{background:transparent}}
@media (min-width:1400px){#cols{grid-template-columns:280px minmax(0,1fr) 420px}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

  if (t.dataset.loop) {  // the lit key again turns looping off; shown at once, Live's report settles it
    const to = S.state.loop === t.dataset.loop ? "off" : t.dataset.loop, was = S.state.loop;
    S.state.loop = to; renderBottom();
    const r = await command("transport", {action: "loop", loop: to});
    if (!r.ok) { S.state.loop = was; renderBottom(); }
    return;
  }
  if (t.id === "kundo" || t.id === "hundo") return stepHistory("undo");
  if (t.id === "kredo" || t.id === "hredo") return stepHistory("redo");
  if (t.id === "khist") return showHistory();
  if (t.id === "hclose") { S.sheet = false; return renderHist(); }
});
document.addEventListener("submit", e => { if (e.target.id === "cpform") { e.preventDefault(); saveCheckpoint($("#cpname").value || S.cpDraft); } });
// The name being typed is kept in the state, so no redraw of the sheet (an event from Live, a tab change) can lose it.
document.addEventListener("input", e => { if (e.target.id === "cpname") S.cpDraft = e.target.value; });
$("#scrim").addEventListener("click", () => { S.sheet = false; renderHist(); closeSheet(); });
// The History sheet and the list of soloed or muted tracks take nothing from the page behind them: a press outside
// closes them and goes on to whatever was pressed (the scrim is only for the sheets that ask a question).
document.addEventListener("pointerdown", e => {
  const on = e.target.closest ? e.target : document.body;
  if (S.sheet === "hist" && !on.closest("#sheet") && !on.closest("#khist") && !on.closest("#chgpill")) { S.sheet = false; renderHist(); }
  if (S.flagOpen && !on.closest("#flagpop") && !on.closest("[data-flags]")) { S.flagOpen = null; renderBottom(); }
}, true);

// ---- events ---------------------------------------------------------------------------------------------------------
function apply(m) {
  let part = "all";
  if (m.t === "full") S.state = m.state;
  else if (m.t === "hear") { S.hear = m; if (!S.state) return; renderTop(); return renderDesk(); }
  else if (m.t === "hist") {
    const top = m.entries.reduce((x, e) => Math.max(x, e.id), 0);
    if (S.histTop !== undefined && top > S.histTop) S.histAt = 0;  // something new happened: the newest rows show
    S.histTop = top;
    S.hist = m; renderBottom(); updateChanged(); return renderHist(); }
  else if (m.t === "meter") {
    const was = specMode();
    S.meter = m; S.meterAt = Date.now(); S.mjob = null;
    return was === "bars" ? updateSpec() : renderTop();
  }
  else if (m.t === "meterjob") { S.mjob = m.status === "done" ? null : {status: m.status, msg: m.msg || ""}; return renderTop(); }
  else if (m.t === "own") { for (const key of showAhead(m.values)) settle(key, 3000); return; }
  else if (m.t === "flags" && S.state) {
    S.state.solo = m.solo; S.state.mute = m.mute;
    for (const key of Object.keys(S.flagGone)) { const [track, flag] = [key.slice(0, key.lastIndexOf("/")), key.slice(key.lastIndexOf("/") + 1)]; if (!(S.state[flag] || []).includes(track)) delete S.flagGone[key]; }
    return renderBottom();
  }
  else if (m.t === "v" && S.state) {
    S.state.values[`${m.page}:${m.slot}`] = {...(S.state.values[`${m.page}:${m.slot}`] || {}), n: m.n, s: m.s, r: m.r, key: m.key};
    // one parameter may sit on several pages: each of its slots reports in its own message, a moment apart. They are
    // one value, so all of them have it now (else a slot not yet heard from would show the old place for that moment).
    if (m.key) for (const v of Object.values(S.state.values)) if (v.key === m.key) { v.n = m.n; v.s = m.s; v.r = m.r; }
    if (m.key && OWN[m.key]) return reported(m.key, m.n);  // a control this page is moving: its own number stays until Live has the last word
    part = "desk";
  }
  else if (m.t === "pos" && S.state) {
    const flipped = S.state.playing !== m.p;
    S.state.pos = m.b; S.state.playing = m.p;
    if (m.bpm && S.state.song && S.state.song.tempo !== m.bpm) { S.state.song.tempo = m.bpm; renderTop(); }
    if (flipped) renderBottom();
    return updatePos();
  }
  else if (m.t === "loop" && S.state) {
    S.state.loop = m.loop;
    if (m.start != null && m.length != null) S.state.loop_span = [m.start, m.length];
    renderTop(); renderBottom(); return updateSongMarks();
  }
  else if (m.t === "page" && S.state) S.state.page = m.page;
  else if (m.t === "mon" && S.state) S.state.monitor = {slot: m.slot, ref: m.ref};
  else if (m.t === "desk") { S.layouts = {}; S.scales = {}; loadDesk(); return; }
  pageConfirmed(); wanted(); openingCheck();
  S.lockReason = S.state && !["attached", "starting", NO_MINILAB].includes(S.state.live) ? `Live: ${S.state.live}` : "";
  if (part === "desk") renderDesk();
  else { render(); updateSongMarks(); }
}
// A meter that stops sending (the device was taken off Main) is said so, not left showing its last bars.
setInterval(() => { if (S.meter && !meterFresh() && $("#spec:not(.act)")) renderTop(); }, 1000);
if (window.zpktListen) onListen({state: window.zpktListen.state, peak: window.zpktListen.stats.peak, resume: window.zpktListen.resume});
async function loadDesk() { S.desk = await (await fetch("/api/desk")).json(); wanted(); openingCheck(); render(); }
function connect() {
  const es = new EventSource("/events?app=1");
  es.onmessage = ev => apply(JSON.parse(ev.data));
  es.onerror = () => { S.lockReason = "Lost the connection. Trying again."; renderHear(); };
}
loadDesk().then(connect);
// Crossing the desktop breakpoint draws or drops the side column.
window.matchMedia("(min-width:1100px)").addEventListener("change", render);
route();
window.zpkt = {S, redraw: () => render(), command, armPage, wait: WAIT, own: OWN, textAt, placeOf, cpLabel, litState, roundPlace, stepPlace, valueAt, loopBars};
</script>
