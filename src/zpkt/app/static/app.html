<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>zpkt</title>
<style>
:root{--bg:#f1eee6;--panel:#fff;--ink:#111;--mute:#6a6963;--line:#111;--acc:#c6f432;--accd:#8aa31b;--pin:#2f6fed;--pind:#1f4fb5;--bad:#b3261e;--c1:#fff;--c2:#f8f7f3;--cl:#d9d7d0;--well:#dcdbd5;--edge:#c9c8c2;--k3:#bcbbb4}
@media (prefers-color-scheme:dark){:root{--bg:#121212;--panel:#1c1c1c;--ink:#f2f2ee;--mute:#9c9b95;--line:#4a4a4a;--pin:#6b9bff;--pind:#3a68d0;--bad:#ff7a70;--c1:#2a2a2c;--c2:#222224;--cl:#3d3d40;--well:#3b3c40;--edge:#141416;--k3:#0d0d0f}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0;background:var(--bg);color:var(--ink);font:15px/1.4 'Helvetica Neue',Helvetica,Arial,sans-serif;overflow:hidden;user-select:none;-webkit-user-select:none}
button{font:inherit;color:inherit}
svg{display:block}
.mono{font-family:ui-monospace,Menlo,monospace}
#app{height:100%;display:flex;flex-direction:column;max-width:100%;position:relative}
.hear{background:var(--panel);flex:none}
#htop{border-bottom:1.5px solid var(--line);padding:8px 16px;display:flex;flex-direction:column;gap:6px}
#hbot{border-top:1.5px solid var(--line);padding:8px 10px;display:flex;align-items:center;gap:5px;overflow:hidden}
#hbot .key{min-width:40px;padding:0 8px}
#hbot .seg .key{padding:0 10px}
.hr{display:flex;align-items:center;gap:8px;min-width:0;flex-wrap:wrap}
.sp{flex:1}
.nm{font:600 14px ui-monospace,Menlo,monospace;white-space:nowrap}
.pill{font:11.5px ui-monospace,Menlo,monospace;border:1px solid var(--line);padding:2px 7px;white-space:nowrap;background:var(--panel)}
.pill.acc{background:var(--acc);color:#111;border-color:#6d8213}
.pill.pin{background:var(--pin);color:#fff;border-color:var(--pind)}
.pill.warn{border-color:var(--bad);color:var(--bad)}
.tl{height:16px;border-radius:4px;background:var(--well);position:relative;overflow:hidden}
.tl .ph{position:absolute;top:0;bottom:0;width:2px;background:var(--ink)}
.spc{display:flex;align-items:flex-end;gap:2px;height:40px}
.spc i{flex:1;background:var(--ink);opacity:.85;min-height:2px}
.key{min-width:44px;height:48px;border-radius:12px;border:1px solid var(--cl);background:linear-gradient(var(--c1),var(--c2));box-shadow:0 2px 0 var(--edge);display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:0 12px;font-size:14px;cursor:pointer;white-space:nowrap}
.key:active{transform:translateY(1.5px);box-shadow:0 .5px 0 var(--edge)}
.key.on{background:var(--acc);border-color:var(--accd);color:#111}
.key.pin{background:var(--pin);border-color:var(--pind);color:#fff}
.key.sm{height:44px;min-width:44px;font-size:13px;padding:0 10px}
.key.off{opacity:.4}
.seg{display:flex}.seg .key{border-radius:0}.seg .key:first-child{border-radius:12px 0 0 12px}.seg .key:last-child{border-radius:0 12px 12px 0}
#banner{display:none;background:var(--pin);color:#fff;padding:6px 16px;font-size:13px}
#banner.on{display:block}
#lock{display:none;background:var(--bad);color:#fff;padding:6px 16px;font-size:13px}
#lock.on{display:block}
#main{flex:1;min-height:0;position:relative;display:flex;flex-direction:column;overflow:hidden}
#desk{flex:1;min-height:0;padding:10px 16px;display:flex;flex-direction:column;gap:8px;overflow:auto}
#tabs{display:flex;border-top:1.5px solid var(--line);background:var(--panel);flex:none}
#tabs button{flex:1;height:48px;background:none;border:0;display:flex;align-items:center;justify-content:center;gap:6px;font-size:12px;color:var(--mute)}
#tabs button.on{color:var(--ink);box-shadow:inset 0 3px 0 var(--acc)}
.ph2{display:flex;align-items:center;gap:8px;min-height:26px}
.ph2 b{font-size:17px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tag{font:10.5px ui-monospace,Menlo,monospace;text-transform:uppercase;letter-spacing:.08em;color:var(--mute);white-space:nowrap}
.g4{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.ctl{display:flex;flex-direction:column;align-items:center;position:relative;touch-action:none;min-width:0}
.ctl .w{width:100%;max-width:72px;height:56px;border:1px solid var(--cl);border-radius:12px;background:var(--well);position:relative;overflow:hidden;cursor:ns-resize;touch-action:none}
.ctl.pad .w{cursor:pointer;height:44px}
.ctl .w i{position:absolute;left:0;right:0;bottom:0;background:var(--ink);opacity:.8}
.ctl.missing .w{opacity:.35}
.ctl .v{font:12.5px ui-monospace,Menlo,monospace;margin-top:2px;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ctl .l{color:var(--mute);font-size:11px;line-height:1.15;height:26px;text-align:center;overflow:hidden;max-width:100%}
.ctl.chg::after{content:"";position:absolute;top:0;right:calc(50% - 40px);width:9px;height:9px;border-radius:50%;background:var(--acc);border:1px solid var(--line)}
.ctl.flash .w{outline:2px solid var(--acc)}
.dots{display:flex;gap:6px;justify-content:center;align-items:center;padding:4px;flex-wrap:wrap}
.dots button{width:14px;height:14px;border-radius:50%;border:0;background:var(--k3);padding:0}
.dots button.c{background:var(--ink);width:26px;border-radius:7px}
#scrim{position:absolute;inset:0;background:rgba(0,0,0,.35);opacity:0;pointer-events:none;transition:opacity .2s;z-index:30}
#scrim.on{opacity:1;pointer-events:auto}
.sheet{position:absolute;left:0;right:0;bottom:0;z-index:31;background:var(--panel);border-top:1.5px solid var(--line);border-radius:20px 20px 0 0;padding:10px 16px 18px;transform:translateY(105%);visibility:hidden;transition:transform .28s,visibility 0s .28s;max-height:78%;display:flex;flex-direction:column;gap:8px}
.sheet.on{transform:none;visibility:visible;transition-delay:0s}
.sheet h3{margin:0;font-size:17px}
.hl{display:flex;flex-direction:column;overflow:auto}
.he{display:flex;gap:8px;font-size:13px;padding:7px 0;border-bottom:1px solid var(--cl);align-items:center}
.he .w2{font:11px ui-monospace,Menlo,monospace;color:var(--mute);width:56px;flex:none}
.he .who{font:10.5px ui-monospace,Menlo,monospace;border:1px solid var(--line);padding:1px 5px;flex:none}
.he .who.agent{background:var(--acc);color:#111}
.he .who.minilab{background:var(--pin);color:#fff;border-color:var(--pind)}
.spc.ver{height:24px;margin-top:-2px}
.spc.ver i{background:var(--pin);opacity:.9}
.vline{font:12px ui-monospace,Menlo,monospace;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.ol{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px;flex:none}
.ol .key{height:44px;font-size:13px;flex:none;max-width:70vw;overflow:hidden;text-overflow:ellipsis}
.vg{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;overflow:auto;min-height:0}
.vc{border:1px solid var(--cl);border-radius:12px;padding:8px 10px;background:linear-gradient(var(--c1),var(--c2));text-align:left;display:flex;flex-direction:column;gap:2px;cursor:pointer;min-height:64px}
.vc.on{border-color:var(--pind);box-shadow:inset 0 0 0 2px var(--pin)}
.vc.now{background:var(--acc);color:#111}
.vc.off{opacity:.45;cursor:default}
.vc b{font-size:13px;line-height:1.2}
.vc span{font:11.5px ui-monospace,Menlo,monospace;color:var(--mute)}
.vc.now span{color:#111}
.gp{color:var(--pind)}.gn{color:var(--bad)}
#toast{position:absolute;left:50%;top:150px;transform:translate(-50%,-10px);background:var(--ink);color:var(--bg);padding:8px 14px;border-radius:12px;font-size:13px;z-index:50;opacity:0;transition:all .2s;pointer-events:none;max-width:92%}
#toast.on{opacity:1;transform:translate(-50%,0)}
#bubble{position:fixed;z-index:60;pointer-events:none;background:var(--ink);color:var(--bg);font:600 20px ui-monospace,Menlo,monospace;padding:6px 12px;border-radius:12px;opacity:0;white-space:nowrap}
#bubble.on{opacity:1}
@media (max-width:380px){#hbot{gap:4px;padding:8px 6px}#hbot .key{min-width:36px;padding:0 6px}#hbot .seg .key{padding:0 8px}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style></head><body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
<symbol id="i-play" viewBox="0 0 24 24"><path d="M7 4l13 8-13 8z" fill="currentColor"/></symbol>
<symbol id="i-stop" viewBox="0 0 24 24"><rect x="6" y="6" width="12" height="12" rx="1.5" fill="currentColor"/></symbol>
<symbol id="i-undo" viewBox="0 0 24 24"><path d="M9 14L4 9l5-5M4 9h10.5a5.5 5.5 0 0 1 0 11H11" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></symbol>
<symbol id="i-redo" viewBox="0 0 24 24"><path d="M15 14l5-5-5-5M20 9H9.5a5.5 5.5 0 0 0 0 11H13" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></symbol>
<symbol id="i-hist" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8" fill="none" stroke="currentColor" stroke-width="2.2"/><path d="M12 7v5l3 2" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></symbol>
<symbol id="i-desk" viewBox="0 0 24 24"><circle cx="8" cy="8" r="3.5" fill="none" stroke="currentColor" stroke-width="2.2"/><circle cx="16" cy="16" r="3.5" fill="none" stroke="currentColor" stroke-width="2.2"/><path d="M13 7h7M4 17h5" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></symbol>
<symbol id="i-pin" viewBox="0 0 24 24"><path d="M9 3h6l-1 6 3 3v2H7v-2l3-3zM12 14v7" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></symbol>
<symbol id="i-opts" viewBox="0 0 24 24"><rect x="4" y="4" width="7" height="7" rx="1.5" fill="none" stroke="currentColor" stroke-width="2.2"/><rect x="13" y="4" width="7" height="7" rx="1.5" fill="none" stroke="currentColor" stroke-width="2.2"/><rect x="4" y="13" width="7" height="7" rx="1.5" fill="none" stroke="currentColor" stroke-width="2.2"/><rect x="13" y="13" width="7" height="7" rx="1.5" fill="currentColor" stroke="currentColor" stroke-width="2.2"/></symbol>
</svg>
<div id="app">
 <div class="hear" id="htop"></div>
 <div id="lock" role="alert"></div>
 <div id="banner" role="status"></div>
 <div id="main"><div id="desk"></div><div id="scrim"></div><div class="sheet" id="sheet"></div></div>
 <div class="hear" id="hbot"></div>
 <div id="tabs"><button class="on" data-t="desk"><svg width="20" height="20"><use href="#i-desk"/></svg>Desk</button><button data-t="opts" id="topts"><svg width="20" height="20"><use href="#i-opts"/></svg>Options</button></div>
 <div id="toast" role="status"></div><div id="bubble"></div>
</div>
<script>
"use strict";
const $ = s => document.querySelector(s);
const I = n => `<svg width="22" height="22"><use href="#i-${n}"/></svg>`;
const S = {state: null, desk: null, hear: {hearing: "now", changed: 0, keys: [], match: true, monitor: {slot: "W", ref: "C1"}, pin: "start"},
           hist: {entries: [], can_undo: false, can_redo: false}, meter: null, sheet: false, flash: {},
           options: {options: [], shown: null}, optSel: null};
let toastTimer = 0;

function toast(msg) { const t = $("#toast"); t.textContent = msg; t.classList.add("on"); clearTimeout(toastTimer); toastTimer = setTimeout(() => t.classList.remove("on"), 2200); }
async function command(kind, args = {}, group) {
  const r = await fetch("/api/command", {method: "POST", headers: {"Content-Type": "application/json"}, body: JSON.stringify({kind, args, group})});
  const body = await r.json();
  if (!r.ok) toast(body.error || "That did not work.");
  return {ok: r.ok, body};
}

// ---- the Hear bar -------------------------------------------------------------------------------------------------
function renderHear() { renderTop(); renderBottom(); }
function renderTop() {
  const st = S.state, h = S.hear;
  if (!st) return;
  const bar = Math.floor(st.pos / 4) + 1, total = 64 * 4;
  const bands = S.meter ? S.meter.db.map(d => Math.max(2, Math.min(100, (d + 90) / 90 * 100))) : [];
  $("#htop").innerHTML = `<div class="hr"><span class="nm" id="barno">bar ${bar}</span><span class="sp"></span>
    <span class="pill ${st.live === "attached" ? "" : "warn"}" id="livepill">${st.live === "attached" ? "Live" : st.live}</span></div>
    <div class="tl"><div class="ph" style="left:${Math.min(100, (st.pos % total) / total * 100)}%"></div></div>
    <div class="spc" aria-label="Spectrum">${bands.map(b => `<i style="height:${b}%"></i>`).join("")}</div>${versionStrip()}
    <div class="hr"><span class="pill ${h.changed ? "acc" : ""}" id="chgpill">${h.changed} changed</span>
    ${h.match ? '<span class="pill">matched</span>' : ""}
    ${h.hearing === "pin" ? '<span class="pill pin" id="hearpill">hearing Pin</span>' : h.hearing === "ref" ? '<span class="pill pin" id="hearpill">hearing Ref</span>' : ""}</div>`;
}
const dB = x => x == null ? "–" : (x > 0 ? "+" : "") + x.toFixed(1);
function loud(v) { return v.measure && v.measure.lufs != null ? v.measure.lufs : (v.known && v.known.lufs != null ? v.known.lufs : null); }
function versionStrip() {
  const sh = S.options.shown;
  if (!sh) return "";
  const v = sh.version, m = v.measure, g = v.gap;
  const bands = m ? m.bands_db.map(d => Math.max(2, Math.min(100, (d + 90) / 90 * 100))) : [];
  const lufs = loud(v);
  return `<div class="vline" id="vstrip"><span class="pill pin">${sh.title.replace(/</g, "&lt;")}</span><b>${v.label.replace(/</g, "&lt;")}</b>
    <span>${lufs == null ? "not measured" : lufs.toFixed(1) + " LUFS"}</span>${m ? `<span>peak ${m.peak_db.toFixed(1)}</span>` : ""}
    ${g ? `<span class="${g.peak_db >= 0 ? "gp" : "gn"}">gap ${dB(g.lufs != null ? g.lufs : g.rms_db)} ${g.lufs != null ? "LU" : "dB"}</span>` : ""}</div>
    ${m ? `<div class="spc ver" aria-label="Spectrum of this Version">${bands.map(b => `<i style="height:${b}%"></i>`).join("")}</div>` : ""}`;
}
function renderBottom() {
  const st = S.state, h = S.hear;
  if (!st) return;
  $("#hbot").innerHTML = `<button class="key ${st.playing ? "on" : ""}" id="kplay" aria-label="Play or stop">${I(st.playing ? "stop" : "play")}</button>
    <div class="seg" role="group" aria-label="What you hear">
      <button class="key ${h.hearing === "now" ? "on" : ""}" data-hear="now">Now</button>
      <button class="key ${h.hearing === "pin" ? "pin" : ""}" data-hear="pin">Pin</button>
      <button class="key ${h.hearing === "ref" ? "pin" : ""}" data-hear="ref">Ref</button></div>
    <button class="key sm" id="kmkpin" aria-label="Pin the mix as it is now">${I("pin")}</button>
    <span class="sp"></span>
    <button class="key sm ${S.hist.can_undo ? "" : "off"}" id="kundo" aria-label="Undo">${I("undo")}</button>
    <button class="key sm ${S.hist.can_redo ? "" : "off"}" id="kredo" aria-label="Redo">${I("redo")}</button>
    <button class="key sm" id="khist" aria-label="History">${I("hist")}</button>`;
  renderBanner();
}
function renderBanner() {
  const h = S.hear, banner = $("#banner");
  banner.classList.toggle("on", h.hearing === "pin" || h.hearing === "ref");
  banner.textContent = h.hearing === "pin" ? "You hear the pinned version. Touch any control to go back to Now." : h.hearing === "ref" ? "You hear the reference." : "";
  const lock = $("#lock");
  lock.classList.toggle("on", !!S.lockReason);
  lock.textContent = S.lockReason || "";
}

// ---- the Desk ---------------------------------------------------------------------------------------------------
const KNOBS = ["k1","k2","k3","k4","k5","k6","k7","k8"], FADERS = ["f1","f2","f3","f4"], PADS = ["b1","b2","b3","b4","b5","b6","b7","b8"];
function labelOf(c) { return c.label || (c.param === "volume" || c.param === "pan" ? `${c.track} ${c.param}` : c.device ? `${c.track} ${c.device}` : c.track || ""); }
function ctl(pg, slot, c) {
  const v = (S.state.values || {})[`${S.state.page}:${slot}`] || {};
  const isPad = slot[0] === "b", n = v.n == null ? 0 : v.n;
  const chg = v.key && S.hear.keys.includes(v.key);
  const missing = !v.key && c.param !== undefined && !c.macro && v.s === undefined;
  return `<div class="ctl ${isPad ? "pad" : ""} ${chg ? "chg" : ""} ${S.flash[v.key] ? "flash" : ""} ${missing ? "missing" : ""}" data-slot="${slot}" data-key="${v.key || ""}">
    <div class="w" data-slot="${slot}" role="slider" aria-label="${labelOf(c)}" aria-valuenow="${Math.round(n * 100)}"><i style="height:${Math.round(n * 100)}%"></i></div>
    <div class="v">${v.s ?? ""}</div><div class="l">${labelOf(c)}</div></div>`;
}
function renderDesk() {
  if (!S.state || !S.desk) return;
  const pages = S.desk.pages, i = Math.min(S.state.page, pages.length - 1), pg = pages[i], cs = pg.controls || {};
  const row = slots => `<div class="g4">${slots.filter(s => cs[s]).map(s => ctl(pg, s, cs[s])).join("")}</div>`;
  $("#desk").innerHTML = `<div class="ph2"><b id="pagename">${pg.name}</b><span class="tag">page ${i + 1} of ${pages.length}</span><span class="sp"></span>
    <span class="pill acc" id="mlchip">${S.state.live === "attached" ? "on MiniLab" : "no MiniLab"}</span></div>
    ${row(KNOBS.slice(0, 4))}${row(KNOBS.slice(4))}${row(FADERS)}${row(PADS.slice(0, 4))}${row(PADS.slice(4))}
    <div class="dots" role="group" aria-label="Pages">${pages.map((p, k) => `<button data-page="${k}" class="${k === i ? "c" : ""}" aria-label="${p.name}"></button>`).join("")}</div>`;
}
function renderOptions() {
  const sh = $("#sheet"), os = S.options.options;
  const sel = os.find(o => o.id === S.optSel) || os[0];
  const shownId = S.options.shown && S.options.shown.option === (sel && sel.id) ? S.options.shown.version.id : null;
  const esc = t => String(t).replace(/</g, "&lt;");
  const card = v => {
    const l = loud(v), g = v.gap, ok = v.status === "ready";
    const sub = ok ? `${l == null ? "not measured" : l.toFixed(1) + " LUFS"}${g ? " · " + dB(g.lufs != null ? g.lufs : g.rms_db) : ""}` : v.status === "gone" ? "file is gone" : v.status;
    return `<button class="vc ${shownId === v.id ? "on" : ""} ${sel.now === v.id ? "now" : ""} ${ok ? "" : "off"}" data-opt="${esc(sel.id)}" data-ver="${esc(v.id)}"><b>${esc(v.label)}</b><span>${sub}</span>${sel.now === v.id ? "<span>Now</span>" : ""}</button>`;
  };
  const cur = sel && shownId ? sel.versions.find(v => v.id === shownId) : null;
  sh.innerHTML = `<h3>Options</h3>${os.length ? `<div class="ol" role="group" aria-label="Options">${os.map(o => `<button class="key ${o.id === sel.id ? "on" : ""}" data-optsel="${esc(o.id)}">${esc(o.title)} <span class="tag">${esc(o.progress)}</span></button>`).join("")}</div>
    <div class="vg" id="vgrid">${sel.versions.map(card).join("") || '<div class="he">No Versions yet.</div>'}</div>
    ${sel.note ? `<div class="tag">${esc(sel.note)}</div>` : ""}` : '<div class="he">No Options yet. Ask for one with the options.make command, or run a mix 2 batch.</div>'}
    <div class="hr"><button class="key sm ${cur && cur.writes ? "" : "off"}" id="onow">Make it Now</button><span class="sp"></span><button class="key sm" id="hclose">Close</button></div>`;
}
function renderHist() {
  const sh = $("#sheet");
  $("#scrim").classList.toggle("on", !!S.sheet);
  sh.classList.toggle("on", !!S.sheet);
  $("#topts").classList.toggle("on", S.sheet === "options");
  if (!S.sheet) return;
  if (S.sheet === "options") return renderOptions();
  const es = S.hist.entries.slice().reverse().slice(0, 12);
  const when = at => new Date(at * 1000).toTimeString().slice(0, 8);
  const text = e => e.k === "checkpoint" ? `version ${e.name}` : e.k === "revert" ? `back to ${e.to}` :
    e.moves.length === 1 ? e.moves[0].label : `${e.moves[0].label} and ${e.moves.length - 1} more` + (e.group ? ` (${e.group})` : "");
  sh.innerHTML = `<h3>History</h3><div class="hl">${es.map(e => `<div class="he"><span class="w2">${when(e.at)}</span><span class="who ${e.who || "you"}">${e.who || "you"}</span><span>${text(e)}</span></div>`).join("") || '<div class="he">No changes yet.</div>'}</div>
    <div class="hr"><button class="key sm ${S.hist.can_undo ? "" : "off"}" id="hundo">${I("undo")}Undo</button><button class="key sm" id="hver">Make a version</button><button class="key sm" id="hclose">Close</button></div>`;
}
function render() { renderHear(); renderDesk(); renderHist(); }

// ---- touching controls ---------------------------------------------------------------------------------------------
let drag = null, sendTimer = 0;
document.addEventListener("pointerdown", e => {
  const w = e.target.closest(".ctl .w");
  if (!w) return;
  const el = w.closest(".ctl"), slot = el.dataset.slot, key = el.dataset.key;
  if (slot[0] === "b") { command("mix.toggle", {slot, page: S.state.page}); return; }
  if (!key) return;
  const v = S.state.values[`${S.state.page}:${slot}`] || {};
  drag = {key, slot, y: e.clientY, n0: v.n ?? 0, n: v.n ?? 0, el};
  w.setPointerCapture(e.pointerId);
  e.preventDefault();
});
document.addEventListener("pointermove", e => {
  if (!drag) return;
  drag.n = Math.max(0, Math.min(1, drag.n0 + (drag.y - e.clientY) / 160));
  const w = drag.el.querySelector(".w");
  w.querySelector("i").style.height = Math.round(drag.n * 100) + "%";
  const b = $("#bubble"); b.textContent = Math.round(drag.n * 100) + "%"; b.classList.add("on");
  b.style.left = (e.clientX + 14) + "px"; b.style.top = (e.clientY - 50) + "px";
  clearTimeout(sendTimer);
  sendTimer = setTimeout(sendDrag, 40);
});
function sendDrag() { if (drag) command("mix.set", {norms: [[drag.key, drag.n]]}); }
document.addEventListener("pointerup", () => {
  if (!drag) return;
  clearTimeout(sendTimer); sendDrag(); drag = null; $("#bubble").classList.remove("on");
});

document.addEventListener("click", async e => {
  const t = e.target.closest("button");
  if (!t) return;
  if (t.dataset.hear) return command("monitor.hear", {hearing: t.dataset.hear});
  if (t.dataset.page !== undefined) return command("page.arm", {page: +t.dataset.page});
  if (t.id === "kplay") return command("transport", {action: S.state.playing ? "pause" : "play"});
  if (t.id === "kmkpin") { const r = await command("monitor.pin"); if (r.ok) toast("Pinned the mix as it is now."); return; }
  if (t.id === "kundo" || t.id === "hundo") return command("history.undo");
  if (t.id === "kredo") return command("history.redo");
  if (t.id === "khist") { S.sheet = "hist"; return renderHist(); }
  if (t.id === "topts") { S.sheet = S.sheet === "options" ? false : "options"; return renderHist(); }
  if (t.dataset.optsel) { S.optSel = t.dataset.optsel; return renderHist(); }
  if (t.dataset.opt) { await command("options.show", {option: t.dataset.opt, version: t.dataset.ver}); return; }
  if (t.id === "onow") {
    const sh = S.options.shown;
    if (!sh || !sh.version.writes) return toast("Pick a Version that has values for the mix.");
    const r = await command("options.pick", {option: sh.option, version: sh.version.id});
    if (r.ok) toast("Made " + sh.version.label + " Now.");
    return;
  }
  if (t.id === "hclose") { S.sheet = false; return renderHist(); }
  if (t.id === "hver") { const r = await command("history.checkpoint", {name: "v" + new Date().toTimeString().slice(0, 8).replace(/:/g, "")}); if (r.ok) toast("Made a version."); }
});
$("#scrim").addEventListener("click", () => { S.sheet = false; renderHist(); });

// ---- events ---------------------------------------------------------------------------------------------------------
function apply(m) {
  let part = "all";
  if (m.t === "full") S.state = m.state;
  else if (m.t === "hear") { S.hear = m; if (m.why === "touched") toast("Back on Now."); }
  else if (m.t === "hist") S.hist = m;
  else if (m.t === "options") { S.options = m; if (!S.optSel && m.options.length) S.optSel = m.options[0].id; }
  else if (m.t === "option") {
    const os = S.options.options, at = os.findIndex(o => o.id === m.option.id);
    if (at >= 0) os[at] = m.option; else os.unshift(m.option);
    if (!S.optSel) S.optSel = m.option.id;
    if (S.options.shown && S.options.shown.option === m.option.id) {
      const v = m.option.versions.find(x => x.id === S.options.shown.version.id);
      if (v) S.options.shown.version = v;
    }
  }
  else if (m.t === "meter") { S.meter = m; return renderTop(); }
  else if (m.t === "v" && S.state) {
    S.state.values[`${m.page}:${m.slot}`] = {...(S.state.values[`${m.page}:${m.slot}`] || {}), n: m.n, s: m.s, r: m.r, key: m.key};
    part = "desk";
  }
  else if (m.t === "pos" && S.state) {
    const flipped = S.state.playing !== m.p;
    S.state.pos = m.b; S.state.playing = m.p;
    part = flipped ? "all" : "top";
  }
  else if (m.t === "page" && S.state) S.state.page = m.page;
  else if (m.t === "mon" && S.state) S.state.monitor = {slot: m.slot, ref: m.ref};
  else if (m.t === "desk") { loadDesk(); return; }
  S.lockReason = S.state && S.state.live !== "attached" && S.state.live !== "starting" ? `Live: ${S.state.live}` : "";
  if (part === "top") renderTop();
  else if (drag) renderTop();
  else if (part === "desk") renderDesk();
  else render();
}
async function loadDesk() { S.desk = await (await fetch("/api/desk")).json(); render(); }
function connect() {
  const es = new EventSource("/events?app=1");
  es.onmessage = ev => apply(JSON.parse(ev.data));
  es.onerror = () => { S.lockReason = "Lost the connection. Trying again."; renderHear(); };
}
loadDesk().then(connect);
window.zpkt = {S, command};
</script></body></html>
