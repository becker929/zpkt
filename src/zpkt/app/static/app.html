<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>zpkt</title>
<link rel="stylesheet" href="/app/shell/shell.css">

<style>
/* The tokens (--bg, --panel, --ink, --acc ...), the tab bar and the loading line are in /app/shell/shell.css. */
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0;background:var(--bg);color:var(--ink);font:15px/1.4 'Helvetica Neue',Helvetica,Arial,sans-serif;overflow:hidden;user-select:none;-webkit-user-select:none}
button{font:inherit;color:inherit}
svg{display:block}
.mono{font-family:ui-monospace,Menlo,monospace}
#app{height:100%;display:flex;flex-direction:column;max-width:100%;position:relative}
#cols{flex:1;min-height:0;display:flex;flex-direction:column}
#hear{display:contents}
#htop{order:0}#main{order:1}#hbot{order:2}
#side{display:none}
.hear{background:var(--panel);flex:none}
#htop{border-bottom:1px solid var(--line);padding:8px 16px;display:flex;flex-direction:column;gap:6px}
#hkeys{display:contents}
#listen{display:inline-flex;align-items:center}#listen:empty{display:none}
#hbot{border-top:1px solid var(--line);padding:6px 10px;display:flex;align-items:center;justify-content:center;flex-wrap:wrap;gap:6px 10px}
#hbot .key{min-width:44px;padding:0 8px}
#hbot .seg .key{padding:0 10px}
.grp{display:flex;gap:6px;align-items:center}
.hr{display:flex;align-items:center;gap:8px;min-width:0;flex-wrap:wrap}
.sp{flex:1}
.nm{font:600 14px ui-monospace,Menlo,monospace;white-space:nowrap}
.pill{font:11.5px ui-monospace,Menlo,monospace;border:1px solid var(--cl);border-radius:20px;padding:2px 9px;white-space:nowrap;background:var(--panel)}
.pill.acc{background:var(--acc);color:var(--acc-ink);border-color:var(--accd)}
.pill.pin{background:var(--pin);color:#fff;border-color:var(--pind)}
.pill.warn{border-color:var(--bad);color:var(--bad)}
.tl{height:16px;border-radius:4px;background:var(--well);position:relative;overflow:hidden}
.tl .ph{position:absolute;top:0;bottom:0;width:2px;background:var(--ink)}
.spc{display:flex;align-items:flex-end;gap:2px;height:40px}
.spc:empty{background:var(--well);border-radius:4px}
.spc i{flex:1;background:var(--ink);opacity:.85;min-height:2px}
.key{min-width:44px;height:48px;border-radius:12px;border:1px solid var(--cl);background:linear-gradient(var(--c1),var(--c2));box-shadow:0 2px 0 var(--edge);display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:0 12px;font-size:14px;cursor:pointer;white-space:nowrap}
.key:active{transform:translateY(1.5px);box-shadow:0 .5px 0 var(--edge)}
.key.on{background:var(--acc);border-color:var(--accd);color:#111}
.key.sm{height:44px;min-width:44px;font-size:13px;padding:0 10px}
.key.off{opacity:.4}
.seg{display:flex}.seg .key{border-radius:0}.seg .key:first-child{border-radius:12px 0 0 12px}.seg .key:last-child{border-radius:0 12px 12px 0}
#lock{display:none;background:var(--bad);color:#fff;padding:6px 16px;font-size:13px}
#lock.on{display:block}
#main{flex:1;min-height:0;position:relative;display:flex;flex-direction:column;overflow:hidden}
#desk,#song{flex:1;min-height:0;padding:10px 16px;display:flex;flex-direction:column;gap:8px;overflow:auto}
#desk[hidden],#song[hidden]{display:none}
#song>*{flex:none}
.ph2{display:flex;align-items:center;gap:8px;min-height:26px;flex-wrap:wrap}
.ph2 b{font-size:17px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tag{font:10.5px ui-monospace,Menlo,monospace;text-transform:uppercase;letter-spacing:.08em;color:var(--mute);white-space:nowrap}
.dots{display:flex;gap:0;justify-content:center;align-items:center;flex-wrap:wrap}
.dots button{width:44px;height:44px;border:0;background:none;padding:0;position:relative}
.dots button::after{content:"";position:absolute;left:15px;top:15px;width:14px;height:14px;border-radius:50%;background:var(--k3)}
.dots button.c::after{background:var(--ink);left:9px;width:26px;border-radius:7px}
#scrim{position:absolute;inset:0;background:rgba(0,0,0,.35);opacity:0;pointer-events:none;transition:opacity .2s;z-index:30}
#scrim.on{opacity:1;pointer-events:auto}
.sheet{position:absolute;left:0;right:0;bottom:0;z-index:31;background:var(--panel);border-top:1px solid var(--line);border-radius:20px 20px 0 0;padding:10px 16px 18px;transform:translateY(105%);visibility:hidden;transition:transform .28s,visibility 0s .28s;max-height:78%;display:flex;flex-direction:column;gap:8px}
.sheet.on{transform:none;visibility:visible;transition-delay:0s}
.sheet h3{margin:0;font-size:17px}
.hl{display:flex;flex-direction:column;overflow:auto}
.he{display:flex;gap:6px 8px;font-size:13px;padding:7px 0;border-bottom:1px solid var(--cl);align-items:center;flex-wrap:wrap}
.he .ht{flex:1;min-width:150px;display:flex;flex-direction:column;gap:2px;overflow-wrap:anywhere}
.he .hv{font:12px ui-monospace,Menlo,monospace;color:var(--mute);white-space:nowrap}
.he .hv b{color:var(--ink);font-weight:600}
.he .tagu{font:10.5px ui-monospace,Menlo,monospace;border:1px dashed var(--mute);padding:1px 5px;flex:none}
.he.undone>*:not(.tagu){opacity:.45}
.he.undone .ht b{text-decoration:line-through}
/* a checkpoint is a place in the list you can go back to: a card with its own button */
.he.cp{border:1px solid var(--cl);border-radius:12px;padding:6px 8px 6px 10px;margin:5px 0;background:linear-gradient(var(--c1),var(--c2))}
.he.cp .ht{font-weight:600;font-size:14px}
.he.cp svg{flex:none}
.he.saving{border-style:dashed}
.cpf{display:flex;gap:8px;flex-wrap:wrap;margin:0}
.cpf input{flex:1;min-width:150px;height:44px;font:16px 'Helvetica Neue',Helvetica,Arial,sans-serif;border:1px solid var(--line);border-radius:10px;padding:0 10px;background:var(--panel);color:var(--ink);user-select:text;-webkit-user-select:text}
.spin::before{content:"";display:inline-block;box-sizing:border-box;width:10px;height:10px;border-radius:50%;border:2px solid currentColor;border-top-color:transparent;margin-right:6px;vertical-align:-1px;animation:mc-send .7s linear infinite}
/* the identity line, the spectrum when no meter sends, the level meter */
#ident{flex-wrap:nowrap;align-items:baseline}
#setname{font-size:15px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.idf{font:12px ui-monospace,Menlo,monospace;color:var(--mute);white-space:nowrap;flex:none}
.pill.quiet{color:var(--mute);border-style:dashed}
.spc.none{position:relative;align-items:center;justify-content:center;background:var(--well);border-radius:4px;color:var(--mute);font:11.5px ui-monospace,Menlo,monospace;text-align:center;padding:0 8px 8px}
.spc.none::before{content:"";position:absolute;left:8px;right:8px;bottom:5px;border-top:2px dashed var(--k3)}
.lvl{display:flex;align-items:center;gap:8px;height:20px}
.lvl .lt{font:11px ui-monospace,Menlo,monospace;color:var(--mute);flex:none}
.lvl .lb{flex:1;height:10px;border-radius:5px;background:var(--well);position:relative;overflow:hidden}
.lvl .lb i{position:absolute;left:0;top:0;bottom:0;background:var(--ink);border-radius:5px}
.lvl .lb b{position:absolute;top:0;bottom:0;width:2px;margin-left:-1px;background:var(--pin)}
.lvl .ln{font:11.5px ui-monospace,Menlo,monospace;flex:none;min-width:76px;text-align:right;white-space:nowrap}
.lvl:not([data-state="on"]) .lb{background:repeating-linear-gradient(135deg,var(--well) 0 4px,transparent 4px 8px)}
.lvl:not([data-state="on"]) .ln{color:var(--mute)}
/* the Song's buttons by what they touch; the confirm that shows what a build replaces */
.bgrp{display:flex;flex-direction:column;gap:4px}
.swap{display:flex;align-items:stretch;gap:8px;flex-wrap:wrap}
.swap>div{flex:1;min-width:130px;border:1px solid var(--cl);border-radius:12px;padding:8px 10px;background:var(--c2);display:flex;flex-direction:column;gap:2px;font-size:13px;overflow-wrap:anywhere}
.swap>div b{font-size:15px}
.swap .gone{border-color:var(--bad)}.swap .gone b{text-decoration:line-through;text-decoration-color:var(--bad)}
.swap>.arr{flex:none;min-width:0;border:0;background:none;padding:0;justify-content:center}
.key.danger{background:var(--bad);border-color:var(--bad);color:var(--bg);box-shadow:0 2px 0 var(--edge)}
.he .w2{font:11px ui-monospace,Menlo,monospace;color:var(--mute);width:56px;flex:none}
.he .who{font:10.5px ui-monospace,Menlo,monospace;border:1px solid var(--line);padding:1px 5px;flex:none}
.he .who.agent{background:var(--acc);color:#111}
.he .who.minilab{background:var(--pin);color:#fff;border-color:var(--pind)}
.lane{display:flex;align-items:center;gap:8px;min-width:0}
.lane .ln{font:11px ui-monospace,Menlo,monospace;color:var(--mute);width:64px;flex:none;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lane .tr{flex:1;min-width:0;height:22px;border-radius:6px;background:var(--well);position:relative;overflow:hidden}
.lane .tr i{position:absolute;top:2px;bottom:2px;background:var(--ink);opacity:.85;border-radius:3px}
.lane .tr b{position:absolute;top:0;bottom:0;width:2px;background:var(--pin)}
.sketch{font-size:12px;color:var(--mute);padding:6px 0}
.sketch b{color:var(--ink)}
.sheet.tall{height:94%;max-height:94%}
.sheet.tall iframe{flex:1;min-height:0;width:100%;border:1px solid var(--cl);border-radius:12px;background:#0e0f11}
.btns{display:flex;gap:8px;flex-wrap:wrap}
select{font:inherit;color:inherit;background:var(--panel);border:1px solid var(--line);border-radius:8px;height:44px;max-width:100%}
#toast{position:absolute;left:50%;top:150px;transform:translate(-50%,-10px);background:var(--ink);color:var(--bg);padding:8px 14px;border-radius:12px;font-size:13px;z-index:50;opacity:0;transition:all .2s;pointer-events:none;max-width:92%}
#toast.on{opacity:1;transform:translate(-50%,0)}
#bubble{position:fixed;z-index:60;pointer-events:none;background:var(--ink);color:var(--bg);font:600 20px ui-monospace,Menlo,monospace;padding:6px 12px;border-radius:12px;opacity:0;white-space:nowrap}
#bubble small{font:500 11px ui-monospace,Menlo,monospace;opacity:.7;margin-left:8px}
#bubble.on{opacity:1}
/* A Page's controls are one panel, a map of the MiniLab 3: /app/shell/controls.css and controls.js. */
#mlpages .key{min-width:44px}
#desk>*{flex:none}
.pl{display:flex;flex-direction:column;gap:6px}
.pl .key{justify-content:flex-start;width:100%;overflow:hidden;text-overflow:ellipsis}
#side>.key{flex:none}
/* A page change that Live has not confirmed yet: the tapped button waits (.is-waiting, shell.css), the line runs, the old controls dim. */
.dots button.is-waiting{outline:0}
.dots button.is-waiting::after{background:var(--acc);box-shadow:0 0 0 1.5px var(--accd)}
#slow{flex:none;display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:8px 16px;background:var(--panel);border-bottom:1px solid var(--line);font-size:14px}
#slow[hidden]{display:none}
#slow span{flex:1;min-width:140px}
/* One breakpoint system: phone is one column; tablet (700) puts the Hear bar beside the Desk; desktop (1100) adds the list of Pages. The tab bar is at the bottom on a phone and at the top from 700 px up (nav.js). */
@media (max-width:380px){#hbot{gap:6px}#hbot .seg .key{padding:0 8px}}
@media (min-width:700px){
 #cols{display:grid;grid-template-columns:minmax(0,1fr) 320px;grid-template-rows:minmax(0,1fr)}
 #hear{display:flex;flex-direction:column;min-height:0;overflow:auto;border-left:1px solid var(--line);background:var(--panel)}
 #htop,#main,#hbot{order:0}
 #htop{flex:1 0 auto;border-bottom:0}
 #htop .spc{height:auto;min-height:140px;flex:1}
 #htop .spc.none{flex:none;min-height:44px;height:44px}
}
@media (min-width:1100px){
 #cols{grid-template-columns:220px minmax(0,1fr) 320px}
 #side{display:flex;flex-direction:column;gap:8px;min-height:0;overflow:auto;padding:10px 12px;border-right:1px solid var(--line);background:var(--panel)}
 .dots{display:none}
 #htop .spc{min-height:220px}
 #htop .spc.none{min-height:44px}
}
@media (min-width:1400px){#cols{grid-template-columns:280px minmax(0,1fr) 420px}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

<div id="app">
 <div id="lock" role="alert"></div>
 <div id="cols">
  <aside id="side" aria-label="Pages"></aside>
  <div id="main" class="loads"><div id="slow" role="alert" hidden></div><div id="song" hidden></div><div id="desk"></div><div id="scrim"></div><div class="sheet" id="sheet"></div><div class="sheet tall" id="psheet"></div></div>
  <div id="hear"><div class="hear" id="htop"></div><div class="hear" id="hbot"><div id="hkeys"></div><span id="listen"></span></div></div>
 </div>
 <nav id="tabs" data-current="desk"></nav><script src="/app/shell/nav.js"></script>

</div>

<script>
"use strict";
const $ = s => document.querySelector(s);
const I = n => `<svg width="22" height="22"><use href="#i-${n}"/></svg>`;
const S = {state: null, desk: null, hear: {hearing: "now", changed: 0, keys: [], match: true, monitor: {slot: "W", ref: "C1"}, pin: "start"},
           hist: {entries: [], can_undo: false, can_redo: false}, meter: null, sheet: false, flash: {},
           layouts: {},
           tab: "desk", song: {list: [], id: null, view: null, loaded: false, mixSet: ""}, page: null,
           pend: null, busy: 0, want: null,
           scales: {}, slots: [], fixed: {}, dirty: false, sideAt: null, saving: null, meterAt: 0, cmpAt: null,
           level: {state: "off", mode: "", db: -90, hold: -90, holdAt: 0}};
const NO_MINILAB = "no MiniLab 3 in Live";  // Live is there and the desk works; only the controller is missing
const METER_STALE = 3000;  // ms without a meter message before the spectrum says there is none
let toastTimer = 0;
let drag = null, swipe = null, typing = null, swipedAt = 0;  // a hand on a control; a swipe; the control whose value is being typed

function toast(msg) { const t = $("#toast"); t.textContent = msg; t.classList.add("on"); clearTimeout(toastTimer); toastTimer = setTimeout(() => t.classList.remove("on"), 2200); }
// A command to the app. It always answers {ok, body}: a refusal or a lost connection is said in a toast (unless
// `quiet`) and never thrown.
async function command(kind, args = {}, group, quiet) {
  let r, body;
  try {
    r = await fetch("/api/command", {method: "POST", headers: {"Content-Type": "application/json"}, body: JSON.stringify({kind, args, group})});
    body = await r.json();
  } catch (err) {
    if (!quiet) toast("The app did not answer.");
    return {ok: false, body: {error: "The app did not answer."}};
  }
  if (!r.ok && !quiet) toast(body.error || "That did not work.");
  return {ok: r.ok, body};
}

// ---- the Hear bar -------------------------------------------------------------------------------------------------
function renderHear() { renderTop(); renderBottom(); }
function songOf() { return (S.state && S.state.song) || {}; }
function changedNow() {
  // what the app counts, plus the controls this page has moved and Live has not confirmed yet
  return S.hear.changed + Object.keys(OWN).filter(k => !S.hear.keys.includes(k) && Math.abs(OWN[k].n - OWN[k].n0) > 1e-4).length;
}
function renderTop() {
  const st = S.state;
  if (!st) return;
  const sg = songOf(), per = sg.beats_per_bar || 4, bar = Math.floor(st.pos / per) + 1, total = (sg.bars || 64) * per;
  const fresh = S.meter && Date.now() - S.meterAt < METER_STALE;
  const bands = fresh ? S.meter.db.map(d => Math.max(2, Math.min(100, (d + 90) / 90 * 100))) : [];
  const facts = [sg.tempo ? `${+(+sg.tempo).toFixed(2)} BPM` : "", sg.sig ? `${sg.sig[0]}/${sg.sig[1]}` : ""].filter(Boolean).join(" · ");
  const live = st.live === "attached" || st.live === NO_MINILAB, n = changedNow();
  $("#htop").innerHTML = `<div class="hr" id="ident"><b id="setname" title="The set open in Live">${esc(sg.name || "")}</b><span class="idf" id="songfacts">${facts}</span></div>
    <div class="hr"><span class="nm" id="barno">bar ${bar}${sg.bars ? " of " + sg.bars : ""}</span>
    ${st.loop && st.loop !== "off" ? `<span class="pill" id="looppill" title="Live loops this part: the bar jumps back at its end">loop${st.loop === "on" ? "" : ": " + esc(st.loop)}</span>` : ""}
    <span class="pill ${live ? "" : "warn"}" id="livepill">${live ? "Live" : esc(st.live)}</span>
    <span class="pill ${n ? "acc" : ""}" id="chgpill">${n} changed</span></div>
    <div class="tl"><div class="ph" style="left:${Math.min(100, (st.pos % total) / total * 100)}%"></div></div>
    ${fresh ? `<div class="spc" id="spec" aria-label="Spectrum">${bands.map(b => `<i style="height:${b}%"></i>`).join("")}</div>`
            : `<div class="spc none" id="spec" role="img" aria-label="No spectrum: the desk meter device is not on Main">No spectrum · desk meter not on Main</div>`}
    ${levelHtml()}`;
}
// The level meter: the peak of the sound Listen plays (the Listen button's stream), in dB below full scale. It
// reads the samples; it changes none. With Listen off the bar is hatched: there is nothing to read.
const LV = {floor: -60, holdMs: 1500};
function levelView() {
  const lv = S.level, on = lv.state === "on" && lv.mode !== "mp3", at = x => Math.max(0, Math.min(100, (x - LV.floor) / -LV.floor * 100));
  const text = lv.state === "connecting" ? "connecting" : lv.state !== "on" ? "Listen off" : lv.mode === "mp3" ? "no level here" : lv.db <= LV.floor ? "silent" : lv.db.toFixed(1) + " dB";
  return {on, text, w: on ? at(lv.db) : 0, hold: on ? at(lv.hold) : 0, now: Math.round(Math.max(LV.floor, lv.db))};
}
function levelHtml() {
  const v = levelView();
  return `<div class="lvl" id="lvl" data-state="${v.on ? "on" : "off"}" role="meter" aria-label="Output level" aria-valuemin="${LV.floor}" aria-valuemax="0" aria-valuenow="${v.now}" aria-valuetext="${v.text}">
    <span class="lt">Level</span><span class="lb"><i style="width:${v.w.toFixed(1)}%"></i><b style="left:${v.hold.toFixed(1)}%;opacity:${v.on ? 1 : 0}"></b></span><span class="ln">${v.text}</span></div>`;
}
function onListen(d) {
  const lv = S.level, now = Date.now();
  lv.state = d.state; lv.mode = (window.zpktListen && window.zpktListen.stats.mode) || "";
  lv.db = d.state === "on" && d.peak > 0 ? 20 * Math.log10(d.peak) : -90;
  if (lv.db >= lv.hold || now - lv.holdAt > LV.holdMs) { lv.hold = lv.db; lv.holdAt = now; }
  const el = $("#lvl");
  if (!el) return;
  const v = levelView();
  el.dataset.state = v.on ? "on" : "off";
  el.setAttribute("aria-valuenow", v.now); el.setAttribute("aria-valuetext", v.text);
  el.querySelector("i").style.width = v.w.toFixed(1) + "%";
  const b = el.querySelector("b"); b.style.left = v.hold.toFixed(1) + "%"; b.style.opacity = v.on ? 1 : 0;
  el.querySelector(".ln").textContent = v.text;
}
window.addEventListener("zpkt-listen", e => onListen(e.detail));

// ---- touching controls ---------------------------------------------------------------------------------------------
// A knob or a fader is dragged up and down, and the drag is relative: the control moves from where it is by how far
// the hand moves, never jumps to the pointer. TRAVEL px take it across its whole range; Shift, or a slow hand, makes
// finer steps. The first 6 px decide what the touch is: up or down moves the control, sideways on a phone is a swipe
// to the Page's next MiniLab page. A greyed slot takes no touch. One touch is one group, so one undo step.
const TRAVEL = 200, FINE = 0.2, SLOW = {below: 40, upTo: 140, least: 0.35, gap: 100};  // px; factor; px per second, and ms
const narrow = () => !window.matchMedia("(min-width:700px)").matches;

function bubble(text, fine, x, y) {

}
// Put a control at place n: on the page at once (the knob, its number, the counter), then to Live.
function place(el, n, group) {
  const key = el.dataset.key;
  if (!OWN[key]) setOwn(key, n, +el.dataset.n0 || 0); else setOwn(key, n);
  MC.set(el, n, textAt(key, n));
  el.classList.add("chg");
  sendValue(key, n, group);
}
document.addEventListener("pointerdown", e => {
  if (!e.target.closest || !e.target.closest(".mlp") || e.target.closest(".vt")) return;
  const w = e.target.closest(".mc.live:not(.pad) .w"), el = w && w.closest(".mc");
  if (!el || !el.dataset.key) { swipe = {x: e.clientX, y: e.clientY}; return; }
  if (e.button > 0) return;
  w.focus({preventScroll: true});  // a click on a control gives it the keyboard
  const n0 = +el.dataset.n || 0;

  drag = {key: el.dataset.key, el, x: e.clientX, y: e.clientY, at: n0, n: n0, steps: +el.dataset.steps, lock: null,
          last: e.clientY, seen: [[e.timeStamp, e.clientY]], group: gestureId()};

  if (!drag) return;
  const dx = e.clientX - drag.x, dy = e.clientY - drag.y;

    drag.lock = narrow() && Math.abs(dx) > Math.abs(dy) * 1.5 ? "x" : "y";
    drag.last = e.clientY;  // the control starts from where it is: the 6 px that decided are not a jump
  }
  if (drag.lock === "x") return;
  // How fast the hand moves, over the last 120 ms: a slow hand is a fine one. A move that comes after a gap (the
  // hand rested, or the browser was busy) says nothing about speed, so it counts in full.
  const rested = e.timeStamp - drag.seen[drag.seen.length - 1][0] > SLOW.gap;
  if (rested) drag.seen = [];
  drag.seen.push([e.timeStamp, e.clientY]);

  const [t0, y0] = drag.seen[0], dt = Math.max(1, e.timeStamp - t0), speed = Math.abs(e.clientY - y0) / dt * 1000;

function swiped(dx, dy) {

const KEYS = {group: "", key: "", at: 0};
document.addEventListener("keydown", e => {

// Typing a value: a field where the number is. Only where the page knows the control's scale as numbers.
function typeValue(el) {

// ---- waiting for Live: the loading line, and a page change that is not confirmed yet ------------------------------
// Changing the page takes about a second: the command waits its turn for Live, the pager in Live swaps what the
// MiniLab's controls are mapped to, and only then does the "page" event come back. Until it does, show it.
const WAIT = {page: 5000};  // ms before a page change is called failed
function busySync() {
  const m = $("#main");
  m.classList.toggle("is-loading", S.busy > 0 || !!S.pend);
  m.classList.toggle("is-pending", !!S.pend);

async function slowly(work) { S.busy++; busySync(); try { return await work(); } finally { S.busy--; busySync(); } }
function markPending() {

    const on = p !== null && b.dataset.page === p;

function slowSay(text, retryPage) {

}
function donePending() {

  markPending();

  const mine = S.pend = {page, timer: setTimeout(() => { if (S.pend === mine) pageFailed(page, ""); }, WAIT.page)};
  busySync(); renderDesk(); renderSide(); markPending();  // at once: the new page's name, "Loading", the old controls dimmed
  command("page.arm", {page}).then(r => { if (!r.ok && S.pend === mine) pageFailed(page, r.body.error || ""); },
                                   () => { if (S.pend === mine) pageFailed(page, "The app did not answer."); });

}

function pageConfirmed() {

  if (S.failed != null && S.state && S.state.page === S.failed) slowSay("", null);  // it came late

});
document.addEventListener("submit", e => { if (e.target.id === "cpform") { e.preventDefault(); saveCheckpoint($("#cpname").value); } });
$("#scrim").addEventListener("click", () => { S.sheet = false; renderHist(); closeSheet(); });

// ---- events ---------------------------------------------------------------------------------------------------------
function apply(m) {
  let part = "all";
  if (m.t === "full") S.state = m.state;
  else if (m.t === "hear") S.hear = m;
  else if (m.t === "hist") S.hist = m;
  else if (m.t === "meter") { S.meter = m; S.meterAt = Date.now(); return renderTop(); }
  else if (m.t === "v" && S.state) {
    S.state.values[`${m.page}:${m.slot}`] = {...(S.state.values[`${m.page}:${m.slot}`] || {}), n: m.n, s: m.s, r: m.r, key: m.key};
    if (m.key && OWN[m.key]) return reported(m.key, m.n);  // a control this page is moving: its own number stays until Live has the last word
    part = "desk";
  }
  else if (m.t === "pos" && S.state) {
    const flipped = S.state.playing !== m.p;
    S.state.pos = m.b; S.state.playing = m.p;
    if (m.bpm && S.state.song) S.state.song.tempo = m.bpm;
    part = flipped ? "all" : "top";
  }
  else if (m.t === "loop" && S.state) { S.state.loop = m.loop; part = "top"; }
  else if (m.t === "page" && S.state) S.state.page = m.page;
  else if (m.t === "mon" && S.state) S.state.monitor = {slot: m.slot, ref: m.ref};
  else if (m.t === "desk") { S.layouts = {}; S.scales = {}; loadDesk(); return; }
  pageConfirmed(); wanted();
  S.lockReason = S.state && !["attached", "starting", NO_MINILAB].includes(S.state.live) ? `Live: ${S.state.live}` : "";
  if (part === "top") renderTop();
  else if (part === "desk") renderDesk();
  else render();
}
// A meter that stops sending (the device was taken off Main) is said so, not left showing its last bars.
setInterval(() => { if (S.meter && Date.now() - S.meterAt >= METER_STALE && $("#spec") && !$("#spec").classList.contains("none")) renderTop(); }, 1000);
if (window.zpktListen) onListen({state: window.zpktListen.state, peak: window.zpktListen.stats.peak});
async function loadDesk() { S.desk = await (await fetch("/api/desk")).json(); wanted(); render(); }
function connect() {
  const es = new EventSource("/events?app=1");
  es.onmessage = ev => apply(JSON.parse(ev.data));
  es.onerror = () => { S.lockReason = "Lost the connection. Trying again."; renderHear(); };
}
loadDesk().then(connect);
// Crossing the desktop breakpoint draws or drops the side column.
window.matchMedia("(min-width:1100px)").addEventListener("change", render);
route();
window.zpkt = {S, command, armPage, wait: WAIT, own: OWN, textAt, placeOf, cpLabel, litState};
</script>
