<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>zpkt</title>
<link rel="stylesheet" href="/app/shell/shell.css">
<link rel="stylesheet" href="/app/shell/controls.css">
<style>
/* The tokens (--bg, --panel, --ink, --acc ...), the tab bar and the loading line are in /app/shell/shell.css. */
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0;background:var(--bg);color:var(--ink);font:15px/1.4 'Helvetica Neue',Helvetica,Arial,sans-serif;overflow:hidden;user-select:none;-webkit-user-select:none}
button{font:inherit;color:inherit}
svg{display:block}
.mono{font-family:ui-monospace,Menlo,monospace}
#app{height:100%;display:flex;flex-direction:column;max-width:100%;position:relative}
#cols{flex:1;min-height:0;display:flex;flex-direction:column}
#hear{display:contents}
#htop{order:0}#main{order:1}#hbot{order:2}
#side{display:none}
.hear{background:var(--panel);flex:none}
#htop{border-bottom:1px solid var(--line);padding:8px 16px;display:flex;flex-direction:column;gap:6px}
#hkeys{display:contents}
#listen{display:inline-flex;align-items:center}#listen:empty{display:none}
#hbot{border-top:1px solid var(--line);padding:6px 10px;display:flex;align-items:center;justify-content:center;flex-wrap:wrap;gap:6px 10px}
#hbot .key{min-width:44px;padding:0 8px}
#hbot .seg .key{padding:0 10px}
.grp{display:flex;gap:6px;align-items:center}
.hr{display:flex;align-items:center;gap:8px;min-width:0;flex-wrap:wrap}
.sp{flex:1}
.nm{font:600 14px ui-monospace,Menlo,monospace;white-space:nowrap}
.pill{font:11.5px ui-monospace,Menlo,monospace;border:1px solid var(--cl);border-radius:20px;padding:2px 9px;white-space:nowrap;background:var(--panel)}
.pill.acc{background:var(--acc);color:var(--acc-ink);border-color:var(--accd)}
.pill.pin{background:var(--pin);color:#fff;border-color:var(--pind)}
.pill.warn{border-color:var(--bad);color:var(--bad)}
.tl{height:16px;border-radius:4px;background:var(--well);position:relative;overflow:hidden}
.tl .ph{position:absolute;top:0;bottom:0;width:2px;background:var(--ink)}
.spc{display:flex;align-items:flex-end;gap:2px;height:40px}
.spc:empty{background:var(--well);border-radius:4px}
.spc i{flex:1;background:var(--ink);opacity:.85;min-height:2px}
.key{min-width:44px;height:48px;border-radius:12px;border:1px solid var(--cl);background:linear-gradient(var(--c1),var(--c2));box-shadow:0 2px 0 var(--edge);display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:0 12px;font-size:14px;cursor:pointer;white-space:nowrap}
.key:active{transform:translateY(1.5px);box-shadow:0 .5px 0 var(--edge)}
.key.on{background:var(--acc);border-color:var(--accd);color:#111}
.key.pin{background:var(--pin);border-color:var(--pind);color:#fff}
.key.sm{height:44px;min-width:44px;font-size:13px;padding:0 10px}
.key.off{opacity:.4}
.seg{display:flex}.seg .key{border-radius:0}.seg .key:first-child{border-radius:12px 0 0 12px}.seg .key:last-child{border-radius:0 12px 12px 0}
#banner{display:none;background:var(--pin);color:#fff;padding:6px 16px;font-size:13px}
#banner.on{display:block}
#lock{display:none;background:var(--bad);color:#fff;padding:6px 16px;font-size:13px}
#lock.on{display:block}
#main{flex:1;min-height:0;position:relative;display:flex;flex-direction:column;overflow:hidden}
#desk,#song{flex:1;min-height:0;padding:10px 16px;display:flex;flex-direction:column;gap:8px;overflow:auto}
#desk[hidden],#song[hidden]{display:none}
#song>*{flex:none}
.ph2{display:flex;align-items:center;gap:8px;min-height:26px;flex-wrap:wrap}
.ph2 b{font-size:17px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tag{font:10.5px ui-monospace,Menlo,monospace;text-transform:uppercase;letter-spacing:.08em;color:var(--mute);white-space:nowrap}
.dots{display:flex;gap:0;justify-content:center;align-items:center;flex-wrap:wrap}
.dots button{width:44px;height:44px;border:0;background:none;padding:0;position:relative}
.dots button::after{content:"";position:absolute;left:15px;top:15px;width:14px;height:14px;border-radius:50%;background:var(--k3)}
.dots button.c::after{background:var(--ink);left:9px;width:26px;border-radius:7px}
#scrim{position:absolute;inset:0;background:rgba(0,0,0,.35);opacity:0;pointer-events:none;transition:opacity .2s;z-index:30}
#scrim.on{opacity:1;pointer-events:auto}
.sheet{position:absolute;left:0;right:0;bottom:0;z-index:31;background:var(--panel);border-top:1px solid var(--line);border-radius:20px 20px 0 0;padding:10px 16px 18px;transform:translateY(105%);visibility:hidden;transition:transform .28s,visibility 0s .28s;max-height:78%;display:flex;flex-direction:column;gap:8px}
.sheet.on{transform:none;visibility:visible;transition-delay:0s}
.sheet h3{margin:0;font-size:17px}
.hl{display:flex;flex-direction:column;overflow:auto}
.he{display:flex;gap:8px;font-size:13px;padding:7px 0;border-bottom:1px solid var(--cl);align-items:center}
.he .w2{font:11px ui-monospace,Menlo,monospace;color:var(--mute);width:56px;flex:none}
.he .who{font:10.5px ui-monospace,Menlo,monospace;border:1px solid var(--line);padding:1px 5px;flex:none}
.he .who.agent{background:var(--acc);color:#111}
.he .who.minilab{background:var(--pin);color:#fff;border-color:var(--pind)}
.spc.ver{height:24px;margin-top:-2px}
.spc.ver i{background:var(--pin);opacity:.9}
.vline{font:12px ui-monospace,Menlo,monospace;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.ol{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px;flex:none}
.ol .key{height:44px;font-size:13px;flex:none;max-width:70vw;overflow:hidden;text-overflow:ellipsis}
.why{font-size:13px;line-height:1.4;color:var(--mute);overflow-wrap:anywhere;max-height:7.2em;overflow-y:auto;flex:none}
.vg{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;overflow:auto;min-height:0}
.vc{border:1px solid var(--cl);border-radius:12px;padding:8px 10px;background:linear-gradient(var(--c1),var(--c2));text-align:left;display:flex;flex-direction:column;gap:2px;cursor:pointer;min-height:64px}
.vc.on{border-color:var(--pind);box-shadow:inset 0 0 0 2px var(--pin)}
.vc.now{background:var(--acc);color:#111}
.vc.off{opacity:.45;cursor:default}
.vc b{font-size:13px;line-height:1.2}
.vc span{font:11.5px ui-monospace,Menlo,monospace;color:var(--mute)}
.vc.now span{color:#111}
.gp{color:var(--pind)}.gn{color:var(--bad)}
.lane{display:flex;align-items:center;gap:8px;min-width:0}
.lane .ln{font:11px ui-monospace,Menlo,monospace;color:var(--mute);width:64px;flex:none;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lane .tr{flex:1;min-width:0;height:22px;border-radius:6px;background:var(--well);position:relative;overflow:hidden}
.lane .tr i{position:absolute;top:2px;bottom:2px;background:var(--ink);opacity:.85;border-radius:3px}
.lane .tr b{position:absolute;top:0;bottom:0;width:2px;background:var(--pin)}
.sketch{font-size:12px;color:var(--mute);padding:6px 0}
.sketch b{color:var(--ink)}
.sheet.tall{height:94%;max-height:94%}
.sheet.tall iframe{flex:1;min-height:0;width:100%;border:1px solid var(--cl);border-radius:12px;background:#0e0f11}
.btns{display:flex;gap:8px;flex-wrap:wrap}
select{font:inherit;color:inherit;background:var(--panel);border:1px solid var(--line);border-radius:8px;height:44px;max-width:100%}
#toast{position:absolute;left:50%;top:150px;transform:translate(-50%,-10px);background:var(--ink);color:var(--bg);padding:8px 14px;border-radius:12px;font-size:13px;z-index:50;opacity:0;transition:all .2s;pointer-events:none;max-width:92%}
#toast.on{opacity:1;transform:translate(-50%,0)}
#bubble{position:fixed;z-index:60;pointer-events:none;background:var(--ink);color:var(--bg);font:600 20px ui-monospace,Menlo,monospace;padding:6px 12px;border-radius:12px;opacity:0;white-space:nowrap}
#bubble.on{opacity:1}
/* A Page's controls are one panel, a map of the MiniLab 3: /app/shell/controls.css and controls.js. */
#mlpages .key{min-width:44px}
#desk>*{flex:none}
.pl{display:flex;flex-direction:column;gap:6px}
.pl .key{justify-content:flex-start;width:100%;overflow:hidden;text-overflow:ellipsis}
#side .vg{grid-template-columns:1fr}
#side>.key{flex:none}
/* A page change that Live has not confirmed yet: the tapped button waits (.is-waiting, shell.css), the line runs, the old controls dim. */
.dots button.is-waiting{outline:0}
.dots button.is-waiting::after{background:var(--acc);box-shadow:0 0 0 1.5px var(--accd)}
#slow{flex:none;display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:8px 16px;background:var(--panel);border-bottom:1px solid var(--line);font-size:14px}
#slow[hidden]{display:none}
#slow span{flex:1;min-width:140px}
/* One breakpoint system: phone is one column; tablet (700) puts the Hear bar beside the Desk; desktop (1100) adds Pages and Versions. The tab bar is at the bottom on a phone and at the top from 700 px up (nav.js). */
@media (max-width:380px){#hbot{gap:6px}#hbot .seg .key{padding:0 8px}}
@media (min-width:700px){
 #cols{display:grid;grid-template-columns:minmax(0,1fr) 320px;grid-template-rows:minmax(0,1fr)}
 #hear{display:flex;flex-direction:column;min-height:0;overflow:auto;border-left:1px solid var(--line);background:var(--panel)}
 #htop,#main,#hbot{order:0}
 #htop{flex:1 0 auto;border-bottom:0}
 #htop .spc:not(.ver){height:auto;min-height:140px;flex:1}
}
@media (min-width:1100px){
 #cols{grid-template-columns:220px minmax(0,1fr) 320px}
 #side{display:flex;flex-direction:column;gap:8px;min-height:0;overflow:auto;padding:10px 12px;border-right:1px solid var(--line);background:var(--panel)}
 .dots{display:none}
 #htop .spc:not(.ver){min-height:220px}
}
@media (min-width:1400px){#cols{grid-template-columns:280px minmax(0,1fr) 420px}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style></head><body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
<symbol id="i-play" viewBox="0 0 24 24"><path d="M7 4l13 8-13 8z" fill="currentColor"/></symbol>
<symbol id="i-stop" viewBox="0 0 24 24"><rect x="6" y="6" width="12" height="12" rx="1.5" fill="currentColor"/></symbol>
<symbol id="i-undo" viewBox="0 0 24 24"><path d="M9 14L4 9l5-5M4 9h10.5a5.5 5.5 0 0 1 0 11H11" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></symbol>
<symbol id="i-redo" viewBox="0 0 24 24"><path d="M15 14l5-5-5-5M20 9H9.5a5.5 5.5 0 0 0 0 11H13" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></symbol>
<symbol id="i-hist" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8" fill="none" stroke="currentColor" stroke-width="2.2"/><path d="M12 7v5l3 2" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></symbol>
<symbol id="i-desk" viewBox="0 0 24 24"><circle cx="8" cy="8" r="3.5" fill="none" stroke="currentColor" stroke-width="2.2"/><circle cx="16" cy="16" r="3.5" fill="none" stroke="currentColor" stroke-width="2.2"/><path d="M13 7h7M4 17h5" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></symbol>
<symbol id="i-song" viewBox="0 0 24 24"><path d="M4 7h9M4 12h16M4 17h11" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/></symbol>
<symbol id="i-ask" viewBox="0 0 24 24"><path d="M4 5h16v11H10l-5 4v-4H4z" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linejoin="round"/></symbol>
<symbol id="i-pin" viewBox="0 0 24 24"><path d="M9 3h6l-1 6 3 3v2H7v-2l3-3zM12 14v7" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></symbol>
<symbol id="i-pick" viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></symbol>
<symbol id="i-opts" viewBox="0 0 24 24"><rect x="4" y="4" width="7" height="7" rx="1.5" fill="none" stroke="currentColor" stroke-width="2.2"/><rect x="13" y="4" width="7" height="7" rx="1.5" fill="none" stroke="currentColor" stroke-width="2.2"/><rect x="4" y="13" width="7" height="7" rx="1.5" fill="none" stroke="currentColor" stroke-width="2.2"/><rect x="13" y="13" width="7" height="7" rx="1.5" fill="currentColor" stroke="currentColor" stroke-width="2.2"/></symbol>
</svg>
<div id="app">
 <div id="lock" role="alert"></div>
 <div id="banner" role="status"></div>
 <div id="cols">
  <aside id="side" aria-label="Pages and Versions"></aside>
  <div id="main" class="loads"><div id="slow" role="alert" hidden></div><div id="song" hidden></div><div id="desk"></div><div id="scrim"></div><div class="sheet" id="sheet"></div><div class="sheet tall" id="psheet"></div></div>
  <div id="hear"><div class="hear" id="htop"></div><div class="hear" id="hbot"><div id="hkeys"></div><span id="listen"></span></div></div>
 </div>
 <nav id="tabs" data-current="desk"></nav><script src="/app/shell/nav.js"></script>
 <div id="toast" role="status"></div><div id="bubble"></div>
</div>
<script src="/app/shell/controls.js"></script>
<script>
"use strict";
const $ = s => document.querySelector(s);
const I = n => `<svg width="22" height="22"><use href="#i-${n}"/></svg>`;
const S = {state: null, desk: null, hear: {hearing: "now", changed: 0, keys: [], match: true, monitor: {slot: "W", ref: "C1"}, pin: "start"},
           hist: {entries: [], can_undo: false, can_redo: false}, meter: null, sheet: false, flash: {},
           options: {options: [], shown: null}, optSel: null, layouts: {},
           tab: "desk", song: {list: [], id: null, view: null, loaded: false, sure: false}, page: null,
           pend: null, busy: 0, want: null};
let toastTimer = 0;

function toast(msg) { const t = $("#toast"); t.textContent = msg; t.classList.add("on"); clearTimeout(toastTimer); toastTimer = setTimeout(() => t.classList.remove("on"), 2200); }
async function command(kind, args = {}, group) {
  const r = await fetch("/api/command", {method: "POST", headers: {"Content-Type": "application/json"}, body: JSON.stringify({kind, args, group})});
  const body = await r.json();
  if (!r.ok) toast(body.error || "That did not work.");
  return {ok: r.ok, body};
}

// ---- the Hear bar -------------------------------------------------------------------------------------------------
function renderHear() { renderTop(); renderBottom(); }
function renderTop() {
  const st = S.state, h = S.hear;
  if (!st) return;
  const bar = Math.floor(st.pos / 4) + 1, total = 64 * 4;
  const bands = S.meter ? S.meter.db.map(d => Math.max(2, Math.min(100, (d + 90) / 90 * 100))) : [];
  $("#htop").innerHTML = `<div class="hr"><span class="nm" id="barno">bar ${bar}</span>
    <span class="pill ${st.live === "attached" ? "" : "warn"}" id="livepill">${st.live === "attached" ? "Live" : st.live}</span></div>
    <div class="tl"><div class="ph" style="left:${Math.min(100, (st.pos % total) / total * 100)}%"></div></div>
    <div class="spc" aria-label="Spectrum">${bands.map(b => `<i style="height:${b}%"></i>`).join("")}</div>${versionStrip()}
    <div class="hr"><span class="pill ${h.changed ? "acc" : ""}" id="chgpill">${h.changed} changed</span>
    ${h.match ? '<span class="pill">matched</span>' : ""}
    ${h.hearing === "pin" ? '<span class="pill pin" id="hearpill">hearing Pin</span>' : h.hearing === "ref" ? '<span class="pill pin" id="hearpill">hearing Ref</span>' : ""}</div>`;
}
const dB = x => x == null ? "–" : (x > 0 ? "+" : "") + x.toFixed(1);
function loud(v) { return v.measure && v.measure.lufs != null ? v.measure.lufs : (v.known && v.known.lufs != null ? v.known.lufs : null); }
function versionStrip() {
  const sh = S.options.shown;
  if (!sh) return "";
  const v = sh.version, m = v.measure, g = v.gap;
  const bands = m ? m.bands_db.map(d => Math.max(2, Math.min(100, (d + 90) / 90 * 100))) : [];
  const lufs = loud(v);
  return `<div class="vline" id="vstrip"><span class="pill pin">${sh.title.replace(/</g, "&lt;")}</span><b>${v.label.replace(/</g, "&lt;")}</b>
    <span>${lufs == null ? "not measured" : lufs.toFixed(1) + " LUFS"}</span>${m ? `<span>peak ${m.peak_db.toFixed(1)}</span>` : ""}
    ${g ? `<span class="${g.peak_db >= 0 ? "gp" : "gn"}">gap ${dB(g.lufs != null ? g.lufs : g.rms_db)} ${g.lufs != null ? "LU" : "dB"}</span>` : ""}</div>
    ${m ? `<div class="spc ver" aria-label="Spectrum of this Version">${bands.map(b => `<i style="height:${b}%"></i>`).join("")}</div>` : ""}`;
}
function renderBottom() {
  const st = S.state, h = S.hear;
  if (!st) return;
  $("#hkeys").innerHTML = `<div class="grp" role="group" aria-label="Transport"><button class="key ${st.playing ? "on" : ""}" id="kplay" aria-label="Play or stop">${I(st.playing ? "stop" : "play")}</button>
    <div class="seg" role="group" aria-label="What you hear">
      <button class="key ${h.hearing === "now" ? "on" : ""}" data-hear="now">Now</button>
      <button class="key ${h.hearing === "pin" ? "pin" : ""}" data-hear="pin">Pin</button>
      <button class="key ${h.hearing === "ref" ? "pin" : ""}" data-hear="ref">Ref</button></div>
    <button class="key sm" id="kmkpin" aria-label="Pin the mix as it is now">${I("pin")}</button></div>
    <div class="grp" role="group" aria-label="History"><button class="key sm ${S.hist.can_undo ? "" : "off"}" id="kundo" aria-label="Undo">${I("undo")}</button>
    <button class="key sm ${S.hist.can_redo ? "" : "off"}" id="kredo" aria-label="Redo">${I("redo")}</button>
    <button class="key sm" id="khist" aria-label="History">${I("hist")}</button></div>`;
  renderBanner();
}
function renderBanner() {
  const h = S.hear, banner = $("#banner");
  banner.classList.toggle("on", h.hearing === "pin" || h.hearing === "ref");
  banner.textContent = h.hearing === "pin" ? "You hear the pinned checkpoint. Touch any control to go back to Now." : h.hearing === "ref" ? "You hear the reference." : "";
  const lock = $("#lock");
  lock.classList.toggle("on", !!S.lockReason);
  lock.textContent = S.lockReason || "";
}

// ---- the Desk ---------------------------------------------------------------------------------------------------
// One renderer for every page of controls: the panel, a map of the MiniLab 3 (window.zpktControls draws it). All 20
// slots are always drawn where they sit on the controller. A mapped one is a live control; the rest are greyed.
const MC = window.zpktControls;
function labelOf(c) { return c.label || (c.param === "volume" || c.param === "pan" ? `${c.track} ${c.param}` : c.device ? `${c.track} ${c.device}` : c.track || ""); }
function entries() {
  const out = [];
  (S.desk ? S.desk.pages : []).forEach((p, i) => {
    const same = p.page_id ? out.find(e => e.page_id === p.page_id) : null;
    if (same) same.hw.push(i); else out.push({name: p.name, page_id: p.page_id || null, hw: [i], pg: p});
  });
  return out;
}
function ensureLayout(id) {
  if (S.layouts[id]) return;
  S.layouts[id] = "loading";
  command("page.layout", {id}).then(r => { S.layouts[id] = r.ok ? r.body.layout : "failed"; renderDesk(); });
}
function valueMap() {
  const m = {};
  for (const v of Object.values((S.state || {}).values || {})) if (v.key) m[v.key] = v;
  return m;
}
const wide = () => window.matchMedia("(min-width:1100px)").matches;
const marks = key => ({chg: !!key && S.hear.keys.includes(key), flash: !!key && !!S.flash[key]});
// The desk's own page (contrib/mixdesk/desk.json, or a made surface with no Page): its slots as the pager reports them.
function slotsOfDesk(pg, hw) {
  const cs = pg.controls || {}, values = S.state.values || {};
  return MC.SLOTS.filter(s => cs[s]).map(slot => {
    const c = cs[slot], v = values[`${hw}:${slot}`] || {};
    const missing = !v.key && c.param !== undefined && !c.macro && v.s === undefined;
    return {slot, hw, state: missing ? "missing" : v.key || slot[0] === "b" ? "live" : "macro", label: labelOf(c), shown: v.s, n: v.n,
            key: v.key || "", by: "slot", ...marks(v.key)};
  });
}
// A saved Page: the panel page.layout hands over (zpkt.live.page_layout), joined with the controls' facts and values.
function slotsOfLayout(L, at, hw) {
  const panel = L.panels[at];
  if (!panel) return [];
  const by = {}, vals = valueMap(), values = S.state.values || {};
  for (const g of L.groups) for (const c of g.controls) by[c.ref] = c;
  const many = panel.groups.length > 1;
  return panel.slots.filter(s => s.ref && by[s.ref]).map(s => {
    const c = by[s.ref], v = (c.target && vals[c.target]) || values[`${hw}:${s.slot}`] || {};
    return {slot: s.slot, hw, state: c.missing ? "missing" : c.target ? "live" : "macro", label: c.label, shown: v.s, n: v.n,
            key: c.target || "", by: "key", group: many ? s.group : "", tint: s.tint, why: c.missing, range: c.range,
            steps: s.kind !== "pad" && c.items.length > 1 ? c.items.length : 0, ...marks(c.target)};
  });
}
function esc(t) { return String(t).replace(/[&<>"]/g, ch => ({"&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;"}[ch])); }
function renderDesk() { drawDesk(); markPending(); }

// ---- touching controls ---------------------------------------------------------------------------------------------
// A knob or a fader is dragged up and down. The first 6 px decide what the touch is: up or down moves the control,
// sideways on a phone is a swipe to the Page's next MiniLab page. A greyed slot takes no touch.
let drag = null, swipe = null, sendTimer = 0, swipedAt = 0;
const narrow = () => !window.matchMedia("(min-width:700px)").matches;
document.addEventListener("pointerdown", e => {
  if (!e.target.closest || !e.target.closest(".mlp")) return;
  const w = e.target.closest(".mc.live:not(.pad) .w"), el = w && w.closest(".mc");
  if (!el || !el.dataset.key) { swipe = {x: e.clientX, y: e.clientY}; return; }
  const n0 = +el.dataset.n || 0, steps = +el.dataset.steps;
  drag = {key: el.dataset.key, el, x: e.clientX, y: e.clientY, n0, n: n0, steps, lock: null,
          px: el.classList.contains("fader") ? Math.max(60, w.clientHeight - 24) : 160};
  if (w.setPointerCapture) w.setPointerCapture(e.pointerId);
  e.preventDefault();
});
document.addEventListener("pointermove", e => {
  if (!drag) return;
  const dx = e.clientX - drag.x, dy = e.clientY - drag.y;
  if (!drag.lock) {
    if (Math.max(Math.abs(dx), Math.abs(dy)) < 6) return;
    drag.lock = narrow() && Math.abs(dx) > Math.abs(dy) * 1.5 ? "x" : "y";
  }
  if (drag.lock === "x") return;
  let n = Math.max(0, Math.min(1, drag.n0 - dy / drag.px));
  if (drag.steps > 1) n = Math.round(n * (drag.steps - 1)) / (drag.steps - 1);
  drag.n = n;
  MC.set(drag.el, n);
  const b = $("#bubble"); b.textContent = Math.round(n * 100) + "%"; b.classList.add("on");
  b.style.left = (e.clientX + 14) + "px"; b.style.top = (e.clientY - 50) + "px";
  clearTimeout(sendTimer);
  sendTimer = setTimeout(sendDrag, 40);
});
function sendDrag() { if (drag && drag.lock === "y") command("mix.set", {norms: [[drag.key, drag.n]]}); }
function swiped(dx, dy) {
  if (!narrow() || Math.abs(dx) < 50 || Math.abs(dx) < Math.abs(dy) * 1.5 || !S.state || !S.desk) return;
  const {entry, at} = current(), to = entry.hw[at + (dx < 0 ? 1 : -1)];
  swipedAt = Date.now();
  if (to !== undefined) armPage(to);
}
function endTouch(e, cancelled) {
  const d = drag, s = swipe;
  drag = swipe = null;
  if (d) {
    clearTimeout(sendTimer); $("#bubble").classList.remove("on");
    if (d.lock === "y" && !cancelled) command("mix.set", {norms: [[d.key, d.n]]});
    else if (d.lock === "x" && !cancelled) swiped(e.clientX - d.x, e.clientY - d.y);
    else if (d.lock === "y") renderDesk();
  } else if (s && !cancelled) swiped(e.clientX - s.x, e.clientY - s.y);
}
document.addEventListener("pointerup", e => endTouch(e, false));
document.addEventListener("pointercancel", e => endTouch(e, true));
// A swipe that ended on a pad is not a press of it.
document.addEventListener("click", e => { if (Date.now() - swipedAt < 400 && e.target.closest(".mlp")) { e.stopPropagation(); e.preventDefault(); } }, true);
// The keyboard moves a focused knob or fader: the arrows by a hundredth (or one stop), Page Up and Down by a tenth.
document.addEventListener("keydown", e => {
  const w = e.target.closest && e.target.closest(".mc.live .w[role=slider]"), el = w && w.closest(".mc");
  if (!el || !el.dataset.key) return;
  const steps = +el.dataset.steps, one = steps > 1 ? 1 / (steps - 1) : .01;
  const by = {ArrowUp: one, ArrowRight: one, ArrowDown: -one, ArrowLeft: -one, PageUp: .1, PageDown: -.1}[e.key];
  if (!by) return;
  e.preventDefault();
  const n = Math.max(0, Math.min(1, (+el.dataset.n || 0) + by));
  el.dataset.n = n; MC.set(el, n);
  command("mix.set", {norms: [[el.dataset.key, n]]});

// ---- waiting for Live: the loading line, and a page change that is not confirmed yet ------------------------------
// Changing the page takes about a second: the command waits its turn for Live, the pager in Live swaps what the
// MiniLab's controls are mapped to, and only then does the "page" event come back. Until it does, show it.
const WAIT = {page: 5000};  // ms before a page change is called failed
function busySync() {
  const m = $("#main");
  m.classList.toggle("is-loading", S.busy > 0 || !!S.pend);
  m.classList.toggle("is-pending", !!S.pend);
  m.setAttribute("aria-busy", S.busy > 0 || !!S.pend ? "true" : "false");
}
async function slowly(work) { S.busy++; busySync(); try { return await work(); } finally { S.busy--; busySync(); } }
function markPending() {
  const p = S.pend ? String(S.pend.page) : null;
  document.querySelectorAll("button[data-page]").forEach(b => {
    const on = p !== null && b.dataset.page === p;
    b.classList.toggle("is-waiting", on);
    if (on) b.setAttribute("aria-busy", "true"); else b.removeAttribute("aria-busy");
  });
}
function slowSay(text, retryPage) {
  const el = $("#slow");
  el.hidden = !text; if (!text) S.failed = null;
  el.innerHTML = text ? `<span>${esc(text)}</span>${retryPage === null ? "" : `<button class="key sm" id="slowretry" data-retry="${retryPage}">Retry</button>`}<button class="key sm" id="slowclose">Close</button>` : "";
}
function donePending() { if (S.pend) clearTimeout(S.pend.timer); S.pend = null; busySync(); markPending(); }
function armPage(page) {
  if (S.pend && S.pend.page === page) return;
  donePending(); slowSay("", null);
  if (S.state && S.state.page === page) { command("page.arm", {page}); return; }
  const mine = S.pend = {page, timer: setTimeout(() => { if (S.pend === mine) pageFailed(page, ""); }, WAIT.page)};
  busySync(); markPending();
  command("page.arm", {page}).then(r => { if (!r.ok && S.pend === mine) pageFailed(page, r.body.error || ""); },
                                   () => { if (S.pend === mine) pageFailed(page, "The app did not answer."); });
}
function pageFailed(page, why) {
  donePending(); S.failed = page;
  slowSay("The page did not change." + (why ? " " + why : ""), page);
}
// The state says which page is on: that is the confirmation.
function pageConfirmed() {
  if (S.pend && S.state && S.state.page === S.pend.page) { donePending(); slowSay("", null); }
  if (S.failed != null && S.state && S.state.page === S.failed) slowSay("", null);  // it came late

// ---- events ---------------------------------------------------------------------------------------------------------
function apply(m) {
  let part = "all";
  if (m.t === "full") S.state = m.state;
  else if (m.t === "hear") { S.hear = m; if (m.why === "touched") toast("Back on Now."); }
  else if (m.t === "hist") S.hist = m;
  else if (m.t === "options") { S.options = m; if (!S.optSel && m.options.length) S.optSel = m.options[0].id; }
  else if (m.t === "option") {
    const os = S.options.options, at = os.findIndex(o => o.id === m.option.id);
    if (at >= 0) os[at] = m.option; else os.unshift(m.option);
    if (!S.optSel) S.optSel = m.option.id;
    if (S.options.shown && S.options.shown.option === m.option.id) {
      const v = m.option.versions.find(x => x.id === S.options.shown.version.id);
      if (v) S.options.shown.version = v;
    }
  }
  else if (m.t === "meter") { S.meter = m; return renderTop(); }
  else if (m.t === "v" && S.state) {
    S.state.values[`${m.page}:${m.slot}`] = {...(S.state.values[`${m.page}:${m.slot}`] || {}), n: m.n, s: m.s, r: m.r, key: m.key};
    part = "desk";
  }
  else if (m.t === "pos" && S.state) {
