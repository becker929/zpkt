<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>Ask</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="/app/ask/zpkt/zpkt.css">
<link rel="stylesheet" href="/app/ask/zpkt/work.css">
<style>
/* Flat, bone and black with one accent (acid lime). Text on the accent is always --acc-ink. The same tokens as
   /app/shell/shell.css, which loads after this block and wins where both speak: the page still reads without it. */
:root{--bg:#f1eee6;--panel:#fff;--ink:#111;--mute:#6a6963;--line:#111;--hair:#d9d7d0;--accent:#c6f432;--acc:#c6f432;--acc-ink:#111;--stop:#e5332a;--user:#fff;--code:#e8e4d9;--danger:#b3261e;--ok:#111;--warn:#111;--okbg:#f3fbd0;--warnbg:#fff;--badbg:#fff;--tabs-h:52px}
@media (prefers-color-scheme:dark){:root{--bg:#121212;--panel:#1c1c1c;--ink:#f2f2ee;--mute:#9c9b95;--line:#4a4a4a;--hair:#3d3d40;--user:#262626;--code:#1e1e1e;--danger:#ff7a70;--ok:#c6f432;--warn:#f2f2ee;--okbg:#232b0c;--warnbg:#1c1c1c;--badbg:#1c1c1c}}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font:16px/1.5 'Helvetica Neue',Helvetica,Arial,sans-serif;display:flex;overflow:hidden}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0}
select,input,textarea{font:inherit;color:inherit}
a{color:var(--ink);text-underline-offset:2px}
#main{flex:1;min-width:0;display:flex;flex-direction:column;height:100dvh}
/* The tab bar when /app/shell/ did not load: three plain links, last in the column. */
#tabs{display:flex;flex:none;background:var(--panel);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom);font-size:12px}
#tabs.fallback a{flex:1;min-width:44px;height:var(--tabs-h);display:flex;align-items:center;justify-content:center;color:var(--mute);text-decoration:none;font-weight:500}
#tabs.fallback a.on{color:var(--ink);font-weight:700;box-shadow:inset 0 3px 0 var(--acc)}
#top{display:flex;align-items:center;gap:6px;padding:calc(4px + env(safe-area-inset-top)) max(8px,env(safe-area-inset-right)) 4px max(14px,env(safe-area-inset-left));border-bottom:1px solid var(--line);background:var(--panel);flex:none;min-height:52px}
#tabs[data-at="top"]~#top,#main:has(#tabs[data-at="top"]) #top{padding-top:4px}
#hd{flex:1;min-width:0}
#hd h1{font-size:16px;margin:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#hd small{display:block;color:var(--mute);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-height:18px}
#listen{flex:none;display:flex;align-items:center}
#listen:empty{display:none}
.ib{min-width:44px;height:44px;display:flex;align-items:center;justify-content:center;gap:6px;border-radius:10px;flex:none;color:var(--mute);font-size:13px;padding:0 8px}
.ib:hover{color:var(--ink)}.ib:active{background:var(--bg)}
#msgs{flex:1;overflow-y:auto;overflow-x:hidden;padding:16px 12px;-webkit-overflow-scrolling:touch}
.wrap{max-width:780px;margin:0 auto}
.m{margin:0 0 14px;display:flex;flex-direction:column}
.m.user{align-items:flex-end}
.bubble{max-width:100%;overflow-wrap:anywhere}
.m.user .bubble{background:var(--user);border:1.5px solid var(--line);padding:8px 13px;border-radius:10px;max-width:88%;white-space:pre-wrap}
.m.user .meta{font-size:12px;color:var(--mute);margin-top:3px}
.m.user.pending .bubble{opacity:.75}
.m.model .bubble>:first-child{margin-top:0}.m.model .bubble>:last-child{margin-bottom:0}
.aud{margin:.7em 0}.aud audio{display:block;width:100%;max-width:420px}.aud figcaption{font-size:12px;color:var(--mute);margin-top:2px;overflow-wrap:anywhere;display:flex;gap:10px;align-items:center;justify-content:space-between}.aud .dl{display:inline-flex;align-items:center;min-height:44px;padding:0 10px;color:inherit;font-weight:600}
.bubble p{margin:.6em 0}.bubble h1,.bubble h2,.bubble h3,.bubble h4{margin:1em 0 .4em;line-height:1.25}
.bubble h1{font-size:1.35em}.bubble h2{font-size:1.2em}.bubble h3,.bubble h4{font-size:1.05em}
.bubble ul,.bubble ol{padding-left:1.4em;margin:.5em 0}
.bubble blockquote{margin:.6em 0;padding-left:12px;border-left:3px solid var(--line);color:var(--mute)}
.bubble code,.mono{background:var(--code);padding:.1em .35em;border-radius:5px;font:0.88em ui-monospace,Menlo,Consolas,monospace}
.bubble pre,pre.out{position:relative;background:var(--code);border:1px solid var(--line);border-radius:10px;padding:12px;overflow:auto;margin:.7em 0;font:12.5px/1.45 ui-monospace,Menlo,Consolas,monospace;white-space:pre}
.bubble pre code{background:none;padding:0;font-size:13px;white-space:pre}
pre.out{max-height:50vh;white-space:pre-wrap;overflow-wrap:anywhere}
.cp{position:absolute;top:6px;right:6px;font-size:12px;color:var(--mute);background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:2px 8px}
.tbl{overflow:auto;margin:.7em 0}
table{border-collapse:collapse;font-size:14.5px}th,td{border:1px solid var(--line);padding:6px 10px;text-align:left}th{background:var(--code)}
details.tool{margin:0 0 8px;border:1px solid var(--line);border-radius:10px;background:var(--panel);font-size:14px}
details.tool summary{list-style:none;cursor:pointer;padding:7px 10px;display:flex;gap:8px;align-items:baseline;min-width:0}
details summary::-webkit-details-marker{display:none}
.tool .nm{font:13px ui-monospace,Menlo,monospace;font-weight:600;flex:none}
.tool .arg{color:var(--mute);font:13px ui-monospace,Menlo,monospace;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1;min-width:0}
.tool .st{flex:none;font-size:12px}
.tool .st.success{color:var(--ok)}.tool .st.error{color:var(--danger)}
details.tool pre{margin:0 10px 10px}
.stats{font-size:12px;color:var(--mute);margin:-4px 0 18px;display:flex;flex-wrap:wrap;gap:4px 12px;align-items:center}
.stats>span{display:inline-flex;align-items:center;gap:4px}
.stats svg{flex:none;display:block}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%);white-space:nowrap}
.err{color:var(--danger);font-size:14px;margin:0 0 12px;white-space:pre-wrap;overflow-wrap:anywhere}
.err details{color:var(--mute);font-size:12.5px}
.err summary{display:inline-flex;align-items:center;min-height:44px;cursor:pointer;text-decoration:underline;text-underline-offset:2px}
.err details pre{margin:0;white-space:pre-wrap;font:12px/1.4 ui-monospace,Menlo,monospace}
.note,.rnote{color:var(--mute);font-size:14px;margin:0 0 12px}
.card{padding:10px 12px;margin:0 0 14px;font-size:14px;border:1.5px solid var(--line)}
.card.warn{background:var(--warnbg);border-color:color-mix(in srgb,var(--warn) 35%,transparent)}
.card b{display:block;margin-bottom:2px}
.perm-options{display:flex;gap:8px;margin-top:8px;flex-wrap:wrap}
.perm-options button{min-height:44px;padding:0 16px;border:1.5px solid var(--line);border-radius:8px;background:var(--panel);font-weight:600}
/* A change that waits for a tap (propose_live): why, each step on one line, two buttons, then what came of it. */
.card.prop{padding:12px;border-radius:12px;background:var(--panel)}
.card .prop-why{font-size:16px;line-height:1.25;margin:0 0 8px;overflow-wrap:anywhere}
.prop-steps{list-style:none;margin:0;padding:0;border-top:1px solid var(--hair)}
.prop-steps li{display:grid;grid-template-columns:20px minmax(0,1fr) auto;gap:2px 8px;align-items:start;padding:7px 0;border-bottom:1px solid var(--hair)}
.prop-n{font:12px/20px ui-monospace,Menlo,monospace;color:var(--mute);text-align:right;min-height:20px}
.prop-n svg{display:block;margin:3px 0 0 auto}
.prop-text{overflow-wrap:anywhere;line-height:20px}
.prop-keep{display:inline-flex;align-items:center;gap:4px;font-size:11.5px;line-height:18px;white-space:nowrap;color:var(--mute);border:1px solid var(--mute);border-radius:999px;padding:0 7px 0 5px}
.prop-keep svg{flex:none}
.prop-code{grid-column:2 / -1;min-width:0;margin:4px 0 0;max-height:132px;overflow:auto;background:var(--code);border:1px solid var(--hair);border-radius:8px;padding:8px;font:12px/1.45 ui-monospace,Menlo,Consolas,monospace;white-space:pre;-webkit-overflow-scrolling:touch;overscroll-behavior:contain}
.prop li[data-step="done"] .prop-n{color:var(--ink)}
.prop li[data-step="failed"] .prop-n,.prop li[data-step="failed"] .prop-text{color:var(--danger)}
.prop li[data-step="skipped"] .prop-text{color:var(--mute)}
.prop .perm-options{margin-top:10px;flex-wrap:nowrap}
.prop .perm-options[hidden],.prop-state[hidden]{display:none}
.prop .perm-options button{flex:1;min-width:0;display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px}
.prop .perm-options button.do{background:var(--acc);color:var(--acc-ink)}
.prop .perm-options button:disabled{opacity:.5}
.prop .perm-options button:active:not(:disabled){transform:translateY(1px)}
.prop-state{display:flex;align-items:flex-start;gap:8px;margin-top:10px;font-weight:700;line-height:20px}
.prop-state svg{flex:none;margin-top:1px}
.prop-state small{display:block;font-weight:400;font-size:13px;color:var(--mute);overflow-wrap:anywhere}
.prop[data-state="failed"] .prop-state{color:var(--danger)}
/* A code step can be kept as an ability ("Always"): its name with this run's values, what it would replace, what it uses. */
.prop-sig,.prop-more{grid-column:2 / -1;min-width:0;overflow-wrap:anywhere}
.prop-sig{font:12px/1.45 ui-monospace,Menlo,Consolas,monospace;color:var(--mute)}
.prop-name{color:var(--ink);font-weight:600}
.prop-more{display:flex;flex-wrap:wrap;align-items:center;gap:4px 6px;font-size:12px;color:var(--mute)}
.prop-more svg{flex:none}
.prop-rep{display:inline-flex;align-items:center;gap:4px;color:var(--ink)}
.chip{font:11.5px/18px ui-monospace,Menlo,Consolas,monospace;color:var(--ink);background:var(--code);border-radius:999px;padding:0 8px;white-space:nowrap}
.prop .perm-options button.always{background:var(--ink);color:var(--bg)}
.prop .perm-options button{padding:0 8px}
/* The abilities, in the sheet: what the agent may run without asking, each with its code and a key that takes it away. */
.ab-head{display:flex;align-items:baseline;gap:8px;margin:20px 0 4px}
.ab-head h3{margin:0;flex:1}
.ab-head small{color:var(--mute);font-size:12.5px}
.ab{display:grid;grid-template-columns:minmax(0,1fr) 44px;gap:0 6px;align-items:start;border-bottom:1px solid var(--hair);padding:4px 0}
.ab details{min-width:0}
.ab summary{list-style:none;cursor:pointer;min-height:44px;display:flex;flex-direction:column;justify-content:center;gap:2px;padding:4px 0}
.ab summary b{font:600 13.5px ui-monospace,Menlo,Consolas,monospace;overflow-wrap:anywhere}
.ab-name{display:flex;align-items:center;gap:6px;min-width:0}
.ab-chev{flex:none;color:var(--mute);transition:transform .15s}
.ab details[open] .ab-chev{transform:rotate(90deg)}
.ab summary span{font-size:13.5px;line-height:1.35;overflow-wrap:anywhere}
.ab-par{display:block;font:12px/1.45 ui-monospace,Menlo,Consolas,monospace;color:var(--mute);overflow-wrap:anywhere}
.ab-meta{display:flex;flex-wrap:wrap;align-items:center;gap:4px 6px;font-size:12px;color:var(--mute);margin-top:2px}
.ab-meta .bad{display:inline-flex;align-items:center;gap:4px;color:var(--danger);font-weight:600}
.ab pre{margin:4px 0 6px;max-height:132px;overflow:auto;background:var(--code);border:1px solid var(--hair);border-radius:8px;padding:8px;font:12px/1.45 ui-monospace,Menlo,Consolas,monospace;white-space:pre;overscroll-behavior:contain}
.ab-rm{width:44px;height:44px;display:grid;place-items:center;border:1.5px solid var(--line);border-radius:8px;color:var(--ink);background:var(--panel)}
.ab-rm:active{transform:translateY(1px)}
.ab-rm:disabled{opacity:.4}
.dots::after{content:"";display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--mute);animation:b 1s infinite}
@keyframes b{50%{opacity:.2}}
@media (prefers-reduced-motion:reduce){.dots::after{animation:none}}
/* Nothing said yet: example requests. A tap puts one in the box. */
#empty{display:flex;flex-wrap:wrap;justify-content:center;gap:8px;max-width:560px;margin:8vh auto 0;padding:0 4px}
.eg{min-height:44px;padding:8px 16px;border:1.5px solid var(--line);border-radius:22px;background:var(--panel);text-align:left;line-height:1.3}
.eg:hover{box-shadow:inset 0 -3px 0 var(--acc)}
.eg:active{transform:translateY(1px)}
.eg:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
#older{display:block;margin:0 auto 14px;min-height:44px;padding:0 16px;color:var(--mute);font-size:13px;text-decoration:underline;text-underline-offset:2px}
#older[hidden]{display:none}
/* A page an agent made: a link, drawn as a card with a small map of the MiniLab (lit = mapped, grey = not). */
a.pcard{display:flex;align-items:center;gap:12px;width:fit-content;max-width:100%;min-height:64px;margin:.5em 0;padding:8px 14px 8px 10px;border:1.5px solid var(--line);border-radius:12px;background:var(--panel);text-decoration:none;color:var(--ink)}
a.pcard:hover{box-shadow:inset 0 -3px 0 var(--acc)}
a.pcard:active{transform:translateY(1px)}
.pthumb{flex:none;display:block;line-height:0}
.pthumb:empty{display:none}
.pthumb svg{display:block;width:108px;height:50px}
.pthumb .on{fill:var(--acc);stroke:var(--ink);stroke-width:1}
.pthumb .off{fill:var(--hair)}
.ptext{min-width:0;display:flex;flex-direction:column}
.ptext b{font-weight:700;overflow-wrap:anywhere;line-height:1.25}
.ptext small{color:var(--mute);font-size:12.5px;text-decoration:underline;text-underline-offset:2px}
/* What a transcript from before pages shows where a control panel was. */
.oldpanel{margin:.6em 0;padding:8px 12px;border:1px dashed var(--mute);border-radius:10px;color:var(--mute);font-size:13.5px}
.oldpanel b{display:block;color:var(--ink);font-weight:600}
/* Where the earlier conversation was summarised: a quiet divider that opens. */
.cmp{margin:6px 0 16px;font-size:13px;color:var(--mute)}
.cmp>summary,.cmp.line{display:flex;align-items:center;gap:10px;min-height:44px;cursor:pointer;list-style:none}
.cmp.line{cursor:default}
.cmp>summary::before,.cmp>summary::after,.cmp.line::before,.cmp.line::after{content:"";flex:1;height:1px;background:var(--hair)}
.cmp>summary span{text-decoration:underline;text-underline-offset:2px}
.cmp .bubble{border-left:3px solid var(--hair);padding:2px 0 2px 12px;color:var(--ink);font-size:14.5px}
.cmp .pages{margin-top:8px}
#bar{padding:8px 12px 8px;background:var(--bg);position:relative;flex:none}
#robar{flex:none;padding:8px 12px;background:var(--panel);border-top:1px solid var(--line);display:flex;align-items:center;gap:10px;font-size:14px;color:var(--mute)}
#robar[hidden],#bar[hidden]{display:none}
#robar span{flex:1;min-width:0}
#robar button{flex:none;min-height:44px;padding:0 14px;border:1.5px solid var(--line);border-radius:8px;background:var(--acc);color:var(--acc-ink);font-weight:700}
#box{display:flex;align-items:flex-end;gap:4px;background:var(--panel);border:1.5px solid var(--line);border-radius:8px;padding:4px}
#mode.yolo{border-color:var(--danger);color:var(--danger)}
#in{flex:1;min-width:0;border:0;background:none;resize:none;outline:0;max-height:30vh;padding:10px 8px;min-height:44px}
#send{width:44px;height:44px;border-radius:4px;background:var(--accent);color:var(--acc-ink);border:1.5px solid var(--line);display:grid;place-items:center;flex:none;transition:transform .08s}
#send:active:not(:disabled){transform:scale(.88)}
#send:disabled{opacity:.4}
#hint{font-size:12px;color:var(--mute);text-align:center;margin-top:4px}
#hint:empty{display:none}
.sheet{position:fixed;inset:0;background:#0007;display:none;align-items:flex-end;justify-content:center;z-index:20}
.sheet.open{display:flex}
.sheet>div{background:var(--panel);width:100%;max-width:640px;border-radius:18px 18px 0 0;padding:18px 18px calc(18px + env(safe-area-inset-bottom));max-height:90dvh;overflow:auto}
.sheet h3{margin:0 0 4px}
.sheet p.sub{margin:0 0 12px;color:var(--mute);font-size:14px}
.sheet label{display:block;font-size:13px;color:var(--mute);margin:16px 0 4px}
.sheet select{width:100%;min-height:44px;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px}
.row{display:flex;gap:8px;margin-top:16px}
.row button{flex:1;min-height:44px;padding:10px;border-radius:10px;border:1px solid var(--line)}
.old{display:block;width:100%;text-align:left;min-height:48px;padding:7px 0;border-bottom:1px solid var(--hair)}
.old b{display:block;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.old small{display:block;color:var(--mute);font-size:12px}
#toast{pointer-events:none;position:fixed;left:50%;bottom:calc(150px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:9px 14px;border-radius:10px;font-size:14px;z-index:30;display:none;max-width:90vw}
#below{position:absolute;left:50%;transform:translateX(-50%);bottom:calc(100% + 10px);z-index:5;background:var(--ink);color:var(--bg);border-radius:999px;padding:6px 14px;font-size:13px;font-weight:600;display:flex;align-items:center;gap:6px}
#below[hidden]{display:none}
@media (max-width:380px){#msgs{padding-left:8px;padding-right:8px}}
/* Inside /app/ (the Ask tab is this page in a frame): the app has the tab bar, the title and Listen. The header
   shows only for an earlier chat, to name it; the earlier-chats button sits with the composer's tools. */
.embedded #top{display:none}
.embedded.ro #top{display:flex;min-height:44px;padding-top:4px}
.embedded #toast{bottom:120px}
</style>

<body>
<main id="main">
  <header id="top">
    <div id="hd"><h1 id="title">Ask</h1><small id="sub"></small></div>
    <span id="listen"></span>
    <button class="ib" id="moreBtn" aria-label="Earlier chats, abilities and folder" title="Earlier chats, abilities and folder"><svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4.5 12a7.5 7.5 0 1 0 2.3-5.4M4.5 4.5v3.6h3.6M12 8v4.3l2.8 1.7"/></svg></button>
  </header>
  <div id="msgs"><div class="wrap"><button id="older" hidden>Show earlier messages</button><div id="thread"></div></div></div>
  <div id="bar"><button id="below" hidden>New below <svg viewBox="0 0 20 20" width="14" height="14" aria-hidden="true"><path d="M10 4v11.5M5 11l5 5 5-5" fill="none" stroke="currentColor" stroke-width="2.2"/></svg></button><div class="wrap">
    <div id="dock"></div>
    <div id="tools">
      <select id="engine" aria-label="Agent"><option value="claude">Claude Code</option><option value="gemini">Gemini CLI</option></select>
      <span class="sp"></span><span id="ztools"></span>
    </div>
    <div id="chips" hidden></div>
    <div id="box">
      <textarea id="in" rows="1" placeholder="Ask the agent" enterkeyhint="send"></textarea>
      <button id="send" aria-label="Send"><svg viewBox="0 0 20 20" width="20" height="20" aria-hidden="true"><path d="M10 16V4.5M5 9l5-5 5 5" fill="none" stroke="currentColor" stroke-width="2.2"/></svg></button>
    </div>
    <div id="hint"></div>
  </div></div>
  <div id="robar" hidden><span>An earlier chat. You can read it, not add to it.</span><button id="backBtn">Back to the conversation</button></div>
  <nav id="tabs" data-current="ask"></nav>
</main>
<aside id="drawer" aria-label="Subagent" hidden></aside>

<div class="sheet" id="moreSheet"><div>
  <h3>Earlier chats</h3>
  <p class="sub">Chats from before Ask became one long conversation. They can be read, not added to.</p>
  <div id="oldList"></div>
  <div class="ab-head"><h3>Abilities</h3><small id="abCount"></small></div>
  <div id="abList"></div>
  <label for="ws">Folder the agent works in. Each folder has its own conversation.</label>
  <select id="ws"></select>
  <div class="row"><button data-close>Close</button></div>
</div></div>
<div id="toast" role="status"></div>

<script>
// Ask is a tab inside /app/: that page shows this one in a frame (EMBEDDED), which then has no tab bar, title or
// Listen button of its own. Opened by itself it goes on to /app/#ask. /app/ask/?bare=1 stays: the page alone.
const EMBEDDED = (() => {
  const q = new URLSearchParams(location.search);
  let framed = true;
  try { framed = window.self !== window.top; } catch { /* another origin's frame */ }
  if (framed || q.get('embedded') === '1') return true;
  if (q.get('bare') !== '1') {
    if (q.has('dev')) { try { localStorage.setItem('ask.dev', JSON.stringify(q.get('dev') !== '0' && q.get('dev') !== 'false')); } catch {} }
    window.LEAVING = true;
    location.replace('/app/#ask');
  }
  return false;
})();
if (EMBEDDED) {
  document.documentElement.classList.add('embedded');
  for (const id of ['listen', 'tabs']) document.getElementById(id).remove();
}

    const say = (t) => { const w = document.createElement('span'); w.textContent = t; meta.append(w); };
    const chips = (word, names) => { if (!(names || []).length) return; say(word); for (const n of names) { const c = document.createElement('span'); c.className = 'chip'; c.textContent = n; meta.append(c); } };
    if ((a.missing || []).length) { const bad = document.createElement('span'); bad.className = 'bad'; bad.innerHTML = PROP_ICON.warn; bad.append(` Broken: needs ${a.missing.join(', ')}`); meta.append(bad); }
    say(`${a.runs || 0} ${a.runs === 1 ? 'run' : 'runs'}`);
    chips('uses', a.uses); chips('used by', a.used_by);
    sum.append(meta);
    el.querySelector('pre').textContent = a.code;
    const rm = el.querySelector('.ab-rm');
    rm.innerHTML = PROP_ICON.bin; rm.setAttribute('aria-label', `Remove ${a.name}`); rm.title = `Remove ${a.name}`;
    rm.onclick = async () => {
      rm.disabled = true;
      try {
        const r = await fetch('/api/command', { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ kind: 'ability.remove', args: { name: a.name } }) });
        if (!r.ok && r.status !== 404) throw new Error((await r.json().catch(() => ({}))).error || `HTTP ${r.status}`);
        toast(`Removed ${a.name}`);
        await loadAbilities();   // what used it shows as broken now
      } catch (err) { toast(err.message); rm.disabled = false; }
    };
    list.append(el);
  }
}
async function loadAbilities() {
  try { const r = await api(`${API}/abilities`); renderAbilities(r.abilities || [], r.max || 0); } catch (e) { $('#abList').innerHTML = `<p class="err">${esc(e.message)}</p>`; }
}
$('#moreBtn').onclick = async () => {
  $('#moreSheet').classList.add('open'); renderOld(); loadAbilities();
  try { ARCHIVE = (await api(`${API}/archive?workspace=${encodeURIComponent(cfg.ws)}`)).sessions || []; renderOld(); } catch {}
};
$('#oldList').addEventListener('click', (e) => {
  const b = e.target.closest('[data-s]'); if (!b) return;
  $('#moreSheet').classList.remove('open');
  location.hash = 's=' + b.dataset.s;
});
$('#backBtn').onclick = () => { location.hash = ''; };
document.querySelectorAll('.sheet').forEach((s) => s.addEventListener('click', (e) => { if (e.target === s || e.target.closest('[data-close]')) s.classList.remove('open'); }));
document.addEventListener('keydown', (e) => { if (e.key === 'Escape') document.querySelector('.sheet.open')?.classList.remove('open'); });
window.addEventListener('hashchange', openView);
async function loadWorkspaces() {
  try { workspaces = (await api(`${API}/workspaces`)).workspaces; } catch (e) { toast(e.message); }
  if (!workspaces.some((w) => w.id === cfg.ws)) cfg.ws = workspaces[0]?.id || '';
  $('#ws').innerHTML = workspaces.map((w) => `<option value="${esc(w.id)}">${esc(w.name)}</option>`).join('') + '<option value="+">Add a folder…</option>';
  $('#ws').value = cfg.ws;
}
$('#ws').onchange = async () => {
  if ($('#ws').value === '+') {
    const p = prompt('Folder path (inside your home folder), e.g. ~/code/my-project');
    if (p) {
      try { const { workspace } = await api(`${API}/workspaces`, { method: 'POST', body: { path: p } }); await loadWorkspaces(); cfg.ws = workspace.id; }
      catch (e) { toast(e.message, 5000); }
    }
    $('#ws').value = cfg.ws;
  } else cfg.ws = $('#ws').value;
  saveCfg();
  if (MAIN?.workspace === cfg.ws) return;
  MAIN = null; V = null;   // another folder: its own conversation
  $('#moreSheet').classList.remove('open');
  if (location.hash) history.replaceState(null, '', location.pathname);
  openView();
};
async function loadEngineNames() {
  try {
    for (const g of (await api(`${API}/engines`)).engines || []) if (g.id in ENGINE_NAME && g.name) ENGINE_NAME[g.id] = g.name;
  } catch {}
}

(async () => {
  if (window.LEAVING) return;   // on its way to /app/#ask
  if (EMBEDDED) $('#tools').append($('#moreBtn'));   // no header in the app: earlier chats sit with the composer's tools
  await Promise.all([zpktReady, workReady]);
  Zpkt.init({ api, toast });
  Work.init({
    thread: $('#thread'), dock: $('#dock'), drawer: $('#drawer'), onStop: stopRun,
    onRoute: (agent) => { if (V) location.hash = [V.readonly ? 's=' + V.id : '', agent ? 'agent=' + agent : ''].filter(Boolean).join('&'); },   // Back closes the drawer
    onWrong: async (w) => { if (!V || V.readonly) return; try { await api(`${API}/sessions/${V.id}/summary`, { method: 'POST', body: w }); toast('Marked wrong. The line is gone.'); } catch (e) { toast(e.message); } },
  });
  Zpkt.mountComposer({ chipsEl: $('#chips'), toolsEl: $('#ztools'), inputEl: $('#in') });
  await Promise.all([loadWorkspaces(), loadEngineNames()]);
  openView();
})();
</script>
</body>
</html>
